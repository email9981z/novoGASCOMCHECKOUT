<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diskgas — Atendimento Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root {
  /* Cores Principais - Refinadas */
  --brand: #E8480C;
  --brand-dk: #C23A08;
  --brand-soft: rgba(232, 72, 12, 0.08);
  
  /* Neutros - Paleta Quente e Sofisticada */
  --bg: #F8F6F2;
  --surface: #FFFFFF;
  --text-main: #1A1714;
  --text-sec: #5C5650;
  --text-muted: #9A9288;
  
  /* Cores de Status */
  --green: #1DC75F;
  --green-soft: #F0FDF6;
  --green-text: #0DA04A;
  
  /* Sombras e Bordas */
  --border: #EAE4DA;
  --shadow-sm: 0 2px 8px rgba(26, 23, 20, 0.04);
  --shadow-md: 0 4px 16px rgba(26, 23, 20, 0.08);
  --shadow-lg: 0 12px 32px rgba(26, 23, 20, 0.12);
  
  /* Raio */
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #0D0C0B;
  height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 100px rgba(0,0,0,0.5);
}

/* Header */
.header {
  background: var(--surface);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  z-index: 10;
}

.h-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--brand-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: var(--brand);
  position: relative;
}

.h-status {
  position: absolute;
  bottom: 1px;
  right: 1px;
  width: 10px;
  height: 10px;
  background: var(--green);
  border: 2px solid #fff;
  border-radius: 50%;
}

.h-info .h-name { font-size: 15px; font-weight: 700; color: var(--text-main); }
.h-info .h-sub { font-size: 12px; color: var(--text-muted); }

/* Messages Area */
.msgs {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

/* System Message */
.sys-msg {
  align-self: center;
  text-align: center;
  max-width: 80%;
  animation: fadeIn 0.5s ease;
}
.sys-msg span {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  background: rgba(0,0,0,0.03);
  padding: 4px 12px;
  border-radius: 20px;
}

/* Spinner */
.spinner-container { display: flex; justify-content: center; padding: 10px; }
.spinner {
  width: 22px; height: 22px;
  border: 2.5px solid var(--brand-soft);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Message Rows */
.msg-row {
  display: flex;
  max-width: 85%;
  animation: msgIn 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
  flex-shrink: 0;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.msg-row.user {
  align-self: flex-end;
  justify-content: flex-end;
}

.msg-row.agent {
  align-self: flex-start;
  gap: 10px;
  align-items: flex-end;
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1.5px solid #fff;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}

.bubble {
  padding: 12px 16px;
  font-size: 14.5px;
  line-height: 1.5;
  position: relative;
  box-shadow: var(--shadow-sm);
}

.bubble.u {
  background: var(--brand);
  color: #fff;
  border-radius: 20px 20px 4px 20px;
}

.bubble.a {
  background: var(--surface);
  color: var(--text-main);
  border-radius: 20px 20px 20px 4px;
  border: 1px solid var(--border);
}

.b-meta {
  font-size: 10px;
  margin-top: 4px;
  opacity: 0.7;
  display: block;
  text-align: right;
}

/* Agent Intro Card - Professional Revision */
.agent-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  margin: 8px 0;
  animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  flex-shrink: 0;
}

@keyframes cardIn {
  from { opacity: 0; transform: scale(0.9) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.ac-header {
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  background: linear-gradient(to bottom right, #fff, var(--bg));
}

.ac-img-wrap { position: relative; }
.ac-img {
  width: 60px; height: 60px;
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: var(--shadow-sm);
}
.ac-online {
  position: absolute; bottom: 2px; right: 2px;
  width: 14px; height: 14px;
  background: var(--green);
  border: 2.5px solid #fff;
  border-radius: 50%;
}

.ac-name { font-size: 17px; font-weight: 700; color: var(--text-main); }
.ac-role { font-size: 13px; color: var(--brand); font-weight: 600; margin-top: 2px; }

.ac-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 16px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  gap: 1px;
}

.ac-stat { text-align: center; }
.ac-val { display: block; font-size: 15px; font-weight: 700; color: var(--text-main); }
.ac-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

/* Typing Indicator */
.typing {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 0 4px;
  animation: fadeIn 0.3s ease;
}

.t-bubble {
  background: var(--surface);
  padding: 12px 18px;
  border-radius: 18px 18px 18px 4px;
  border: 1px solid var(--border);
  display: flex;
  gap: 4px;
}

.t-dot {
  width: 6px; height: 6px;
  background: var(--text-muted);
  border-radius: 50%;
  opacity: 0.4;
  animation: tPulse 1.2s infinite;
}
.t-dot:nth-child(2) { animation-delay: 0.2s; }
.t-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes tPulse {
  0%, 100% { transform: translateY(0); opacity: 0.4; }
  50% { transform: translateY(-4px); opacity: 1; }
}

/* Footer */
.footer {
  padding: 16px 20px 30px;
  background: var(--surface);
  border-top: 1px solid var(--border);
}

.input-container {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg);
  padding: 10px 16px;
  border-radius: 30px;
  border: 1px solid var(--border);
}

.input-container input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-size: 15px;
  font-family: inherit;
  color: var(--text-main);
}

.send-btn {
  background: var(--brand);
  color: #fff;
  border: none;
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s ease;
}
.send-btn:active { transform: scale(0.9); }

</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="h-avatar">D<div class="h-status"></div></div>
    <div class="h-info">
      <div class="h-name">Diskgas Atendimento</div>
      <div class="h-sub">Suporte ao cliente</div>
    </div>
  </header>

  <div class="msgs" id="msgs">
    <!-- Content injected via JS -->
  </div>

  <div id="typingArea" style="display: none; padding: 0 16px 20px;">
    <div class="typing">
      <img src="https://i.pravatar.cc/100?u=carlos" class="msg-avatar" alt="Carlos">
      <div class="t-bubble">
        <div class="t-dot"></div>
        <div class="t-dot"></div>
        <div class="t-dot"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="input-container">
      <input type="text" id="msgInput" placeholder="Escreva sua mensagem...">
      <button class="send-btn" id="sendBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </footer>
</div>

<script>
const msgsEl = document.getElementById('msgs');
const inputEl = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const typingArea = document.getElementById('typingArea');

const AGENT_AVATAR = "https://i.pravatar.cc/100?u=carlos";
const now = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

function addMsg(text, type) {
  const row = document.createElement('div');
  row.className = `msg-row ${type}`;
  
  if (type === 'agent') {
    row.innerHTML = `
      <img src="${AGENT_AVATAR}" class="msg-avatar">
      <div class="bubble a">
        ${text}
        <span class="b-meta">${now()}</span>
      </div>
    `;
  } else {
    row.innerHTML = `
      <div class="bubble u">
        ${text}
        <span class="b-meta">${now()}</span>
      </div>
    `;
  }
  
  msgsEl.appendChild(row);
  scrollToBottom();
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'sys-msg';
  const span = document.createElement('span');
  span.innerText = text;
  div.appendChild(span);
  msgsEl.appendChild(div);
  scrollToBottom();
  return span;
}

function showSpinner() {
  const div = document.createElement('div');
  div.className = 'spinner-container';
  div.innerHTML = '<div class="spinner"></div>';
  msgsEl.appendChild(div);
  scrollToBottom();
  return div;
}

function showAgentCard() {
  const card = document.createElement('div');
  card.className = 'agent-card';
  card.innerHTML = `
    <div class="ac-header">
      <div class="ac-img-wrap">
        <img src="${AGENT_AVATAR}" class="ac-img">
        <div class="ac-online"></div>
      </div>
      <div class="ac-info">
        <div class="ac-name">Carlos Oliveira</div>
        <div class="ac-role">Consultor Especialista</div>
      </div>
    </div>
    <div class="ac-stats">
      <div class="ac-stat">
        <span class="ac-val">+1.2k</span>
        <span class="ac-lbl">Atendimentos</span>
      </div>
      <div class="ac-stat">
        <span class="ac-val">4.9/5</span>
        <span class="ac-lbl">Avaliação</span>
      </div>
    </div>
  `;
  msgsEl.appendChild(card);
  scrollToBottom();
}

function scrollToBottom() {
  setTimeout(() => {
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }, 50);
}

async function startFlow() {
  // 1. Início
  addSystemMsg("Iniciando atendimento...");
  await new Promise(r => setTimeout(r, 1200));
  
  // 2. Mensagem Automática do Usuário
  addMsg("Olá! Gostaria de fazer um pedido.", "user");
  await new Promise(r => setTimeout(r, 800));
  
  // 3. Localizando
  const sysSpan = addSystemMsg("Localizando consultor...");
  const spinner = showSpinner();
  await new Promise(r => setTimeout(r, 2000));
  
  // 4. Localizado
  spinner.remove();
  sysSpan.innerText = "Consultor localizado ✓";
  sysSpan.style.color = "var(--green-text)";
  sysSpan.style.background = "var(--green-soft)";
  
  await new Promise(r => setTimeout(r, 800));
  showAgentCard();
  
  // 5. Digitando
  await new Promise(r => setTimeout(r, 1200));
  typingArea.style.display = 'block';
  scrollToBottom();
  
  // 6. Resposta
  await new Promise(r => setTimeout(r, 3000));
  typingArea.style.display = 'none';
  addMsg("Olá! Sou o Carlos. É um prazer te atender. Como posso te ajudar com seu pedido de hoje?", "agent");
}

window.onload = startFlow;

sendBtn.onclick = () => {
  const val = inputEl.value.trim();
  if (val) {
    addMsg(val, "user");
    inputEl.value = "";
  }
};

inputEl.onkeypress = (e) => { if(e.key === 'Enter') sendBtn.click(); };

</script>
</body>
</html>
