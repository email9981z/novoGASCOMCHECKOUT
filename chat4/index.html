<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diskgas — Atendimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --brand:       #E8480C;
  --brand-dk:    #C03A09;
  --brand-lt:    rgba(232,72,12,0.09);
  --brand-xlt:   rgba(232,72,12,0.04);

  --bg:          #F1EDE6;
  --surface:     #FFFFFF;

  --text-100:    #16110E;
  --text-200:    #4A4039;
  --text-300:    #7B6F68;
  --text-400:    #AFA89F;

  --green:       #16A34A;
  --green-soft:  #DCFCE7;

  --border-100:  #DDD6CE;
  --border-200:  #EBE6E0;

  --sh-xs:  0 1px 3px rgba(22,17,14,0.05);
  --sh-sm:  0 2px 8px rgba(22,17,14,0.07), 0 1px 2px rgba(22,17,14,0.04);
  --sh-md:  0 6px 20px rgba(22,17,14,0.09), 0 2px 6px rgba(22,17,14,0.05);
  --sh-card:0 10px 36px rgba(22,17,14,0.11), 0 2px 8px rgba(22,17,14,0.06);

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
}

body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: #0A0806;
  height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ── APP SHELL ─────────────────── */
.app {
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 90px rgba(0,0,0,0.55), 0 0 240px rgba(232,72,12,0.07);
}

/* ── HEADER ────────────────────── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border-200);
  flex-shrink: 0;
  z-index: 20;
}

.header-bar {
  height: 3.5px;
  background: linear-gradient(90deg, var(--brand-dk) 0%, var(--brand) 55%, #F5783C 100%);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 18px 14px;
}

.h-logo {
  width: 40px;
  height: 40px;
  border-radius: var(--r-sm);
  background: var(--brand);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 3px 10px rgba(232,72,12,0.32);
}

.h-logo-letter {
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.5px;
  line-height: 1;
}

.h-info { flex: 1; min-width: 0; }

.h-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-100);
  letter-spacing: -0.25px;
}

.h-sub-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 2px;
}

.h-pulse {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
  animation: pulseGlow 2.8s ease infinite;
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(22,163,74,0.4); }
  50%       { box-shadow: 0 0 0 5px rgba(22,163,74,0); }
}

.h-sub-text {
  font-size: 12px;
  font-weight: 600;
  color: var(--green);
}

.h-badge {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--brand-xlt);
  border: 1px solid rgba(232,72,12,0.14);
  padding: 4px 10px;
  border-radius: 100px;
}

.h-badge-icon {
  width: 10px;
  height: 10px;
  stroke: var(--brand);
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.h-badge-text {
  font-size: 10px;
  font-weight: 700;
  color: var(--brand);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

/* ── MESSAGES ──────────────────── */
.msgs {
  flex: 1;
  overflow-y: auto;
  padding: 18px 15px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  scroll-behavior: smooth;
}

.msgs::-webkit-scrollbar { width: 3px; }
.msgs::-webkit-scrollbar-track { background: transparent; }
.msgs::-webkit-scrollbar-thumb { background: var(--border-100); border-radius: 2px; }

/* Date divider */
.date-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0 14px;
  animation: fadeUp 0.4s ease;
}
.date-divider::before,
.date-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-200);
}
.date-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-400);
  letter-spacing: 0.3px;
  white-space: nowrap;
}

/* System pill */
.sys-wrap {
  align-self: center;
  margin: 7px 0;
  animation: fadeUp 0.4s ease;
}
.sys-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-300);
  background: var(--surface);
  border: 1px solid var(--border-200);
  padding: 4px 12px;
  border-radius: 100px;
  box-shadow: var(--sh-xs);
}
.sys-pill.ok {
  color: var(--green);
  background: var(--green-soft);
  border-color: rgba(22,163,74,0.2);
}

/* Spinner */
.spin-wrap {
  align-self: center;
  padding: 6px 0;
}
.spin {
  width: 22px;
  height: 22px;
  border: 2.5px solid var(--border-200);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}

/* Message row */
.msg-row {
  display: flex;
  max-width: 83%;
  animation: msgIn 0.32s cubic-bezier(0.2, 0.9, 0.3, 1);
  margin-bottom: 2px;
}
.msg-row.user  { align-self: flex-end; justify-content: flex-end; }
.msg-row.agent { align-self: flex-start; align-items: flex-end; gap: 8px; }

@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0);    }
}

/* Agent avatar in rows */
.av {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  border: 2px solid var(--surface);
  box-shadow: var(--sh-xs);
}
.av.ghost { visibility: hidden; }

/* Bubble */
.bubble {
  padding: 11px 15px;
  font-size: 14.5px;
  line-height: 1.55;
  word-break: break-word;
}

.bubble.u {
  background: var(--brand);
  color: #fff;
  border-radius: 18px 4px 18px 18px;
  box-shadow: 0 2px 14px rgba(232,72,12,0.28);
}

.bubble.a {
  background: var(--surface);
  color: var(--text-100);
  border-radius: 4px 18px 18px 18px;
  border: 1px solid var(--border-200);
  box-shadow: var(--sh-xs);
}

.b-time {
  display: block;
  font-size: 10px;
  font-weight: 500;
  margin-top: 5px;
  text-align: right;
}
.bubble.u .b-time { color: rgba(255,255,255,0.65); }
.bubble.a .b-time { color: var(--text-400); }

/* ── AGENT CARD ─────────────────── */
.agent-card {
  align-self: flex-start;
  max-width: 88%;
  background: var(--surface);
  border-radius: var(--r-xl);
  border: 1px solid var(--border-100);
  box-shadow: var(--sh-card);
  overflow: hidden;
  margin: 6px 0 10px;
  animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes cardIn {
  from { opacity: 0; transform: scale(0.9) translateY(18px); }
  to   { opacity: 1; transform: scale(1)   translateY(0);    }
}

.ac-hero {
  padding: 20px 20px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  background: linear-gradient(140deg, #FFF4EE 0%, #FDE9D8 100%);
  position: relative;
  overflow: hidden;
}

.ac-hero::after {
  content: '';
  position: absolute;
  top: -30px;
  right: -30px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232,72,12,0.10) 0%, transparent 70%);
  pointer-events: none;
}

.ac-av-wrap { position: relative; flex-shrink: 0; }

.ac-av {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #fff;
  box-shadow: 0 4px 16px rgba(0,0,0,0.13);
  display: block;
}

.ac-check {
  position: absolute;
  bottom: -1px;
  right: -1px;
  width: 22px;
  height: 22px;
  background: var(--brand);
  border: 2.5px solid #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ac-check svg {
  width: 10px;
  height: 10px;
  stroke: #fff;
  fill: none;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.ac-info { flex: 1; min-width: 0; }

.ac-name {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-100);
  letter-spacing: -0.35px;
}

.ac-role {
  font-size: 12px;
  font-weight: 600;
  color: var(--brand);
  margin-top: 2px;
}

.ac-avail {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--green-soft);
  border: 1px solid rgba(22,163,74,0.18);
  padding: 3px 9px;
  border-radius: 100px;
  margin-top: 7px;
}
.ac-avail-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
}
.ac-avail-text {
  font-size: 10px;
  font-weight: 700;
  color: var(--green);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.ac-sep { height: 1px; background: var(--border-200); margin: 0 20px; }

.ac-stats {
  display: grid;
  grid-template-columns: 1fr 1px 1fr;
  align-items: stretch;
}

.ac-vline {
  background: var(--border-200);
  margin: 14px 0;
}

.ac-stat { padding: 16px 14px; text-align: center; }

.ac-val {
  display: block;
  font-size: 19px;
  font-weight: 800;
  color: var(--text-100);
  letter-spacing: -0.5px;
}

.ac-stars {
  display: flex;
  justify-content: center;
  gap: 1px;
  margin-top: 2px;
  margin-bottom: 1px;
}
.ac-star { color: #F59E0B; font-size: 12px; line-height: 1; }

.ac-lbl {
  display: block;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-400);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 3px;
}

/* ── TYPING ─────────────────────── */
.typing-wrap {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 0 15px 10px;
  animation: fadeUp 0.3s ease;
}

.t-bubble {
  background: var(--surface);
  border: 1px solid var(--border-200);
  border-radius: 4px 18px 18px 18px;
  padding: 13px 18px;
  display: flex;
  gap: 4px;
  align-items: center;
  box-shadow: var(--sh-xs);
}

.t-dot {
  width: 6px;
  height: 6px;
  background: var(--text-400);
  border-radius: 50%;
  animation: bounce 1.3s ease infinite;
}
.t-dot:nth-child(2) { animation-delay: 0.15s; }
.t-dot:nth-child(3) { animation-delay: 0.30s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0);    opacity: 0.45; }
  30%            { transform: translateY(-5px); opacity: 1;    }
}

/* ── FOOTER ─────────────────────── */
.footer {
  background: var(--surface);
  border-top: 1px solid var(--border-200);
  padding: 13px 15px 28px;
  flex-shrink: 0;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--bg);
  border: 1.5px solid var(--border-100);
  border-radius: 100px;
  padding: 8px 8px 8px 18px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.input-row:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(232,72,12,0.09);
}

.input-row input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-size: 14.5px;
  font-family: inherit;
  color: var(--text-100);
  min-width: 0;
}
.input-row input::placeholder { color: var(--text-400); }

.send-btn {
  width: 37px;
  height: 37px;
  border-radius: 50%;
  border: none;
  background: var(--brand);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  box-shadow: 0 2px 10px rgba(232,72,12,0.32);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.send-btn:hover  { transform: scale(1.07); box-shadow: 0 4px 14px rgba(232,72,12,0.42); }
.send-btn:active { transform: scale(0.92); }

.send-btn svg {
  width: 15px;
  height: 15px;
  stroke: #fff;
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  margin-left: 2px;
}

.footer-note {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  margin-top: 10px;
}

.footer-note svg {
  width: 10px;
  height: 10px;
  stroke: var(--text-400);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.footer-note-text {
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-400);
}

/* ── ANIMATIONS ─────────────────── */
@keyframes spin    { to { transform: rotate(360deg); } }
@keyframes fadeUp  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-bar"></div>
    <div class="header-inner">
      <div class="h-logo">
        <span class="h-logo-letter">D</span>
      </div>
      <div class="h-info">
        <div class="h-name">Diskgas Atendimento</div>
        <div class="h-sub-row">
          <div class="h-pulse"></div>
          <span class="h-sub-text">Online agora</span>
        </div>
      </div>
      <div class="h-badge">
        <svg class="h-badge-icon" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span class="h-badge-text">Seguro</span>
      </div>
    </div>
  </header>

  <!-- MESSAGES -->
  <div class="msgs" id="msgs"></div>

  <!-- TYPING (hidden) -->
  <div id="typingArea" style="display:none;">
    <div class="typing-wrap">
      <img src="https://i.pravatar.cc/100?u=carlos" class="av">
      <div class="t-bubble">
        <div class="t-dot"></div>
        <div class="t-dot"></div>
        <div class="t-dot"></div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Escreva sua mensagem...">
      <button class="send-btn" id="sendBtn" aria-label="Enviar mensagem">
        <svg viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="footer-note">
      <svg viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span class="footer-note-text">Atendimento seguro e criptografado</span>
    </div>
  </footer>
</div>

<script>
const msgsEl    = document.getElementById('msgs');
const inputEl   = document.getElementById('msgInput');
const sendBtn   = document.getElementById('sendBtn');
const typingArea= document.getElementById('typingArea');

const AVATAR = "https://i.pravatar.cc/100?u=carlos";
const hhmm   = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

function addDateDivider(label) {
  const el = document.createElement('div');
  el.className = 'date-divider';
  el.innerHTML = `<span class="date-label">${label}</span>`;
  msgsEl.appendChild(el);
}

function addMsg(text, type) {
  const row = document.createElement('div');
  row.className = `msg-row ${type}`;

  if (type === 'agent') {
    row.innerHTML = `
      <img src="${AVATAR}" class="av" alt="Carlos">
      <div class="bubble a">${text}<span class="b-time">${hhmm()}</span></div>`;
  } else {
    row.innerHTML = `
      <div class="bubble u">${text}<span class="b-time">${hhmm()} ✓✓</span></div>`;
  }

  msgsEl.appendChild(row);
  scroll();
}

function addSysPill(text, ok = false) {
  const wrap = document.createElement('div');
  wrap.className = 'sys-wrap';
  const pill = document.createElement('span');
  pill.className = `sys-pill${ok ? ' ok' : ''}`;
  pill.innerText = text;
  wrap.appendChild(pill);
  msgsEl.appendChild(wrap);
  scroll();
  return pill;
}

function showSpinner() {
  const d = document.createElement('div');
  d.className = 'spin-wrap';
  d.innerHTML = '<div class="spin"></div>';
  msgsEl.appendChild(d);
  scroll();
  return d;
}

function showAgentCard() {
  const card = document.createElement('div');
  card.className = 'agent-card';
  card.innerHTML = `
    <div class="ac-hero">
      <div class="ac-av-wrap">
        <img src="${AVATAR}" class="ac-av" alt="Carlos Oliveira">
        <div class="ac-check">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </div>
      <div class="ac-info">
        <div class="ac-name">Carlos Oliveira</div>
        <div class="ac-role">Consultor Especialista</div>
        <div class="ac-avail">
          <div class="ac-avail-dot"></div>
          <span class="ac-avail-text">Disponível</span>
        </div>
      </div>
    </div>
    <div class="ac-sep"></div>
    <div class="ac-stats">
      <div class="ac-stat">
        <span class="ac-val">1.247</span>
        <span class="ac-lbl">Atendimentos</span>
      </div>
      <div class="ac-vline"></div>
      <div class="ac-stat">
        <span class="ac-val">4.9</span>
        <div class="ac-stars">
          <span class="ac-star">★</span><span class="ac-star">★</span><span class="ac-star">★</span><span class="ac-star">★</span><span class="ac-star">★</span>
        </div>
        <span class="ac-lbl">Avaliação</span>
      </div>
    </div>`;
  msgsEl.appendChild(card);
  scroll();
}

function scroll() {
  setTimeout(() => msgsEl.scrollTop = msgsEl.scrollHeight, 50);
}

async function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

async function startFlow() {
  addDateDivider("Hoje");
  await wait(900);

  addSysPill("Iniciando atendimento...");
  await wait(1100);

  addMsg("Olá! Gostaria de fazer um pedido.", "user");
  await wait(900);

  const locPill = addSysPill("Localizando consultor disponível...");
  const spinner = showSpinner();
  await wait(2300);

  spinner.remove();
  locPill.innerText  = "Consultor localizado ✓";
  locPill.className  = "sys-pill ok";
  await wait(750);

  showAgentCard();
  await wait(1100);

  typingArea.style.display = 'block';
  scroll();
  await wait(2900);

  typingArea.style.display = 'none';
  addMsg("Olá! Sou o Carlos, muito prazer. Como posso te ajudar com o seu pedido hoje?", "agent");
}

window.onload = startFlow;

sendBtn.onclick = () => {
  const val = inputEl.value.trim();
  if (!val) return;
  addMsg(val, "user");
  inputEl.value = "";
};

inputEl.onkeypress = e => { if (e.key === 'Enter') sendBtn.click(); };
</script>
</body>
</html>
