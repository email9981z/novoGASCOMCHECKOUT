<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Diskgas — Entrega Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --brand:    #0066CC;
      --brand-dk: #0052A3;
      --brand-lt: #E6F2FF;
      --bg:       #F3F4F6;
      --white:    #FFFFFF;
      --text:     #111827;
      --text-secondary: #374151;
      --muted:    #6B7280;
      --border:   #E5E7EB;
      --success:  #10B981;
      --warning:  #F59E0B;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ── APP SHELL ─────────────────────────────────── */
    .app {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* ── HEADER ────────────────────────────────────── */
    .header {
      background: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .h-agent { display: flex; align-items: center; gap: 12px; flex: 1; }
    .h-photo-wrap { position: relative; }
    .h-photo {
      width: 44px; height: 44px; border-radius: 50%;
      object-fit: cover; background: #E5E7EB;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .h-online-dot {
      position: absolute; bottom: 2px; right: 2px;
      width: 10px; height: 10px; background: var(--success);
      border: 2px solid white; border-radius: 50%;
      display: none;
    }

    .h-name-row { font-size: 15px; font-weight: 700; color: var(--text); }
    .h-sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
    .h-sub.online { color: var(--success); font-weight: 600; }

    /* ── PROGRESS BAR ── */
    .progress-container {
      height: 3px;
      background: #E5E7EB;
      width: 100%;
      position: relative;
      overflow: hidden;
      z-index: 9;
    }
    .progress-bar {
      height: 100%;
      background: var(--brand);
      width: 100%;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── MESSAGES ──────────────────────────────────── */
    .msgs {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #F9FAFB;
    }

    .msgs::-webkit-scrollbar {
      width: 6px;
    }

    .msgs::-webkit-scrollbar-track {
      background: transparent;
    }

    .msgs::-webkit-scrollbar-thumb {
      background: #D1D5DB;
      border-radius: 3px;
    }

    /* ── AGENT CARD (TRUST BUILDER) ────────────────── */
    .agent-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--brand-lt);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 8px;
      display: none;
      animation: slideDown 0.5s ease;
    }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

    .ac-header { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
    .ac-info h4 { font-size: 15px; font-weight: 700; color: var(--text); }
    .ac-badge { color: var(--brand); font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px; margin-top: 4px; }
    
    .ac-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ac-stat { background: var(--brand-lt); padding: 10px; border-radius: 10px; text-align: center; }
    .ac-stat-val { display: block; font-size: 14px; font-weight: 700; color: var(--brand); }
    .ac-stat-lbl { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

    /* ── BUBBLES ───────────────────────────────────── */
    .msg-row { display: flex; gap: 8px; max-width: 90%; align-items: flex-end; animation: fadeIn 0.3s ease; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #E5E7EB;
      flex-shrink: 0;
      margin-bottom: 4px;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      position: relative;
      word-wrap: break-word;
    }

    .bubble.a { 
      background: white; 
      color: var(--text); 
      border: 1px solid var(--border); 
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .bubble.u { 
      background: var(--brand); 
      color: white; 
      border-bottom-right-radius: 4px;
    }

    .bubble strong { font-weight: 700; }
    .bubble br { margin: 4px 0; }

    .b-meta { font-size: 11px; margin-top: 6px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; opacity: 0.65; }

    /* ── PIX COMPONENT (CONVERSION FOCUS) ─────────── */
    .pix-card {
      background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%);
      border: 2px solid var(--brand);
      border-radius: 14px;
      padding: 18px;
      margin-top: 10px;
      text-align: center;
    }

    .pix-title { 
      font-size: 12px; 
      font-weight: 700; 
      color: var(--brand); 
      text-transform: uppercase; 
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .pix-code {
      background: white;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: 600;
      word-break: break-all;
      border: 1px solid var(--brand-lt);
      margin-bottom: 14px;
      display: block;
      color: var(--text);
      letter-spacing: 0.5px;
    }

    .copy-btn {
      background: var(--brand);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .copy-btn:hover { 
      background: var(--brand-dk);
      transform: translateY(-1px);
    }

    .copy-btn:active { transform: scale(0.98); }

    /* ── TYPING ────────────────────────────────────── */
    .typing-row { display: none; align-items: center; gap: 8px; animation: fadeIn 0.3s ease; }
    
    .typing-bubble {
      background: white;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      border-radius: 18px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .dot-flashing {
      position: relative; 
      width: 6px; 
      height: 6px; 
      border-radius: 50%;
      background-color: var(--muted);
      animation: dot-flashing 1.4s infinite;
    }

    .dot-flashing::before, .dot-flashing::after {
      content: ""; 
      display: inline-block; 
      position: absolute; 
      top: 0;
      width: 6px; 
      height: 6px; 
      border-radius: 50%; 
      background-color: var(--muted);
      animation: dot-flashing 1.4s infinite;
    }

    .dot-flashing::before { left: -12px; animation-delay: -0.7s; }
    .dot-flashing::after { left: 12px; animation-delay: -0.35s; }

    @keyframes dot-flashing { 
      0%, 60%, 100% { background-color: #D1D5DB; opacity: 0.5; }
      30% { background-color: var(--muted); opacity: 1; }
    }

    /* ── SYSTEM MESSAGE ────────────────────────────── */
    .sys-badge { 
      text-align: center; 
      font-size: 12px; 
      color: var(--muted); 
      margin: 4px 0;
      padding: 0;
    }

    .sys-badge.info {
      background: #DBEAFE;
      color: #0C4A6E;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 500;
    }

    .sys-badge.success {
      background: #DCFCE7;
      color: #166534;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 500;
    }

    /* ── FOOTER ────────────────────────────────────── */
    .footer { 
      background: white; 
      padding: 14px 16px; 
      border-top: 1px solid var(--border);
    }

    .input-row { 
      display: flex; 
      gap: 10px; 
      align-items: center;
    }

    input {
      flex: 1; 
      border: 1px solid var(--border); 
      padding: 12px 16px;
      border-radius: 24px; 
      font-size: 14px; 
      outline: none; 
      background: #F9FAFB;
      color: var(--text);
      transition: all 0.2s;
    }

    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--brand); background: white; box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1); }

    .send-btn {
      width: 44px; 
      height: 44px; 
      border-radius: 50%; 
      background: var(--brand);
      color: white; 
      border: none; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      cursor: pointer; 
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover { background: var(--brand-dk); transform: scale(1.05); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .q-replies { 
      display: flex; 
      gap: 8px; 
      overflow-x: auto; 
      padding: 10px 0 8px 0; 
      scrollbar-width: none;
      margin-bottom: 8px;
    }

    .q-replies::-webkit-scrollbar { display: none; }

    .q-btn {
      white-space: nowrap; 
      background: white; 
      border: 1.5px solid var(--brand);
      color: var(--brand); 
      padding: 10px 16px; 
      border-radius: 20px;
      font-size: 13px; 
      font-weight: 600; 
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .q-btn:hover { 
      background: var(--brand-lt);
      transform: translateY(-2px);
    }

    .q-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="h-agent">
      <div class="h-photo-wrap">
        <img src="https://i.pravatar.cc/150?u=thiago" id="hPhoto" class="h-photo" style="filter: grayscale(1); opacity: 0.5;">
        <div id="hDot" class="h-online-dot"></div>
      </div>
      <div>
        <div class="h-name-row" id="hName">Atendimento Diskgas</div>
        <div class="h-sub" id="hStatus">Conectando...</div>
      </div>
    </div>
    <i class="fas fa-shield-alt" style="color: var(--success); font-size: 18px;"></i>
  </header>

  <div class="progress-container"><div id="pBar" class="progress-bar"></div></div>

  <main class="msgs" id="msgs">
    <div id="agentCard" class="agent-card">
      <div class="ac-header">
        <img src="https://i.pravatar.cc/150?u=thiago" class="h-photo">
        <div class="ac-info">
          <h4>Thiago Silva</h4>
          <span class="ac-badge"><i class="fas fa-check-circle"></i> Vendedor Verificado</span>
        </div>
      </div>
      <div class="ac-stats">
        <div class="ac-stat">
          <span class="ac-stat-val">~2 min</span>
          <span class="ac-stat-lbl">Tempo de Resposta</span>
        </div>
        <div class="ac-stat">
          <span class="ac-stat-val">4.9/5.0</span>
          <span class="ac-stat-lbl">Avaliação</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div id="qReplies" class="q-replies" style="display: none;"></div>
    <div class="input-row">
      <input type="text" id="msgIn" placeholder="Aguarde o vendedor..." disabled>
      <button id="sendBtn" class="send-btn" disabled><i class="fas fa-paper-plane"></i></button>
    </div>
  </footer>
</div>

<script>
  const msgs = document.getElementById('msgs');
  const msgIn = document.getElementById('msgIn');
  const sendBtn = document.getElementById('sendBtn');
  const pBar = document.getElementById('pBar');
  const agentCardEl = document.getElementById('agentCard');
  const agentPhotoUrl = "https://i.pravatar.cc/150?u=thiago";
  
  let typingRow = null;
  
  function scroll() { msgs.scrollTop = msgs.scrollHeight; }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  function getTime() { return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  function setProgress(w) { pBar.style.width = w + '%'; }

  function createTypingRow() {
    if (typingRow) return typingRow;
    typingRow = document.createElement('div');
    typingRow.className = 'typing-row';
    typingRow.innerHTML = `
      <img src="${agentPhotoUrl}" class="msg-avatar">
      <div class="typing-bubble">
        <div class="dot-flashing"></div>
      </div>
    `;
    msgs.appendChild(typingRow);
    return typingRow;
  }

  function addMsg(text, type) {
    const row = document.createElement('div');
    row.className = `msg-row ${type}`;
    
    let avatarHtml = '';
    if (type === 'agent') {
      avatarHtml = `<img src="${agentPhotoUrl}" class="msg-avatar">`;
    }

    row.innerHTML = `
      ${avatarHtml}
      <div class="bubble ${type === 'user' ? 'u' : 'a'}">
        ${text}
        <div class="b-meta">${getTime()} ${type === 'user' ? '<i class="fas fa-check-double" style="color:#4FC3F7"></i>' : ''}</div>
      </div>
    `;
    
    if (typingRow) {
      msgs.insertBefore(row, typingRow);
    } else {
      msgs.appendChild(row);
    }
    scroll();
  }

  async function showTyping(duration) {
    const tRow = createTypingRow();
    tRow.style.display = 'flex';
    document.getElementById('hStatus').textContent = 'Digitando...';
    document.getElementById('hStatus').classList.add('online');
    scroll();
    await sleep(duration);
    tRow.style.display = 'none';
    document.getElementById('hStatus').textContent = 'Online agora';
  }

  async function startFlow() {
    // Exibir card do atendente e foto imediatamente
    const hPhoto = document.getElementById('hPhoto');
    hPhoto.style.filter = "none";
    hPhoto.style.opacity = "1";
    hPhoto.style.border = "2px solid var(--success)";
    document.getElementById('hDot').style.display = "block";
    document.getElementById('hName').textContent = "Thiago Silva";
    document.getElementById('hStatus').textContent = "Online agora";
    document.getElementById('hStatus').classList.add('online');
    agentCardEl.style.display = "block";
    setProgress(100);

    // Habilitar input imediatamente
    msgIn.disabled = false;
    msgIn.placeholder = "Digite sua mensagem...";
    sendBtn.disabled = false;

    // Mensagem inicial do usuário
    await sleep(400);
    addMsg("Olá! Gostaria de pedir um gás.", "user");

    // Primeira resposta do atendente
    await sleep(800);
    await showTyping(1500);
    addMsg("Oi! Tudo bem? Sou o Thiago da Diskgas. 👋", "agent");

    await sleep(1200);
    await showTyping(1800);
    addMsg("Vi que você quer pedir um gás. Vou te ajudar com isso agora mesmo!", "agent");

    await sleep(1500);
    await showTyping(2000);
    addMsg("Deixa eu gerar o seu código Pix para pagamento seguro. Só um segundo...", "agent");

    // Código Pix
    await sleep(2500);
    await showTyping(1200);
    
    const pixHtml = `
      Aqui está o seu código de pagamento. Assim que pagar, o sistema libera sua entrega automaticamente:
      <div class="pix-card">
        <div class="pix-title"><i class="fas fa-qrcode"></i> Pix Cópia e Cola</div>
        <span class="pix-code">00020126580014br.gov.bcb.pix0136xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx520400005303986540510.005802BR5913DISKGAS6009SAO PAULO62410503***63041D3D</span>
        <button class="copy-btn" onclick="copyPix()">
          <i class="fas fa-copy"></i> Copiar Código Pix
        </button>
      </div>
    `;
    addMsg(pixHtml, "agent");

    // Quick replies
    const q = document.getElementById('qReplies');
    q.style.display = 'flex';
    q.innerHTML = `
      <button class="q-btn" onclick="quickSend('Já realizei o pagamento!')">✅ Já paguei</button>
      <button class="q-btn" onclick="quickSend('Qual o tempo de entrega?')">🕒 Tempo de entrega?</button>
      <button class="q-btn" onclick="quickSend('Preciso de ajuda')">🆘 Suporte</button>
    `;
    scroll();
  }

  function copyPix() {
    const btn = document.querySelector('.copy-btn');
    const originalHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-check"></i> Código Copiado!';
    btn.style.background = 'var(--success)';
    setTimeout(() => {
      btn.innerHTML = originalHtml;
      btn.style.background = 'var(--brand)';
    }, 2500);
  }

  function quickSend(text) {
    msgIn.value = text;
    send();
  }

  async function send() {
    const text = msgIn.value.trim();
    if (!text) return;
    msgIn.value = '';
    document.getElementById('qReplies').style.display = 'none';
    addMsg(text, "user");
    msgIn.disabled = true;
    sendBtn.disabled = true;
    
    await sleep(1200);
    await showTyping(1800);
    addMsg("Perfeito! Estou acompanhando aqui. Assim que o pagamento for confirmado, te aviso por aqui mesmo. 👍", "agent");
    
    msgIn.disabled = false;
    sendBtn.disabled = false;
    msgIn.focus();
  }

  sendBtn.onclick = send;
  msgIn.onkeydown = (e) => { if(e.key === 'Enter') send(); };

  window.onload = startFlow;
</script>

</body>
</html>
