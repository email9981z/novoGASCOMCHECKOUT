<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Diskgas — Entrega Prioritária</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --brand:    #0066CC;
      --brand-dk: #0052A3;
      --brand-lt: #E6F2FF;
      --bg:       #F3F4F6;
      --white:    #FFFFFF;
      --text:     #111827;
      --muted:    #6B7280;
      --border:   #E5E7EB;
      --success:  #10B981;
      --accent:   #FF6B00;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; width: 100%; font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0F172A; display: flex; justify-content: center; align-items: center; overflow: hidden;
    }

    .app {
      width: 100%; max-width: 440px; height: 100dvh; display: flex; flex-direction: column;
      background: var(--bg); position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* ── HEADER (DYNAMIC) ──────────────────────────── */
    .header {
      background: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border); z-index: 10;
    }
    .h-agent { display: flex; align-items: center; gap: 12px; flex: 1; }
    .h-photo-wrap { position: relative; }
    .h-photo {
      width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
      background: #F3F4F6; transition: all 0.5s ease;
    }
    .h-online-dot {
      position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px;
      background: var(--success); border: 2px solid white; border-radius: 50%; display: none;
    }
    .h-name-row { font-size: 15px; font-weight: 700; color: var(--text); }
    .h-sub { font-size: 12px; color: var(--muted); transition: all 0.3s; }
    .h-sub.active { color: var(--success); font-weight: 600; }

    /* ── PROGRESS BAR (RETENTION TOOL) ─────────────── */
    .progress-container { height: 3px; background: #E5E7EB; width: 100%; position: relative; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--brand); width: 0%; transition: width 0.5s ease; }

    /* ── MESSAGES ──────────────────────────────────── */
    .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #F9FAFB; }

    .msg-row { display: flex; gap: 8px; max-width: 85%; animation: msgIn 0.3s ease-out forwards; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5; position: relative; }
    .bubble.a { background: white; color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .bubble.u { background: var(--brand); color: white; border-bottom-right-radius: 4px; }
    .b-meta { font-size: 10px; margin-top: 4px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; opacity: 0.6; }

    /* ── SYSTEM STATUS (MICRO-INTERACTIONS) ────────── */
    .sys-status {
      align-self: center; background: rgba(0, 102, 204, 0.05); color: var(--brand);
      padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: 600;
      margin: 5px 0; display: flex; align-items: center; gap: 8px;
    }
    .pulse-small { width: 6px; height: 6px; background: var(--brand); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

    /* ── AGENT CARD ────────────────────────────────── */
    .agent-card {
      background: white; border-radius: 16px; padding: 14px; border: 1px solid var(--brand-lt);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: none; margin-bottom: 10px;
    }

    /* ── PIX COMPONENT ─────────────────────────────── */
    .pix-box {
      background: #F0F9FF; border: 2px solid var(--brand-lt); border-radius: 12px;
      padding: 16px; margin-top: 8px; text-align: center;
    }
    .pix-code {
      background: white; padding: 12px; border-radius: 8px; font-family: monospace;
      font-size: 11px; word-break: break-all; border: 1px solid var(--border);
      margin: 10px 0; display: block; color: var(--text);
    }
    .copy-btn {
      background: var(--brand); color: white; border: none; padding: 12px;
      border-radius: 8px; font-weight: 700; width: 100%; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    /* ── TYPING ────────────────────────────────────── */
    .typing-row { display: none; align-items: center; gap: 8px; margin-left: 10px; }
    .dot { width: 6px; height: 6px; background: #CBD5E1; border-radius: 50%; animation: dot 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

    /* ── FOOTER ────────────────────────────────────── */
    .footer { background: white; padding: 12px 16px; border-top: 1px solid var(--border); }
    .input-row { display: flex; gap: 10px; align-items: center; }
    input {
      flex: 1; border: 1px solid var(--border); padding: 12px 16px;
      border-radius: 24px; font-size: 14px; outline: none; background: #F9FAFB;
    }
    .send-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--brand);
      color: white; border: none; display: flex; align-items: center; justify-content: center;
    }
    .q-replies { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .q-btn {
      white-space: nowrap; background: white; border: 1px solid var(--brand);
      color: var(--brand); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
    }
  </style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="h-agent">
      <div class="h-photo-wrap">
        <img src="https://i.pravatar.cc/150?u=thiago" id="hPhoto" class="h-photo" style="filter: grayscale(1); opacity: 0.4;">
        <div id="hDot" class="h-online-dot"></div>
      </div>
      <div>
        <div class="h-name-row" id="hName">Central de Atendimento</div>
        <div class="h-sub" id="hStatus">Localizando vendedor...</div>
      </div>
    </div>
    <div style="font-size: 10px; color: var(--success); font-weight: 700; text-align: right;">
      <i class="fas fa-bolt"></i> PRIORIDADE ALTA
    </div>
  </header>

  <div class="progress-container"><div id="pBar" class="progress-bar"></div></div>

  <main class="msgs" id="msgs">
    <!-- Inicialização -->
  </main>

  <footer class="footer">
    <div id="qReplies" class="q-replies" style="display: none;"></div>
    <div class="input-row">
      <input type="text" id="msgIn" placeholder="Aguarde o vendedor..." disabled>
      <button id="sendBtn" class="send-btn" disabled><i class="fas fa-paper-plane"></i></button>
    </div>
  </footer>
</div>

<script>
  const msgs = document.getElementById('msgs');
  const msgIn = document.getElementById('msgIn');
  const sendBtn = document.getElementById('sendBtn');
  const pBar = document.getElementById('pBar');
  
  function scroll() { msgs.scrollTop = msgs.scrollHeight; }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  function setProgress(w) { pBar.style.width = w + '%'; }

  function addMsg(text, type) {
    const row = document.createElement('div');
    row.className = `msg-row ${type}`;
    row.innerHTML = `
      <div class="bubble ${type === 'user' ? 'u' : 'a'}">
        ${text}
        <div class="b-meta">${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} ${type==='user'?'<i class="fas fa-check-double" style="color:#4FC3F7"></i>':''}</div>
      </div>
    `;
    msgs.appendChild(row);
    scroll();
  }

  function addStatus(text) {
    const div = document.createElement('div');
    div.className = 'sys-status';
    div.innerHTML = `<div class="pulse-small"></div> ${text}`;
    msgs.appendChild(div);
    scroll();
    return div;
  }

  async function showTyping(duration) {
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.style.display = 'flex';
    row.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
    msgs.appendChild(row);
    document.getElementById('hStatus').textContent = 'Digitando...';
    document.getElementById('hStatus').classList.add('active');
    scroll();
    await sleep(duration);
    row.remove();
    document.getElementById('hStatus').textContent = 'Online agora';
  }

  async function startFlow() {
    // Etapa 1: Início e Confirmação de Recebimento (0-20%)
    await sleep(800);
    setProgress(10);
    addMsg("Olá! Gostaria de pedir um gás.", "user");
    
    await sleep(1200);
    const s1 = addStatus("Pedido recebido! Verificando estoque...");
    setProgress(25);

    // Etapa 2: Thiago assume (25-50%)
    await sleep(2000);
    s1.innerHTML = `<i class="fas fa-check-circle"></i> Estoque confirmado! Thiago Silva assumiu seu pedido.`;
    s1.style.color = "var(--success)";
    
    const hPhoto = document.getElementById('hPhoto');
    hPhoto.style.filter = "none"; hPhoto.style.opacity = "1";
    document.getElementById('hDot').style.display = "block";
    document.getElementById('hName').textContent = "Thiago Silva";
    document.getElementById('hStatus').textContent = "Online agora";
    document.getElementById('hStatus').classList.add('active');
    
    msgIn.disabled = false; msgIn.placeholder = "Digite aqui..."; sendBtn.disabled = false;
    setProgress(50);

    // Etapa 3: Conversa Fluida
    await sleep(1500);
    await showTyping(1500);
    addMsg("Oi! Tudo bem? Sou o Thiago e já vi que você precisa de um gás.", "agent");

    await sleep(1800);
    await showTyping(2200);
    addMsg("Estou reservando um botijão lacrado para sua região agora mesmo. Só um segundo que vou gerar o Pix para agilizar sua entrega.", "agent");
    setProgress(75);

    // Etapa 4: Fechamento (75-100%)
    await sleep(3000);
    await showTyping(1200);
    
    const pixHtml = `
      Perfeito! Pagando agora, sua entrega entra na rota de prioridade (30-40 min):
      <div class="pix-box">
        <div style="font-size:11px; font-weight:700; color:var(--brand); margin-bottom:5px;">COPIE O CÓDIGO ABAIXO:</div>
        <span class="pix-code">00020126580014BR.GOV.BCB.PIX0136e3a45712-9865-4b2a-8765-1234567890ab5204000053039865405115.005802BR5915DISK GAS OFICIAL6009SAO PAULO62070503GAS6304ABCD</span>
        <button class="copy-btn" onclick="copyPix(this)">
          <i class="fas fa-copy"></i> COPIAR CÓDIGO PIX
        </button>
      </div>
    `;
    addMsg(pixHtml, "agent");
    setProgress(100);

    await sleep(1000);
    const q = document.getElementById('qReplies');
    q.style.display = 'flex';
    q.innerHTML = `
      <button class="q-btn" onclick="quickSend('Já fiz o pagamento!')">✅ Já paguei!</button>
      <button class="q-btn" onclick="quickSend('Quanto tempo demora?')">🕒 Qual o tempo?</button>
    `;
    scroll();
  }

  function copyPix(btn) {
    btn.innerHTML = '<i class="fas fa-check"></i> COPIADO!';
    btn.style.background = 'var(--success)';
    setTimeout(() => {
      btn.innerHTML = '<i class="fas fa-copy"></i> COPIAR CÓDIGO PIX';
      btn.style.background = 'var(--brand)';
    }, 2000);
  }

  function quickSend(t) { msgIn.value = t; send(); }

  async function send() {
    const t = msgIn.value.trim();
    if (!t) return;
    msgIn.value = '';
    addMsg(t, "user");
    await sleep(1500);
    await showTyping(1800);
    addMsg("Excelente! Estou monitorando a confirmação aqui no sistema. Assim que cair, o entregador já sai com seu gás! 🚚", "agent");
  }

  sendBtn.onclick = send;
  msgIn.onkeydown = (e) => { if(e.key === 'Enter') send(); };

  window.onload = startFlow;
</script>

</body>
</html>
