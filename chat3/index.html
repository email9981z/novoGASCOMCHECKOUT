<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diskgas — Atendimento Melhorado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --brand:      #E8480C;
  --brand-dk:   #C23A08;
  --brand-lt:   #FFF2EC;
  --brand-mid:  #FF6430;

  --bg:         #ECE7DF;
  --surface:    #FFFFFF;
  --surface-2:  #F9F6F2;
  --surface-3:  #F3EEE7;

  --text:       #1A1714;
  --text-2:     #5C5650;
  --text-3:     #9A9288;

  --border:     #DDD7CE;
  --border-2:   #EAE4DA;

  --bubble-a:   #FFFFFF;
  --bubble-u:   #FFE1CB;

  --green:      #1DC75F;
  --green-dk:   #0DA04A;
  --green-lt:   #F0FDF6;
  --green-bd:   rgba(13,160,74,.15);

  --read-clr:   #38BDF8;

  --radius-xs:  6px;
  --radius-sm:  10px;
  --radius:     16px;
  --radius-lg:  22px;
  --radius-xl:  28px;

  --sh-xs: 0 1px 3px rgba(0,0,0,.05);
  --sh-sm: 0 2px 8px rgba(0,0,0,.07);
  --sh-md: 0 4px 16px rgba(0,0,0,.09);
  --sh-lg: 0 8px 32px rgba(0,0,0,.09);

  --ease:   cubic-bezier(.25,.46,.45,.94);
  --spring: cubic-bezier(.34,1.56,.64,1);
}

html,body{
  height:100%;width:100%;
  font-family:'DM Sans',sans-serif;
  background:#0D0C0B;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
}

.app{
  width:100%;max-width:430px;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg);
  position:relative;overflow:hidden;
}

/* Subtle warm atmosphere */
.app::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 100% 28% at 50% 0%, rgba(232,72,12,.06) 0%, transparent 100%),
    radial-gradient(ellipse 70% 18% at 0% 100%,  rgba(232,72,12,.03) 0%, transparent 100%);
}

/* ─── Header ─── */
.header{
  background:var(--brand);
  padding:13px 14px;
  display:flex;align-items:center;gap:11px;
  position:relative;z-index:10;
  box-shadow:0 1px 0 rgba(0,0,0,.1), 0 3px 14px rgba(0,0,0,.14);
}
.header::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,transparent 55%);
}

.back-btn{
  width:34px;height:34px;border-radius:9px;
  background:rgba(255,255,255,.14);border:none;cursor:pointer;
  color:rgba(255,255,255,.96);font-size:17px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background .18s ease;
}

.h-agent{display:flex;align-items:center;gap:11px;flex:1;min-width:0;}

.h-avatar{position:relative;}
.h-avatar-img{
  width:40px;height:40px;border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.45);
  box-shadow:0 0 0 2px rgba(255,255,255,.12);
}
.h-status-dot{
  position:absolute;bottom:1px;right:1px;
  width:11px;height:11px;border-radius:50%;
  background:var(--green);
  border:2px solid var(--brand);
}

.h-info{flex:1;min-width:0;}
.h-name{font-size:14.5px;font-weight:600;color:#fff;letter-spacing:.2px;}
.h-sub{
  font-size:11.5px;color:rgba(255,255,255,.72);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:1px;font-weight:400;
}

/* ─── Messages ─── */
.msgs{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 14px 12px;
  display:flex;flex-direction:column;gap:8px;
  position:relative;z-index:1;
  scroll-behavior:smooth;
}

.sys-msg{text-align:center;margin:10px 0;animation:fadeIn .4s var(--ease);}
.sys-msg span{
  font-size:11.5px;color:var(--text-2);
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(10px);
  border:1px solid rgba(0,0,0,.05);
  border-radius:10px;
  padding:6px 16px;
  box-shadow:var(--sh-xs);
  font-weight:500;letter-spacing:.2px;
}

.msg-row{
  display:flex;gap:7px;align-items:flex-end;
  max-width:84%;margin-bottom:2px;
  animation:msgIn .32s var(--ease);
}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;max-width:80%;}
.msg-row.agent{align-self:flex-start;}

@keyframes msgIn{
  from{opacity:0;transform:translateY(7px) scale(.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.bubble{
  padding:10px 13px 8px;
  border-radius:var(--radius);
  font-size:14px;line-height:1.65;
  position:relative;
}
.bubble.a{
  background:var(--bubble-a);
  color:var(--text);
  border-radius:4px var(--radius) var(--radius) var(--radius);
  box-shadow:var(--sh-sm);
}
.bubble.u{
  background:var(--bubble-u);
  color:var(--text);
  border-radius:var(--radius) 4px var(--radius) var(--radius);
  box-shadow:var(--sh-sm);
}

.b-meta{
  display:flex;align-items:center;justify-content:flex-end;
  gap:3px;margin-top:2px;
  float:right;margin-left:10px;
}
.b-time{font-size:10.5px;color:rgba(0,0,0,.32);}

/* ─── NEW: Agent Intro Card ─── */
.agent-intro{
  background:var(--surface);
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin:16px 0;
  box-shadow:var(--sh-lg);
  border:1px solid rgba(0,0,0,.055);
  width:100%;
  position:relative;z-index:2;
  animation:cardSlideIn .55s var(--spring);
}
.agent-intro::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg, var(--brand) 0%, #FF7848 100%);
}
@keyframes cardSlideIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

.ai-top{
  display:flex;gap:14px;align-items:center;
  padding:20px 18px 16px;
}
.ai-img{
  width:58px;height:58px;border-radius:50%;
  object-fit:cover;
  border:2.5px solid #fff;
  box-shadow:0 2px 12px rgba(0,0,0,.12);
}
.ai-info{flex:1;}
.ai-name{font-size:16px;font-weight:700;color:var(--text);}
.ai-role{font-size:12px;color:var(--text-2);margin-bottom:4px;}
.ai-tag{
  font-size:11px;font-weight:600;
  color:#0A8040; background:#E8F7EF;
  padding:3px 10px; border-radius:20px;
  display:inline-flex;align-items:center;
}

/* ─── Typing ─── */
.typing-row{
  display:none;align-items:flex-end;gap:7px;
  align-self:flex-start;animation:fadeIn .2s ease;
}
.typing-bubble{
  background:var(--bubble-a);
  border-radius:4px var(--radius) var(--radius) var(--radius);
  padding:13px 16px;
  box-shadow:var(--sh-sm);
  display:flex;gap:5px;
}
.typing-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(0,0,0,.17);
  animation:typePulse 1.4s ease-in-out infinite;
}
.typing-dot:nth-child(2){animation-delay:.18s;}
.typing-dot:nth-child(3){animation-delay:.36s;}
@keyframes typePulse{
  0%,60%,100%{transform:translateY(0);opacity:.35;}
  30%{transform:translateY(-4px);opacity:1;}
}

/* ─── Footer ─── */
.footer{
  background:var(--surface-2);
  border-top:1px solid var(--border-2);
  padding:11px 12px 15px;
}
.input-row{display:flex;gap:8px;align-items:flex-end;}
.input-wrap{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--surface);
  border-radius:26px;
  padding:10px 15px;
  border:1.5px solid var(--border);
}
.msg-input{
  flex:1;border:none;outline:none;
  font-size:14.5px;font-family:'DM Sans',sans-serif;
  background:transparent;
}
.send-btn{
  width:46px;height:46px;border-radius:50%;
  background:var(--brand);
  color:#fff; border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <button class="back-btn">←</button>
    <div class="h-agent">
      <div class="h-avatar">
        <img src="https://i.pravatar.cc/100?u=diskgas" class="h-avatar-img" alt="Avatar">
        <div class="h-status-dot"></div>
      </div>
      <div class="h-info">
        <div class="h-name">Carlos - Diskgas</div>
        <div class="h-sub">Online</div>
      </div>
    </div>
  </header>

  <div class="msgs" id="msgs">
    <!-- Messages will appear here -->
  </div>

  <div class="typing-row" id="typingRow" style="padding: 0 14px 10px;">
    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="input-row">
      <div class="input-wrap">
        <input type="text" class="msg-input" id="msgInput" placeholder="Escreva sua mensagem...">
      </div>
      <button class="send-btn" id="sendBtn">✈</button>
    </div>
  </footer>
</div>

<script>
const msgsEl = document.getElementById('msgs');
const inputEl = document.getElementById('msgInput');
const sendBtnEl = document.getElementById('sendBtn');
const typingRowEl = document.getElementById('typingRow');

const now = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

function addMsg(text, type) {
  const row = document.createElement('div');
  row.className = `msg-row ${type}`;
  row.innerHTML = `
    <div class="bubble ${type === 'user' ? 'u' : 'a'}">
      ${text}
      <div class="b-meta"><span class="b-time">${now()}</span></div>
    </div>
  `;
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'sys-msg';
  div.innerHTML = `<span>${text}</span>`;
  msgsEl.appendChild(div);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function showAgentIntro() {
  const card = document.createElement('div');
  card.className = 'agent-intro';
  card.innerHTML = `
    <div class="ai-top">
      <img src="https://i.pravatar.cc/100?u=carlos" class="ai-img" alt="Carlos">
      <div class="ai-info">
        <div class="ai-name">Carlos Oliveira</div>
        <div class="ai-role">Especialista em Atendimento</div>
        <div class="ai-tag">● Responde rápido</div>
      </div>
    </div>
  `;
  msgsEl.appendChild(card);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

async function handleFlow() {
  const text = inputEl.value;
  if(!text) return;
  
  inputEl.value = '';
  addMsg(text, 'user');

  // 1. GAP FILLER: System Message
  await new Promise(r => setTimeout(r, 800));
  addSystemMsg("Encaminhando para um consultor...");

  // 2. GAP FILLER: Agent Intro
  await new Promise(r => setTimeout(r, 1200));
  showAgentIntro();

  // 3. Typing indicator starts
  await new Promise(r => setTimeout(r, 1000));
  typingRowEl.style.display = 'flex';
  msgsEl.scrollTop = msgsEl.scrollHeight;

  // 4. Agent Response
  await new Promise(r => setTimeout(r, 3000));
  typingRowEl.style.display = 'none';
  addMsg("Olá! Sou o Carlos. Como posso te ajudar com seu pedido hoje?", 'agent');
}

sendBtnEl.onclick = handleFlow;
inputEl.onkeypress = (e) => { if(e.key === 'Enter') handleFlow(); };

// Auto-start for demo
window.onload = () => {
  addSystemMsg("Bem-vindo à Diskgas!");
};
</script>
</body>
</html>
