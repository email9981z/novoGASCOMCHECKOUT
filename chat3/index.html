<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diskgas — Atendimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --brand:      #E8480C;
  --brand-dk:   #C23A08;
  --brand-lt:   #FFF2EC;
  --brand-mid:  #FF6430;

  --bg:         #ECE7DF;
  --surface:    #FFFFFF;
  --surface-2:  #F9F6F2;
  --surface-3:  #F3EEE7;

  --text:       #1A1714;
  --text-2:     #5C5650;
  --text-3:     #9A9288;

  --border:     #DDD7CE;
  --border-2:   #EAE4DA;

  --bubble-a:   #FFFFFF;
  --bubble-u:   #FFE1CB;

  --green:      #1DC75F;
  --green-dk:   #0DA04A;
  --green-lt:   #F0FDF6;
  --green-bd:   rgba(13,160,74,.15);

  --read-clr:   #38BDF8;

  --radius-xs:  6px;
  --radius-sm:  10px;
  --radius:     16px;
  --radius-lg:  22px;
  --radius-xl:  28px;

  --sh-xs: 0 1px 3px rgba(0,0,0,.05);
  --sh-sm: 0 2px 8px rgba(0,0,0,.07);
  --sh-md: 0 4px 16px rgba(0,0,0,.09);
  --sh-lg: 0 8px 32px rgba(0,0,0,.09);

  --ease:   cubic-bezier(.25,.46,.45,.94);
  --spring: cubic-bezier(.34,1.56,.64,1);
}

html,body{
  height:100%;width:100%;
  font-family:'DM Sans',sans-serif;
  background:#0D0C0B;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
}

.app{
  width:100%;max-width:430px;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg);
  position:relative;overflow:hidden;
}

/* Subtle warm atmosphere */
.app::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 100% 28% at 50% 0%, rgba(232,72,12,.06) 0%, transparent 100%),
    radial-gradient(ellipse 70% 18% at 0% 100%,  rgba(232,72,12,.03) 0%, transparent 100%);
}

/* ─── Loading overlay ─── */
.loading-overlay{
  position:absolute;inset:0;z-index:100;
  background:linear-gradient(160deg,#FEFCFA 0%,#F5EFE8 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:1;transition:opacity .55s var(--ease);
  pointer-events:auto;
}
.loading-overlay.hidden{opacity:0;pointer-events:none;}

.loading-content{
  display:flex;flex-direction:column;align-items:center;gap:26px;
  width:100%;padding:36px 28px;
}

.loading-logo{
  width:82px;height:82px;border-radius:50%;
  background:var(--brand);
  display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:700;color:#fff;
  letter-spacing:-1px;
  box-shadow:
    0 0 0 10px rgba(232,72,12,.08),
    0 0 0 22px rgba(232,72,12,.04),
    0 14px 36px rgba(232,72,12,.22);
  animation:logoFloat 3.5s ease-in-out infinite;
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-11px);}
}

.loading-text{text-align:center;}
.loading-title{
  font-size:18px;font-weight:700;color:var(--text);
  margin-bottom:6px;letter-spacing:-.3px;
}
.loading-subtitle{font-size:13px;color:var(--text-2);line-height:1.6;}

.loading-steps{
  width:100%;max-width:290px;
  display:flex;flex-direction:column;
  position:relative;gap:0;
}
/* Connecting line */
.loading-steps::before{
  content:'';
  position:absolute;
  left:19px;top:28px;bottom:28px;
  width:2px;
  background:linear-gradient(to bottom,var(--border) 0%,var(--border-2) 100%);
  border-radius:1px;z-index:0;
}

.step-item{
  display:flex;align-items:center;gap:14px;
  padding:11px 14px 11px 10px;
  border-radius:var(--radius);
  background:transparent;
  transition:all .4s var(--ease);
  opacity:.4;position:relative;z-index:1;
}
.step-item.active{
  opacity:1;
  background:rgba(232,72,12,.055);
}
.step-item.completed{opacity:.7;}

.step-icon{
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;
  flex-shrink:0;
  background:var(--border);color:var(--text-3);
  border:2px solid #fff;
  box-shadow:var(--sh-xs);
  transition:all .4s var(--ease);
}
.step-item.active .step-icon{
  background:var(--brand);color:#fff;
  border-color:transparent;
  animation:stepPulse 2s ease-in-out infinite;
}
.step-item.completed .step-icon{background:var(--green);color:#fff;border-color:transparent;}

@keyframes stepPulse{
  0%,100%{box-shadow:0 0 0 4px rgba(232,72,12,.12);}
  50%{box-shadow:0 0 0 8px rgba(232,72,12,.05);}
}

.step-text{display:flex;flex-direction:column;gap:1px;flex:1;}
.step-label{font-size:12.5px;font-weight:600;color:var(--text);letter-spacing:.1px;}
.step-description{font-size:11px;color:var(--text-3);}
.step-item.active .step-label{color:var(--brand);}
.step-item.active .step-description{color:rgba(232,72,12,.55);}

.loading-progress{width:100%;max-width:290px;display:flex;flex-direction:column;gap:9px;}
.progress-bar{
  width:100%;height:3px;
  background:var(--border-2);border-radius:2px;overflow:hidden;
}
.progress-fill{
  height:100%;background:var(--brand);width:0%;
  transition:width .8s cubic-bezier(.4,0,.2,1);
  border-radius:2px;
  box-shadow:0 0 10px rgba(232,72,12,.35);
}
.progress-text{display:flex;justify-content:space-between;align-items:center;}
.progress-label{font-size:11px;color:var(--text-3);font-weight:500;letter-spacing:.3px;}
.progress-percent{font-size:11.5px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;}

/* ─── Header ─── */
.header{
  background:var(--brand);
  padding:13px 14px;
  display:flex;align-items:center;gap:11px;
  position:relative;z-index:10;
  box-shadow:0 1px 0 rgba(0,0,0,.1), 0 3px 14px rgba(0,0,0,.14);
}
/* subtle inner glow */
.header::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,transparent 55%);
}

.back-btn{
  width:34px;height:34px;border-radius:9px;
  background:rgba(255,255,255,.14);border:none;cursor:pointer;
  color:rgba(255,255,255,.96);font-size:17px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background .18s ease;
}
.back-btn:hover{background:rgba(255,255,255,.22);}

.h-agent{display:flex;align-items:center;gap:11px;flex:1;min-width:0;}

.h-avatar{position:relative;cursor:pointer;}
.h-avatar-img{
  width:40px;height:40px;border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.45);
  box-shadow:0 0 0 2px rgba(255,255,255,.12);
  transition:filter .4s ease, opacity .4s ease;
  filter:grayscale(1);opacity:.55;
}
.h-avatar-img.live{filter:none;opacity:1;}
.h-status-dot{
  position:absolute;bottom:1px;right:1px;
  width:11px;height:11px;border-radius:50%;
  background:var(--green);
  border:2px solid var(--brand);
  opacity:0;transition:opacity .4s ease;
}

.h-info{flex:1;min-width:0;}
.h-name{font-size:14.5px;font-weight:600;color:#fff;letter-spacing:.2px;}
.h-sub{
  font-size:11.5px;color:rgba(255,255,255,.72);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:1px;font-weight:400;
  transition:color .2s ease;
}

.h-actions{display:flex;gap:3px;flex-shrink:0;}
.h-action{
  width:34px;height:34px;border-radius:9px;
  background:rgba(255,255,255,.14);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.9);font-size:17px;
  transition:background .18s ease;
}
.h-action:hover{background:rgba(255,255,255,.22);}

/* ─── Messages ─── */
.msgs{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 14px 12px;
  display:flex;flex-direction:column;gap:3px;
  position:relative;z-index:1;
  scroll-behavior:smooth;
}
.msgs::-webkit-scrollbar{width:3px;}
.msgs::-webkit-scrollbar-track{background:transparent;}
.msgs::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:2px;}

.date-sep{text-align:center;margin:14px 0;}
.date-sep span{
  font-size:11px;font-weight:500;color:var(--text-3);
  background:rgba(255,255,255,.68);
  backdrop-filter:blur(10px);
  border:1px solid rgba(0,0,0,.05);
  border-radius:20px;
  padding:4px 14px;
  box-shadow:var(--sh-xs);
  letter-spacing:.3px;
}

.sys-msg{text-align:center;margin:10px 0;animation:fadeIn .4s var(--ease);}
.sys-msg span{
  font-size:11.5px;color:var(--text-2);
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(10px);
  border:1px solid rgba(0,0,0,.05);
  border-radius:10px;
  padding:6px 16px;
  box-shadow:var(--sh-xs);
  font-weight:500;letter-spacing:.2px;
}

.msg-row{
  display:flex;gap:7px;align-items:flex-end;
  max-width:84%;margin-bottom:2px;
  animation:msgIn .32s var(--ease);
}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;max-width:80%;}
.msg-row.agent{align-self:flex-start;}
.msg-row.grouped{margin-bottom:1px;}

@keyframes msgIn{
  from{opacity:0;transform:translateY(7px) scale(.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.msg-av{
  width:28px;height:28px;border-radius:50%;
  object-fit:cover;flex-shrink:0;align-self:flex-end;
  border:1.5px solid rgba(0,0,0,.06);
  box-shadow:var(--sh-xs);
}
.msg-av-spacer{width:28px;flex-shrink:0;}

.bubble{
  padding:10px 13px 8px;
  border-radius:var(--radius);
  font-size:14px;line-height:1.65;
  max-width:100%;word-break:break-word;
  position:relative;
  transition:box-shadow .2s ease;
}
.bubble.a{
  background:var(--bubble-a);
  color:var(--text);
  border-radius:4px var(--radius) var(--radius) var(--radius);
  box-shadow:
    0 1px 2px rgba(0,0,0,.04),
    0 3px 10px rgba(0,0,0,.07),
    inset 0 0 0 .8px rgba(0,0,0,.045);
}
.bubble.u{
  background:var(--bubble-u);
  color:var(--text);
  border-radius:var(--radius) 4px var(--radius) var(--radius);
  box-shadow:
    0 1px 2px rgba(0,0,0,.04),
    0 3px 10px rgba(0,0,0,.07);
}
.bubble:hover{
  box-shadow:
    0 2px 4px rgba(0,0,0,.06),
    0 5px 16px rgba(0,0,0,.09);
}

.msg-row:not(.grouped) .bubble.a::before{
  content:'';position:absolute;top:0;left:-5px;
  border:7px solid transparent;
  border-bottom-color:var(--bubble-a);
  border-right-color:var(--bubble-a);
  border-top:0;border-left:0;
}
.msg-row:not(.grouped) .bubble.u::after{
  content:'';position:absolute;top:0;right:-5px;
  border:7px solid transparent;
  border-bottom-color:var(--bubble-u);
  border-left-color:var(--bubble-u);
  border-top:0;border-right:0;
}
.msg-row.grouped .bubble.a{border-radius:var(--radius);}
.msg-row.grouped .bubble.u{border-radius:var(--radius);}

.b-meta{
  display:flex;align-items:center;justify-content:flex-end;
  gap:3px;margin-top:2px;
  float:right;margin-left:10px;transform:translateY(1px);
}
.b-time{font-size:10.5px;color:rgba(0,0,0,.32);line-height:1;letter-spacing:.2px;}
.b-receipt{font-size:11px;line-height:1;color:rgba(0,0,0,.22);transition:color .3s ease;}
.b-receipt.delivered{color:rgba(0,0,0,.35);}
.b-receipt.read{color:var(--read-clr);font-weight:600;}

/* ─── Agent intro card ─── */
.agent-intro{
  background:var(--surface);
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin:16px 0;
  box-shadow:var(--sh-lg);
  border:1px solid rgba(0,0,0,.055);
  width:100%;
  position:relative;z-index:2;
  flex-shrink:0;
  animation:cardSlideIn .55s var(--ease);
}
/* Top accent bar */
.agent-intro::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg, var(--brand) 0%, #FF7848 100%);
}
@keyframes cardSlideIn{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:translateY(0);}
}

.ai-top{
  display:flex;gap:14px;align-items:center;
  padding:20px 18px 16px;
}
.ai-img-wrapper{position:relative;flex-shrink:0;}
.ai-img{
  width:58px;height:58px;border-radius:50%;
  object-fit:cover;
  border:2.5px solid #fff;
  box-shadow:
    0 2px 12px rgba(0,0,0,.12),
    0 0 0 3.5px rgba(232,72,12,.14);
}
.ai-badge-verified{
  position:absolute;bottom:1px;right:-1px;
  background:#0B84FF;color:#fff;
  width:17px;height:17px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;
  border:2px solid #fff;
  box-shadow:var(--sh-xs);
}

.ai-info{flex:1;}
.ai-name{
  font-size:16px;font-weight:700;color:var(--text);
  letter-spacing:-.3px;margin-bottom:1px;
}
.ai-role{
  font-size:12px;color:var(--text-2);
  font-weight:400;margin-bottom:7px;
}
.ai-stars{
  display:flex;align-items:center;gap:2px;
  margin-bottom:8px;
}
.ai-star{color:#F59E0B;font-size:12px;line-height:1;}
.ai-stars-label{
  font-size:11.5px;color:var(--text-2);font-weight:600;
  margin-left:4px;
}
.ai-tag{
  font-size:11px;font-weight:600;
  color:#0A8040;
  background:#E8F7EF;
  border:1px solid rgba(10,128,64,.14);
  padding:3px 10px;
  border-radius:20px;
  display:inline-flex;align-items:center;gap:4px;
}

.ai-stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--border-2);
  overflow:hidden;
}
.ai-stat{
  text-align:center;padding:14px 4px;
  background:var(--surface-2);
  border-right:1px solid var(--border-2);
}
.ai-stat:last-child{border-right:none;}
.ai-stat-val{
  font-size:17px;font-weight:700;color:var(--text);
  display:block;margin-bottom:3px;letter-spacing:-.3px;
}
.ai-stat-lbl{
  font-size:9.5px;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.07em;
  font-weight:600;
}

/* ─── Order card ─── */
.order-card{
  background:var(--surface);border-radius:var(--radius);
  overflow:hidden;margin-top:10px;
  box-shadow:var(--sh-md);
  border:1px solid var(--border-2);
  animation:fadeIn .4s var(--ease);
}
.order-hd{
  background:var(--brand);
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.order-hd-title{
  font-size:10.5px;font-weight:700;color:rgba(255,255,255,.8);
  text-transform:uppercase;letter-spacing:.08em;
}
.order-id{
  font-size:11px;font-family:'DM Mono',monospace;
  color:#fff;background:rgba(0,0,0,.15);
  padding:2px 8px;border-radius:4px;font-weight:500;
}

.order-body{padding:16px;}
.order-row{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:9px 0;border-bottom:1px solid var(--border-2);
}
.order-row:last-child{border-bottom:none;padding-bottom:0;margin-top:4px;}
.order-lbl{font-size:12.5px;color:var(--text-3);font-weight:500;}
.order-val{font-size:13px;color:var(--text);font-weight:600;text-align:right;}
.order-total{font-size:18px;font-weight:700;color:var(--brand);letter-spacing:-.5px;}

.order-ft{padding:0 16px 16px;}
.confirm-btn{
  width:100%;padding:14px;border-radius:12px;
  background:var(--brand);color:#fff;
  border:none;font-size:14.5px;font-weight:700;
  cursor:pointer;transition:all .25s var(--ease);
  box-shadow:0 4px 12px rgba(232,72,12,.25);
}
.confirm-btn:hover{background:var(--brand-dk);transform:translateY(-1px);}
.confirm-btn.done{
  background:var(--green);
  box-shadow:0 4px 12px rgba(29,199,95,.25);
  cursor:default;pointer-events:none;
}

/* ─── Delivery status ─── */
.delivery-status{
  background:#fff;border-radius:var(--radius);
  padding:18px;margin-top:10px;
  box-shadow:var(--sh-md);
  border:1px solid var(--border-2);
}
.ds-title{
  font-size:13px;font-weight:700;color:var(--text);
  margin-bottom:16px;display:flex;align-items:center;gap:8px;
}
.ds-steps{display:flex;flex-direction:column;gap:14px;position:relative;}
.ds-steps::before{
  content:'';position:absolute;left:5px;top:8px;bottom:8px;
  width:2px;background:var(--border-2);
}
.ds-step{
  display:flex;align-items:center;gap:12px;
  font-size:12.5px;color:var(--text-3);font-weight:500;
  position:relative;z-index:1;
}
.ds-dot{
  width:12px;height:12px;border-radius:50%;
  background:var(--border);border:2px solid #fff;
  box-shadow:var(--sh-xs);
}
.ds-step.done{color:var(--text-2);}
.ds-step.done .ds-dot{background:var(--green);}
.ds-step.active{color:var(--brand);font-weight:700;}
.ds-step.active .ds-dot{
  background:var(--brand);
  box-shadow:0 0 0 4px rgba(232,72,12,.15);
}

/* ─── Input area ─── */
.input-wrap{
  background:var(--surface);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border-2);
  position:relative;z-index:10;
  box-shadow:0 -4px 16px rgba(0,0,0,.03);
}

.quicks{
  display:flex;gap:8px;overflow-x:auto;
  padding-bottom:10px;margin-bottom:4px;
}
.quicks::-webkit-scrollbar{display:none;}
.q-chip{
  white-space:nowrap;padding:7px 14px;
  background:var(--surface-3);color:var(--text-2);
  border-radius:18px;font-size:12.5px;font-weight:600;
  cursor:pointer;border:1px solid rgba(0,0,0,.04);
  transition:all .2s ease;
}
.q-chip:hover{background:var(--brand-lt);color:var(--brand);border-color:rgba(232,72,12,.15);}

.input-box{
  display:flex;align-items:center;gap:10px;
  background:var(--surface-2);
  border-radius:var(--radius-xl);
  padding:5px 6px 5px 16px;
  border:1px solid var(--border-2);
  transition:border-color .2s ease, box-shadow .2s ease;
}
.input-box:focus-within{
  border-color:rgba(232,72,12,.3);
  box-shadow:0 0 0 4px rgba(232,72,12,.06);
  background:#fff;
}

input{
  flex:1;border:none;background:transparent;
  padding:10px 0;font-size:14.5px;color:var(--text);
  font-family:inherit;outline:none;
}
input::placeholder{color:var(--text-3);opacity:.8;}

.send-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--border);color:#fff;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:all .3s var(--spring);
  flex-shrink:0;
}
.send-btn.active{background:var(--brand);transform:scale(1.05);box-shadow:0 4px 12px rgba(232,72,12,.25);}
.send-btn:disabled{cursor:default;opacity:.6;}

/* ─── Typing indicator ─── */
.typing{display:flex;gap:4px;padding:12px 16px;background:var(--bubble-a);border-radius:var(--radius);width:fit-content;box-shadow:var(--sh-xs);margin-bottom:10px;}
.dot{width:5px;height:5px;background:var(--text-3);border-radius:50%;opacity:.4;animation:typing 1.4s infinite;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes typing{0%,100%{transform:translateY(0);opacity:.4;}50%{transform:translateY(-4px);opacity:1;}}

</style>
</head>
<body>

<div class="app">
  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
      <div class="loading-logo">DG</div>
      <div class="loading-text">
        <h2 class="loading-title">Diskgas</h2>
        <p class="loading-subtitle">Conectando você ao melhor serviço</p>
      </div>
      <div class="loading-steps">
        <div class="step-item" id="step1">
          <div class="step-icon">1</div>
          <div class="step-text">
            <span class="step-label">Localizando vendedor</span>
            <span class="step-description">Buscando o mais próximo...</span>
          </div>
        </div>
        <div class="step-item" id="step2">
          <div class="step-icon">2</div>
          <div class="step-text">
            <span class="step-label">Validando estoque</span>
            <span class="step-description">Verificando disponibilidade</span>
          </div>
        </div>
        <div class="step-item" id="step3">
          <div class="step-icon">3</div>
          <div class="step-text">
            <span class="step-label">Iniciando chat seguro</span>
            <span class="step-description">Criptografia de ponta a ponta</span>
          </div>
        </div>
      </div>
      <div class="loading-progress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text">
          <span class="progress-label">Sincronizando...</span>
          <span class="progress-percent" id="progressPercent">0%</span>
        </div>
      </div>
    </div>
  </div>

  <header class="header">
    <button class="back-btn">←</button>
    <div class="h-agent">
      <div class="h-avatar">
        <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=100&h=100&fit=crop" class="h-avatar-img" id="hImg">
        <div class="h-status-dot" id="hDot"></div>
      </div>
      <div class="h-info">
        <div class="h-name" id="hName">Conectando...</div>
        <div class="h-sub" id="hSub">aguarde um instante</div>
      </div>
    </div>
    <div class="h-actions">
      <button class="h-action">📞</button>
      <button class="h-action">⋮</button>
    </div>
  </header>

  <div class="msgs" id="msgs">
    <div class="date-sep"><span>HOJE</span></div>
    
    <!-- Typing row (hidden by default) -->
    <div class="msg-row agent" id="typingRow" style="display:none">
      <div class="msg-av-spacer"></div>
      <div class="typing">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>
  </div>

  <div class="input-wrap">
    <div class="quicks" id="quicks"></div>
    <div class="input-box">
      <input type="text" id="chatInput" placeholder="aguarde o início..." disabled>
      <button class="send-btn" id="sendBtn" disabled>↑</button>
    </div>
  </div>
</div>

<script>
const msgsEl = document.getElementById('msgs');
const inputEl = document.getElementById('chatInput');
const sendBtnEl = document.getElementById('sendBtn');
const typingRowEl = document.getElementById('typingRow');
const hNameEl = document.getElementById('hName');
const hSubEl = document.getElementById('hSub');
const hImgEl = document.getElementById('hImg');
const hDotEl = document.getElementById('hDot');
const quickEl = document.getElementById('quicks');
const loadingOverlay = document.getElementById('loadingOverlay');
const progressFill = document.getElementById('progressFill');
const progressPercent = document.getElementById('progressPercent');

let conversationState = 'idle';
let pendingOrder = {};
let lastSender = null;
let orderConfirmed = false;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1) + min);

function scrollToBottom(force=false){
  if(force){ msgsEl.scrollTop = msgsEl.scrollHeight; return; }
  const isNearBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 150;
  if(isNearBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
}

function setStatus(txt, type){
  hSubEl.textContent = txt;
  hSubEl.style.color = type==='typing' ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.72)';
}

function addMsg(content, side){
  const row = document.createElement('div');
  const isAgent = side==='agent';
  row.className = `msg-row ${side}`;
  if(lastSender === side) row.classList.add('grouped');
  
  const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  
  let html = '';
  if(isAgent && lastSender !== 'agent'){
    html += `<img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=100&h=100&fit=crop" class="msg-av">`;
  } else if(isAgent){
    html += `<div class="msg-av-spacer"></div>`;
  }
  
  html += `
    <div class="bubble ${isAgent?'a':'u'}">
      ${content}
      <div class="b-meta">
        <span class="b-time">${time}</span>
        ${!isAgent ? '<span class="b-receipt read">✓✓</span>' : ''}
      </div>
    </div>
  `;
  
  row.innerHTML = html;
  msgsEl.insertBefore(row, typingRowEl);
  lastSender = side;
  scrollToBottom();
}

function addSysMsg(txt){
  const d = document.createElement('div');
  d.className = 'sys-msg';
  d.innerHTML = `<span>${txt}</span>`;
  msgsEl.insertBefore(d, typingRowEl);
  scrollToBottom();
}

function addAgentCard(){
  const card = document.createElement('div');
  card.className = 'agent-intro';
  card.innerHTML = `
    <div class="ai-top">
      <div class="ai-img-wrapper">
        <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=100&h=100&fit=crop" class="ai-img">
        <div class="ai-badge-verified">✓</div>
      </div>
      <div class="ai-info">
        <div class="ai-name">Carlos Silva</div>
        <div class="ai-role">Consultor Diskgas</div>
        <div class="ai-stars">
          <span class="ai-star">★</span><span class="ai-star">★</span><span class="ai-star">★</span><span class="ai-star">★</span><span class="ai-star">★</span>
          <span class="ai-stars-label">5.0</span>
        </div>
        <div class="ai-tag">Vendedor Oficial</div>
      </div>
    </div>
    <div class="ai-stats">
      <div class="ai-stat">
        <span class="ai-stat-val">4.9</span>
        <span class="ai-stat-lbl">Avaliação</span>
      </div>
      <div class="ai-stat">
        <span class="ai-stat-val">1.2k+</span>
        <span class="ai-stat-lbl">Pedidos</span>
      </div>
      <div class="ai-stat">
        <span class="ai-stat-val">99%</span>
        <span class="ai-stat-lbl">Sucesso</span>
      </div>
    </div>
  `;
  msgsEl.insertBefore(card, typingRowEl);
  scrollToBottom(true);
}

function typingDelay(text){
  const base = 800;
  const perChar = 30;
  return Math.min(3000, base + (text.length * perChar));
}

async function showTyping(ms){
  lastSender=null;
  typingRowEl.style.display='flex';
  setStatus('digitando...','typing');
  scrollToBottom();
  await sleep(ms);
  typingRowEl.style.display='none';
  setStatus('online','online');
}

async function agentSay(messages){
  for(let i=0;i<messages.length;i++){
    await showTyping(typingDelay(messages[i]));
    addMsg(messages[i],'agent');
    if(i<messages.length-1) await sleep(rand(1000,1800));
  }
}

function enableInput(){
  inputEl.disabled=false;
  sendBtnEl.disabled=false;
  inputEl.placeholder='escreva sua mensagem...';
  inputEl.focus();
}
function disableInput(){
  inputEl.disabled=true;
  sendBtnEl.disabled=true;
}

inputEl.addEventListener('input',()=>{
  sendBtnEl.classList.toggle('active', inputEl.value.trim().length>0);
});

function setQuicks(opts){
  quickEl.innerHTML='';
  if(!opts.length){ quickEl.style.display='none'; return; }
  quickEl.style.display='flex';
  opts.forEach(([label,val])=>{
    const c=document.createElement('div');
    c.className='q-chip';
    c.textContent=label;
    c.onclick=()=>{ inputEl.value=val||label; handleSend(); };
    quickEl.appendChild(c);
  });
}

async function animateLoadingScreen(){
  const steps=[
    {step:1,progress:25,duration:2000},
    {step:2,progress:55,duration:2200},
    {step:3,progress:100,duration:1800},
  ];
  for(const item of steps){
    if(item.step>1){
      const prev=document.getElementById(`step${item.step-1}`);
      prev.classList.remove('active');
      prev.classList.add('completed');
      const prevIcon=prev.querySelector('.step-icon');
      prevIcon.textContent='✓';
    }
    const cur=document.getElementById(`step${item.step}`);
    cur.classList.add('active');
    progressFill.style.width=item.progress+'%';
    progressPercent.textContent=item.progress+'%';
    await sleep(item.duration);
  }
  const last=document.getElementById('step3');
  last.classList.remove('active');
  last.classList.add('completed');
  last.querySelector('.step-icon').textContent='✓';
  await sleep(500);
}

async function startFlow(){
  await animateLoadingScreen();
  await sleep(280);
  loadingOverlay.classList.add('hidden');
  await sleep(400);
  hImgEl.classList.add('live');
  hDotEl.style.opacity='1';
  hNameEl.textContent='Carlos';
  setStatus('online','online');
  addSysMsg('✓ Carlos entrou');
  await sleep(500);
  addAgentCard();
  await sleep(800);
  
  // Mensagem inicial do usuário simulada
  addMsg('opa, vc tem gás aí?','user');
  enableInput();
  
  // NOVO: Mensagem de "Preenchimento de Intervalo" (Intersticial)
  // Isso evita o vácuo enquanto o vendedor "digita" as respostas reais
  await sleep(600);
  addMsg('Olá! Localizei sua mensagem. Só um instante enquanto verifico nossa disponibilidade imediata para você...','agent');
  
  await sleep(1200);
  await agentSay(['opa, tudo certo','qual tamanho vc tá precisando?']);
  conversationState='choosing_product';
  setQuicks([['P13 (13kg)','P13'],['P20 (20kg)','P20'],['P45 (45kg)','P45']]);
}

async function handleAgentReply(userText){
  const t=userText.toLowerCase().trim();
  const isSlowResponse=Math.random()>.75;
  if(isSlowResponse) await sleep(rand(800,1500));

  if(conversationState==='idle'){
    if(/preço|valor|quanto|custa|tabela|valores/.test(t)){
      await agentSay(['blz, deixa eu te mostrar','P13 — R$ 115\nP20 — R$ 175\nP45 — R$ 320','tudo com entrega']);
      setQuicks([['P13','P13'],['P20','P20'],['P45','P45']]);
      return;
    }
    if(/demora|tempo|prazo|entrega|quanto leva|demora quanto/.test(t)){
      await agentSay(['demora uns 30 a 50 min, depende do bairro','quer pedir agora?']);
      setQuicks([['quero sim','quero pedir'],['deixo pra depois','depois']]);
      return;
    }
    if(/pedir|botijão|gás|gas|preciso|precisa/.test(t)){
      conversationState='choosing_product';
      await agentSay(['blz','qual tamanho?']);
      setQuicks([['P13','P13'],['P20','P20'],['P45','P45']]);
      return;
    }
    if(/obrigad|valeu|vlw|massa|brigadão|thanks/.test(t)){
      await agentSay(['tmj, qualquer coisa me chama']);
      return;
    }
    await agentSay(['pode me perguntar sobre os tamanhos, preço, entrega...','o que vc precisa?']);
    setQuicks([['pedir','quero pedir'],['preço','qual o preço'],['entrega','quanto demora']]);
    return;
  }

  if(conversationState==='choosing_product'){
    if(/p13|13/.test(t)){     pendingOrder={produto:'P13 — 13kg',preco:'R$ 115,00'}; }
    else if(/p20|20/.test(t)){pendingOrder={produto:'P20 — 20kg',preco:'R$ 175,00'}; }
    else if(/p45|45/.test(t)){pendingOrder={produto:'P45 — 45kg',preco:'R$ 320,00'}; }
    else{ await agentSay(['qual tamanho? P13, P20 ou P45?']); return; }
    conversationState='awaiting_address';
    await agentSay([`blz, ${pendingOrder.produto}`,'qual é o endereço?']);
    setQuicks([]);
    return;
  }

  if(conversationState==='awaiting_address'){
    if(t.replace(/\s/g,'').length<8){ await agentSay(['me manda o endereço completo aí']); return; }
    pendingOrder.endereco=userText;
    conversationState='confirm_order';
    const orderId='DG-'+Math.floor(10000+Math.random()*90000);
    pendingOrder.id=orderId;
    await agentSay(['deixa eu montar aqui...']);
    const card=`
      confere aí 👇
      <div class="order-card">
        <div class="order-hd">
          <span class="order-hd-title">Seu pedido</span>
          <span class="order-id">${orderId}</span>
        </div>
        <div class="order-body">
          <div class="order-row">
            <span class="order-lbl">Produto</span>
            <span class="order-val">${pendingOrder.produto}</span>
          </div>
          <div class="order-row">
            <span class="order-lbl">Endereço</span>
            <span class="order-val" style="max-width:58%">${pendingOrder.endereco}</span>
          </div>
          <div class="order-row">
            <span class="order-lbl">Pagamento</span>
            <span class="order-val">na entrega</span>
          </div>
          <div class="order-row">
            <span class="order-lbl">Prazo estimado</span>
            <span class="order-val" style="color:#0DA04A">30 – 50 min</span>
          </div>
          <div class="order-row">
            <span class="order-lbl" style="font-weight:600;color:var(--text)">Total</span>
            <span class="order-total">${pendingOrder.preco}</span>
          </div>
        </div>
        <div class="order-ft">
          <button class="confirm-btn" id="confirmOrderBtn" onclick="confirmOrder()">
            confirmar pedido ✓
          </button>
        </div>
      </div>`;
    await sleep(400);
    addMsg(card,'agent');
    setQuicks([['corrigir','errei o endereço'],['cancelar','cancela']]);
    return;
  }

  if(conversationState==='confirm_order'){
    if(/cancelar|desistir|não/.test(t)){
      conversationState='idle';
      await agentSay(['blz, sem problema','qualquer coisa me chama']);
      setQuicks([['novo pedido','quero pedir']]);
      return;
    }
    if(/corrigir|errad|mudar|endereço|errei/.test(t)){
      conversationState='awaiting_address';
      await agentSay(['qual é o endereço certo?']);
      setQuicks([]);
      return;
    }
    await agentSay(['é só clicar no botão aí 👆']);
    return;
  }

  if(conversationState==='order_confirmed'){
    if(/obrigad|valeu|vlw|massa|brigadão/.test(t)){
      await agentSay(['boa, aproveita!']);
      setQuicks([]);
      return;
    }
    if(/onde|status|chegou|andamento|saiu|rastreio/.test(t)){
      await agentSay(['tá sendo preparado agora','entregador sai em breve, uns 35 a 50 min']);
      return;
    }
    await agentSay(['qualquer coisa me chama']);
    return;
  }

  await agentSay(['fala aí, como posso te ajudar?']);
}

window.confirmOrder = async function(){
  if(orderConfirmed) return;
  orderConfirmed=true;
  conversationState='order_confirmed';
  const btn=document.getElementById('confirmOrderBtn');
  if(btn){ btn.classList.add('done'); btn.innerHTML='✓ Confirmado!'; btn.disabled=true; }
  await sleep(rand(1200,2000));
  await agentSay(['pedido confirmado!','tô mandando pra central...']);
  const status=`
    acompanha aí 👇
    <div class="delivery-status">
      <div class="ds-title">🚚 Rastreamento em tempo real</div>
      <div class="ds-steps">
        <div class="ds-step done"><div class="ds-dot"></div> Pedido recebido</div>
        <div class="ds-step done"><div class="ds-dot"></div> Confirmado</div>
        <div class="ds-step active"><div class="ds-dot"></div> Preparando</div>
        <div class="ds-step"><div class="ds-dot"></div> Saiu pra entrega</div>
        <div class="ds-step"><div class="ds-dot"></div> Entregue</div>
      </div>
    </div>`;
  await sleep(800);
  addMsg(status,'agent');
  await sleep(rand(2000,3500));
  await agentSay([
    'entregador sai pra aí em breve',
    'uns 35 a 50 min',
    'qualquer coisa me chama aí 👋',
  ]);
  setQuicks([['onde tá?','qual the status?'],['valeu','obrigado']]);
};

async function handleSend(){
  const text=inputEl.value.trim();
  if(!text) return;
  inputEl.value='';
  sendBtnEl.classList.remove('active');
  setQuicks([]);
  disableInput();
  addMsg(text,'user');
  await handleAgentReply(text);
  enableInput();
}

sendBtnEl.onclick=handleSend;
inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); handleSend(); }});

window.onload=startFlow;
</script>
</body>
</html>
