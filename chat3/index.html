<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diskgas — Atendimento Profissional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --brand:      #E8480C;
  --brand-dk:   #C23A08;
  --brand-lt:   #FFF2EC;
  --brand-mid:  #FF6430;

  --bg:         #F2F0EB;
  --surface:    #FFFFFF;
  --surface-2:  #F9F6F2;
  --surface-3:  #F3EEE7;

  --text:       #1A1714;
  --text-2:     #5C5650;
  --text-3:     #9A9288;

  --border:     #DDD7CE;
  --border-2:   #EAE4DA;

  --bubble-a:   #FFFFFF;
  --bubble-u:   #FFE1CB;

  --green:      #1DC75F;
  --green-dk:   #0DA04A;
  --green-lt:   #F0FDF6;
  --green-bd:   rgba(13,160,74,.15);

  --read-clr:   #38BDF8;

  --radius-xs:  6px;
  --radius-sm:  10px;
  --radius:     16px;
  --radius-lg:  22px;
  --radius-xl:  28px;

  --sh-xs: 0 1px 3px rgba(0,0,0,.05);
  --sh-sm: 0 2px 8px rgba(0,0,0,.07);
  --sh-md: 0 4px 16px rgba(0,0,0,.09);
  --sh-lg: 0 8px 32px rgba(0,0,0,.09);

  --ease:   cubic-bezier(.25,.46,.45,.94);
  --spring: cubic-bezier(.34,1.56,.64,1);
}

html,body{
  height:100%;width:100%;
  font-family:'DM Sans',sans-serif;
  background:#0D0C0B;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
}

.app{
  width:100%;max-width:430px;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg);
  position:relative;overflow:hidden;
}

/* Subtle warm atmosphere */
.app::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 100% 28% at 50% 0%, rgba(232,72,12,.06) 0%, transparent 100%),
    radial-gradient(ellipse 70% 18% at 0% 100%,  rgba(232,72,12,.03) 0%, transparent 100%);
}

/* ─── Header ─── */
.header{
  background:var(--brand);
  padding:13px 14px;
  display:flex;align-items:center;gap:11px;
  position:relative;z-index:10;
  box-shadow:0 1px 0 rgba(0,0,0,.1), 0 3px 14px rgba(0,0,0,.14);
}
.header::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,transparent 55%);
}

.back-btn{
  width:34px;height:34px;border-radius:9px;
  background:rgba(255,255,255,.14);border:none;cursor:pointer;
  color:rgba(255,255,255,.96);font-size:17px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background .18s ease;
}

.h-agent{display:flex;align-items:center;gap:11px;flex:1;min-width:0;}

.h-avatar{position:relative;}
.h-avatar-img{
  width:40px;height:40px;border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.45);
  box-shadow:0 0 0 2px rgba(255,255,255,.12);
}
.h-status-dot{
  position:absolute;bottom:1px;right:1px;
  width:11px;height:11px;border-radius:50%;
  background:var(--green);
  border:2px solid var(--brand);
}

.h-info{flex:1;min-width:0;}
.h-name{font-size:14.5px;font-weight:600;color:#fff;letter-spacing:.2px;}
.h-sub{
  font-size:11.5px;color:rgba(255,255,255,.72);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:1px;font-weight:400;
}

/* ─── Messages ─── */
.msgs{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 14px 12px;
  display:flex;flex-direction:column;gap:12px;
  position:relative;z-index:1;
  scroll-behavior:smooth;
  height: 100%;
}

.sys-msg{text-align:center;margin:10px 0;animation:fadeIn .4s var(--ease);}
.sys-msg span{
  font-size:11.5px;color:var(--text-2);
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(10px);
  border:1px solid rgba(0,0,0,.05);
  border-radius:10px;
  padding:6px 16px;
  box-shadow:var(--sh-xs);
  font-weight:500;letter-spacing:.2px;
}

/* Spinner Style */
.spinner-container {
  display: flex;
  justify-content: center;
  margin: 5px 0 15px;
  animation: fadeIn 0.3s ease;
}
.loading-spinner {
  width: 20px;
  height: 20px;
  border: 2px solid rgba(232,72,12, 0.1);
  border-top: 2px solid var(--brand);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.msg-row{
  display:flex;gap:8px;align-items:flex-end;
  max-width:88%;margin-bottom:2px;
  animation:msgIn .32s var(--ease);
}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;max-width:80%;}
.msg-row.agent{align-self:flex-start;}

.msg-avatar{
  width:28px;height:28px;border-radius:50%;
  object-fit:cover;flex-shrink:0;
  margin-bottom:2px;
  box-shadow: var(--sh-xs);
}

@keyframes msgIn{
  from{opacity:0;transform:translateY(7px) scale(.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.bubble{
  padding:10px 13px 8px;
  border-radius:var(--radius);
  font-size:14px;line-height:1.6;
  position:relative;
}
.bubble.a{
  background:var(--bubble-a);
  color:var(--text);
  border-radius:4px var(--radius) var(--radius) var(--radius);
  box-shadow:var(--sh-sm);
}
.bubble.u{
  background:var(--bubble-u);
  color:var(--text);
  border-radius:var(--radius) 4px var(--radius) var(--radius);
  box-shadow:var(--sh-sm);
}

.b-meta{
  display:flex;align-items:center;justify-content:flex-end;
  gap:3px;margin-top:2px;
  float:right;margin-left:10px;
}
.b-time{font-size:10.5px;color:rgba(0,0,0,.32);}

/* ─── REVISED: Agent Intro Card ─── */
.agent-intro{
  background:var(--surface);
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin:4px 0 12px;
  box-shadow: var(--sh-md);
  border:1px solid rgba(0,0,0,.04);
  width:100%;
  flex-shrink: 0; /* Prevent shrinking */
  position:relative;
  animation:cardSlideIn .55s var(--spring);
}

.ai-header{
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-mid) 100%);
  padding: 8px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ai-header-title{
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  opacity: 0.9;
}
.ai-badge-verified{
  background: rgba(255,255,255,0.2);
  color: #fff;
  font-size: 9px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 3px;
}

.ai-body{
  display:flex;gap:12px;align-items:center;
  padding:14px 14px;
}
.ai-img-wrapper{
  position: relative;
}
.ai-img{
  width:52px;height:52px;border-radius:50%;
  object-fit:cover;
  border:2.5px solid #fff;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}
.ai-status-online{
  position: absolute;
  bottom: 2px;
  right: 2px;
  width: 12px;
  height: 12px;
  background: var(--green);
  border: 2px solid #fff;
  border-radius: 50%;
}

.ai-info{flex:1;}
.ai-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:1px;}
.ai-role{font-size:11.5px;color:var(--text-2);margin-bottom:4px;display:flex;align-items:center;gap:4px;}

.ai-stats{
  display: flex;
  gap: 12px;
  border-top: 1px solid var(--border-2);
  padding: 10px 14px;
  background: var(--surface-2);
}
.ai-stat-item{
  display: flex;
  flex-direction: column;
}
.ai-stat-val{
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
}
.ai-stat-lbl{
  font-size: 9px;
  color: var(--text-3);
  text-transform: uppercase;
  font-weight: 600;
}

@keyframes cardSlideIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

/* ─── Typing ─── */
.typing-row{
  display:none;align-items:flex-end;gap:8px;
  align-self:flex-start;animation:fadeIn .2s ease;
}
.typing-bubble{
  background:var(--bubble-a);
  border-radius:4px var(--radius) var(--radius) var(--radius);
  padding:12px 16px;
  box-shadow:var(--sh-sm);
  display:flex;gap:5px;
}
.typing-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(0,0,0,.17);
  animation:typePulse 1.4s ease-in-out infinite;
}
.typing-dot:nth-child(2){animation-delay:.18s;}
.typing-dot:nth-child(3){animation-delay:.36s;}
@keyframes typePulse{
  0%,60%,100%{transform:translateY(0);opacity:.35;}
  30%{transform:translateY(-4px);opacity:1;}
}

/* ─── Footer ─── */
.footer{
  background:var(--surface-2);
  border-top:1px solid var(--border-2);
  padding:11px 12px 15px;
}
.input-row{display:flex;gap:8px;align-items:flex-end;}
.input-wrap{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--surface);
  border-radius:26px;
  padding:10px 15px;
  border:1.5px solid var(--border);
  transition: border-color 0.2s ease;
}
.input-wrap:focus-within{
  border-color: var(--brand-mid);
}
.msg-input{
  flex:1;border:none;outline:none;
  font-size:14.5px;font-family:'DM Sans',sans-serif;
  background:transparent;
}
.send-btn{
  width:46px;height:46px;border-radius:50%;
  background:var(--brand);
  color:#fff; border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition: transform 0.2s var(--spring), background 0.2s ease;
}
.send-btn:active{
  transform: scale(0.92);
  background: var(--brand-dk);
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <button class="back-btn">←</button>
    <div class="h-agent">
      <div class="h-avatar">
        <img src="https://i.pravatar.cc/100?u=diskgas" class="h-avatar-img" alt="Avatar">
        <div class="h-status-dot"></div>
      </div>
      <div class="h-info">
        <div class="h-name">Carlos - Diskgas</div>
        <div class="h-sub">Online agora</div>
      </div>
    </div>
  </header>

  <div class="msgs" id="msgs">
    <!-- Messages will appear here -->
  </div>

  <div class="typing-row" id="typingRow" style="padding: 0 14px 10px;">
    <img src="https://i.pravatar.cc/100?u=carlos" class="msg-avatar" alt="Avatar">
    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="input-row">
      <div class="input-wrap">
        <input type="text" class="msg-input" id="msgInput" placeholder="Escreva sua mensagem...">
      </div>
      <button class="send-btn" id="sendBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </footer>
</div>

<script>
const msgsEl = document.getElementById('msgs');
const inputEl = document.getElementById('msgInput');
const sendBtnEl = document.getElementById('sendBtn');
const typingRowEl = document.getElementById('typingRow');

const agentAvatar = "https://i.pravatar.cc/100?u=carlos";
const now = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

// Helper to scroll to bottom with smooth behavior and extra safety
function scrollToBottom() {
  // Use a small timeout to ensure the DOM has rendered the new height
  setTimeout(() => {
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }, 100);
}

function addMsg(text, type) {
  const row = document.createElement('div');
  row.className = `msg-row ${type}`;
  
  let avatarHtml = '';
  if (type === 'agent') {
    avatarHtml = `<img src="${agentAvatar}" class="msg-avatar" alt="Avatar">`;
  }

  row.innerHTML = `
    ${avatarHtml}
    <div class="bubble ${type === 'user' ? 'u' : 'a'}">
      ${text}
      <div class="b-meta"><span class="b-time">${now()}</span></div>
    </div>
  `;
  msgsEl.appendChild(row);
  scrollToBottom();
}

function addSystemMsg(text, showSpinner = false) {
  const div = document.createElement('div');
  div.className = 'sys-msg';
  const span = document.createElement('span');
  span.innerHTML = text;
  div.appendChild(span);
  msgsEl.appendChild(div);
  
  let spinner = null;
  if (showSpinner) {
    spinner = document.createElement('div');
    spinner.className = 'spinner-container';
    spinner.innerHTML = '<div class="loading-spinner"></div>';
    msgsEl.appendChild(spinner);
  }
  
  scrollToBottom();
  return { container: div, textSpan: span, spinner: spinner };
}

function showAgentIntro() {
  const card = document.createElement('div');
  card.className = 'agent-intro';
  card.innerHTML = `
    <div class="ai-header">
      <div class="ai-header-title">Consultor Disponível</div>
      <div class="ai-badge-verified">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Verificado
      </div>
    </div>
    <div class="ai-body">
      <div class="ai-img-wrapper">
        <img src="${agentAvatar}" class="ai-img" alt="Carlos">
        <div class="ai-status-online"></div>
      </div>
      <div class="ai-info">
        <div class="ai-name">Carlos Oliveira</div>
        <div class="ai-role">
          <span>Especialista em Atendimento</span>
        </div>
        <div style="font-size: 11px; color: var(--green-dk); font-weight: 600; display: flex; align-items: center; gap: 4px;">
          <span style="width: 6px; height: 6px; background: var(--green); border-radius: 50%;"></span>
          Responde em poucos minutos
        </div>
      </div>
    </div>
    <div class="ai-stats">
      <div class="ai-stat-item">
        <span class="ai-stat-val">1.2k+</span>
        <span class="ai-stat-lbl">Vendas</span>
      </div>
      <div class="ai-stat-item">
        <span class="ai-stat-val">4.9/5</span>
        <span class="ai-stat-lbl">Avaliação</span>
      </div>
      <div class="ai-stat-item">
        <span class="ai-stat-val">5 anos</span>
        <span class="ai-stat-lbl">Experiência</span>
      </div>
    </div>
  `;
  msgsEl.appendChild(card);
  scrollToBottom();
}

inputEl.onkeypress = (e) => { 
  if(e.key === 'Enter') {
    const text = inputEl.value;
    if(!text) return;
    inputEl.value = '';
    addMsg(text, 'user');
    handleResponseFlow();
  }
};

// Auto-start with automatic user message
window.onload = async () => {
  addSystemMsg("Conexão segura estabelecida");
  await new Promise(r => setTimeout(r, 1000));
  
  // Simula a primeira mensagem automática do usuário
  const defaultMsg = "Olá! Gostaria de saber mais sobre os produtos.";
  addMsg(defaultMsg, 'user');
  
  // Dispara o fluxo de resposta
  handleResponseFlow();
};

async function handleResponseFlow() {
  // 1. GAP FILLER: System Message with Spinner
  await new Promise(r => setTimeout(r, 800));
  const sysObj = addSystemMsg("Buscando o melhor consultor para você...", true);

  // 2. Wait and update to "Located" with Check
  await new Promise(r => setTimeout(r, 1800));
  if (sysObj.spinner) sysObj.spinner.remove();
  
  // Atualiza o texto e adiciona o check
  sysObj.textSpan.innerHTML = "Consultor Carlos conectado ✓";
  sysObj.textSpan.style.color = "var(--green-dk)";
  sysObj.textSpan.style.background = "var(--green-lt)";
  sysObj.textSpan.style.borderColor = "var(--green-bd)";

  // 3. GAP FILLER: Agent Intro
  await new Promise(r => setTimeout(r, 600));
  showAgentIntro();

  // 3. Typing indicator starts
  await new Promise(r => setTimeout(r, 1200));
  typingRowEl.style.display = 'flex';
  scrollToBottom();

  // 4. Agent Response
  await new Promise(r => setTimeout(r, 2500));
  typingRowEl.style.display = 'none';
  addMsg("Olá! Sou o Carlos. É um prazer te atender. Vi que você tem interesse em nossos produtos. Como posso te ajudar agora?", 'agent');
}

// Update sendBtn to use the new flow logic
sendBtnEl.onclick = async () => {
  const text = inputEl.value;
  if(!text) return;
  inputEl.value = '';
  addMsg(text, 'user');
  handleResponseFlow();
};
</script>
</body>
</html>
