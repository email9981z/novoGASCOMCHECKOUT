<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diskgas — Atendimento Profissional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* Professional Blue Palette - Enhanced */
  --brand:      #0F5BA8;
  --brand-dk:   #0A3F7A;
  --brand-lt:   #E8F2FF;
  --brand-mid:  #1B7FD8;
  --brand-accent: #2B8FE8;

  --bg:         #F8FAFB;
  --surface:    #FFFFFF;
  --surface-2:  #F5F7FA;
  --surface-3:  #F0F3F7;

  --text:       #0F1419;
  --text-2:     #4A5568;
  --text-3:     #8A92A2;
  --text-4:     #B0B8C1;

  --border:     #D5DDE5;
  --border-2:   #E5EAEF;
  --border-3:   #F0F3F7;

  --bubble-a:   #FFFFFF;
  --bubble-u:   #E8F2FF;

  --green:      #10B981;
  --green-dk:   #059669;
  --green-lt:   #F0FDF4;
  --green-bd:   rgba(16,185,129,.12);

  --read-clr:   #06B6D4;

  --radius-xs:  6px;
  --radius-sm:  10px;
  --radius:     14px;
  --radius-lg:  20px;
  --radius-xl:  28px;

  --sh-xs: 0 1px 2px rgba(15,20,25,.04);
  --sh-sm: 0 2px 6px rgba(15,20,25,.06);
  --sh-md: 0 4px 12px rgba(15,20,25,.08);
  --sh-lg: 0 8px 24px rgba(15,20,25,.10);
  --sh-xl: 0 12px 32px rgba(15,20,25,.12);

  --ease:   cubic-bezier(.25,.46,.45,.94);
  --spring: cubic-bezier(.34,1.56,.64,1);
}

html,body{
  height:100%;width:100%;
  font-family:'DM Sans',sans-serif;
  background:#0F1419;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
}

.app{
  width:100%;max-width:430px;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg);
  position:relative;overflow:hidden;
}

/* Subtle professional atmosphere with enhanced gradient */
.app::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 100% 28% at 50% 0%, rgba(15,91,168,.06) 0%, transparent 100%),
    radial-gradient(ellipse 70% 18% at 0% 100%,  rgba(15,91,168,.03) 0%, transparent 100%);
}

/* ─── Header ─── */
.header{
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-mid) 100%);
  padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  position:relative;z-index:10;
  box-shadow: 0 2px 12px rgba(15,91,168,.15), 0 1px 0 rgba(0,0,0,.05);
}
.header::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.08) 0%,transparent 55%);
}

.back-btn{
  width:36px;height:36px;border-radius:10px;
  background:rgba(255,255,255,.16);border:none;cursor:pointer;
  color:rgba(255,255,255,.96);font-size:18px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background .2s ease, transform .15s ease;
  font-weight:600;
}
.back-btn:hover{
  background:rgba(255,255,255,.24);
  transform:translateX(-2px);
}
.back-btn:active{
  transform:scale(.92);
}

.h-agent{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}

.h-avatar{position:relative;}
.h-avatar-img{
  width:42px;height:42px;border-radius:50%;
  object-fit:cover;
  border:2.5px solid rgba(255,255,255,.6);
  box-shadow:0 0 0 2px rgba(15,91,168,.3), 0 2px 8px rgba(0,0,0,.15);
}
.h-status-dot{
  position:absolute;bottom:0;right:0;
  width:12px;height:12px;border-radius:50%;
  background:var(--green);
  border:2.5px solid var(--brand);
  box-shadow: 0 0 0 2px rgba(255,255,255,.4), inset 0 0 0 1px rgba(0,0,0,.1);
  animation: statusPulse 2s ease-in-out infinite;
}

@keyframes statusPulse{
  0%, 100%{box-shadow: 0 0 0 2px rgba(255,255,255,.4), inset 0 0 0 1px rgba(0,0,0,.1), 0 0 0 0 rgba(16,185,129,.4);}
  50%{box-shadow: 0 0 0 2px rgba(255,255,255,.4), inset 0 0 0 1px rgba(0,0,0,.1), 0 0 0 4px rgba(16,185,129,.2);}
}

.h-info{flex:1;min-width:0;}
.h-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:.3px;}
.h-sub{
  font-size:12px;color:rgba(255,255,255,.82);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:2px;font-weight:400;
}

/* ─── Messages ─── */
.msgs{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:18px 14px 14px;
  display:flex;flex-direction:column;gap:14px;
  position:relative;z-index:1;
  scroll-behavior:smooth;
  height: 100%;
}

.sys-msg{text-align:center;margin:12px 0;animation:fadeIn .4s var(--ease);}
.sys-msg span{
  font-size:12px;color:var(--text-2);
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(12px);
  border:1px solid rgba(15,91,168,.12);
  border-radius:12px;
  padding:7px 18px;
  box-shadow:var(--sh-sm);
  font-weight:500;letter-spacing:.2px;
}

/* Spinner Style - Enhanced */
.spinner-container {
  display: flex;
  justify-content: center;
  margin: 6px 0 16px;
  animation: fadeIn 0.3s ease;
}
.loading-spinner {
  width: 22px;
  height: 22px;
  border: 2.5px solid rgba(15,91,168, 0.12);
  border-top: 2.5px solid var(--brand);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  box-shadow: 0 0 0 2px rgba(15,91,168, 0.04);
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.msg-row{
  display:flex;gap:10px;align-items:flex-end;
  max-width:88%;margin-bottom:0px;
  animation:msgIn .35s var(--ease);
}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;max-width:82%;}
.msg-row.agent{align-self:flex-start;}

.msg-avatar{
  width:32px;height:32px;border-radius:50%;
  object-fit:cover;flex-shrink:0;
  margin-bottom:2px;
  box-shadow: 0 2px 6px rgba(15,91,168,.12);
  border: 1.5px solid rgba(15,91,168,.15);
}

@keyframes msgIn{
  from{opacity:0;transform:translateY(8px) scale(.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.bubble{
  padding:11px 14px 9px;
  border-radius:var(--radius);
  font-size:14.5px;line-height:1.65;
  position:relative;
  word-wrap:break-word;
  overflow-wrap:break-word;
}
.bubble.a{
  background:var(--bubble-a);
  color:var(--text);
  border-radius:4px var(--radius) var(--radius) var(--radius);
  box-shadow: 0 1px 3px rgba(15,20,25,.08), 0 0 0 1px rgba(15,20,25,.04);
  border: 1px solid var(--border-2);
}
.bubble.u{
  background:var(--bubble-u);
  color:var(--text);
  border-radius:var(--radius) 4px var(--radius) var(--radius);
  box-shadow: 0 1px 3px rgba(27,127,216,.1), 0 0 0 1px rgba(27,127,216,.08);
  border: 1px solid rgba(27,127,216,.2);
}

.b-meta{
  display:flex;align-items:center;justify-content:flex-end;
  gap:5px;margin-top:3px;
  float:right;margin-left:10px;
}
.b-time{font-size:11px;color:rgba(15,20,25,.4);font-weight:400;}
.b-read{
  font-size:11px;color:var(--read-clr);
  display:flex;align-items:center;gap:2px;
}

/* ─── Agent Intro Card ─── */
.agent-intro{
  background:var(--surface);
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin:6px 0 10px;
  box-shadow: 0 2px 12px rgba(15,91,168,.08);
  border:1px solid var(--border-2);
  width:100%;
  flex-shrink: 0;
  position:relative;
  animation:cardSlideIn .55s var(--spring);
}

.ai-header{
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-mid) 100%);
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ai-header-title{
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  opacity: 0.95;
}
.ai-badge-verified{
  background: rgba(255,255,255,0.25);
  color: #fff;
  font-size: 8.5px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 3px;
  border: 1px solid rgba(255,255,255,.25);
  backdrop-filter: blur(6px);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.ai-body{
  display:flex;gap:12px;align-items:center;
  padding:12px 14px;
}
.ai-img-wrapper{
  position: relative;
}
.ai-img{
  width:44px;height:44px;border-radius:50%;
  object-fit:cover;
  border:2.5px solid #fff;
  box-shadow: 0 2px 8px rgba(15,91,168,.15), 0 0 0 1px rgba(15,91,168,.1);
  flex-shrink: 0;
}
.ai-status-online{
  position: absolute;
  bottom: 0px;
  right: 0px;
  width: 12px;
  height: 12px;
  background: var(--green);
  border: 2.5px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(15,91,168,.2), inset 0 0 0 1px rgba(0,0,0,.1);
  animation: statusPulse 2s ease-in-out infinite;
}

.ai-info{flex:1;min-width:0;}
.ai-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;letter-spacing:.2px;}
.ai-role{font-size:11px;color:var(--text-2);margin-bottom:4px;display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}

.ai-status-info{
  font-size: 11px;
  color: var(--green-dk);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 5px;
  letter-spacing: .2px;
}
.ai-status-dot{
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(16,185,129,.2);
}

.ai-stats{
  display: none;
}
.ai-stat-item{
  display: flex;
  flex-direction: column;
}
.ai-stat-val{
  font-size: 12px;
  font-weight: 700;
  color: var(--brand);
}
.ai-stat-lbl{
  font-size: 9px;
  color: var(--text-3);
  text-transform: uppercase;
  font-weight: 600;
  letter-spacing: 0.3px;
}

@keyframes cardSlideIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

/* ─── Typing ─── */
.typing-row{
  display:none;align-items:flex-end;gap:10px;
  align-self:flex-start;animation:fadeIn .25s ease;
}
.typing-bubble{
  background:var(--bubble-a);
  border-radius:4px var(--radius) var(--radius) var(--radius);
  padding:12px 16px;
  box-shadow: 0 1px 3px rgba(15,20,25,.08), 0 0 0 1px rgba(15,20,25,.04);
  display:flex;gap:6px;
  border: 1px solid var(--border-2);
  align-items:center;
  min-height:42px;
}
.typing-dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(15,20,25,.25);
  animation:typePulse 1.4s ease-in-out infinite;
}
.typing-dot:nth-child(2){animation-delay:.2s;}
.typing-dot:nth-child(3){animation-delay:.4s;}
@keyframes typePulse{
  0%,60%,100%{transform:translateY(0);opacity:.35;}
  30%{transform:translateY(-5px);opacity:1;}
}

/* ─── Footer ─── */
.footer{
  background:var(--surface);
  border-top:1px solid var(--border-2);
  padding:12px 14px 16px;
  box-shadow: 0 -2px 8px rgba(0,0,0,.02);
}
.input-row{display:flex;gap:10px;align-items:flex-end;}
.input-wrap{
  flex:1;display:flex;align-items:center;gap:10px;
  background:var(--surface-2);
  border-radius:26px;
  padding:11px 16px;
  border:1.5px solid var(--border);
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.input-wrap:focus-within{
  border-color: var(--brand-mid);
  box-shadow: 0 0 0 3px rgba(27,127,216,.1);
  background:var(--surface);
}
.msg-input{
  flex:1;border:none;outline:none;
  font-size:14.5px;font-family:'DM Sans',sans-serif;
  background:transparent;
  color: var(--text);
  font-weight:400;
}
.msg-input::placeholder{
  color: var(--text-3);
  font-weight:400;
}
.send-btn{
  width:44px;height:44px;border-radius:50%;
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-mid) 100%);
  color:#fff; border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition: transform 0.2s var(--spring), box-shadow 0.2s ease;
  box-shadow: 0 2px 8px rgba(15,91,168,.16);
  flex-shrink: 0;
  font-weight:600;
}
.send-btn:hover{
  box-shadow: 0 4px 14px rgba(15,91,168,.24);
  transform: translateY(-1px);
}
.send-btn:active{
  transform: scale(0.88);
  box-shadow: 0 1px 4px rgba(15,91,168,.12);
}

/* Scrollbar Styling */
.msgs::-webkit-scrollbar{
  width:6px;
}
.msgs::-webkit-scrollbar-track{
  background:transparent;
}
.msgs::-webkit-scrollbar-thumb{
  background:rgba(15,91,168,.15);
  border-radius:3px;
  transition: background 0.2s ease;
}
.msgs::-webkit-scrollbar-thumb:hover{
  background:rgba(15,91,168,.25);
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <button class="back-btn">←</button>
    <div class="h-agent">
      <div class="h-avatar">
        <img src="https://i.pravatar.cc/100?u=diskgas" class="h-avatar-img" alt="Avatar">
        <div class="h-status-dot"></div>
      </div>
      <div class="h-info">
        <div class="h-name">Carlos Oliveira</div>
        <div class="h-sub">Online agora</div>
      </div>
    </div>
  </header>

  <div class="msgs" id="msgs">
    <!-- Messages will appear here -->
  </div>

  <div class="typing-row" id="typingRow" style="padding: 0 14px 10px;">
    <img src="https://i.pravatar.cc/100?u=carlos" class="msg-avatar" alt="Avatar">
    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="input-row">
      <div class="input-wrap">
        <input type="text" class="msg-input" id="msgInput" placeholder="Escreva sua mensagem...">
      </div>
      <button class="send-btn" id="sendBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </footer>
</div>

<script>
const msgsEl = document.getElementById('msgs');
const inputEl = document.getElementById('msgInput');
const sendBtnEl = document.getElementById('sendBtn');
const typingRowEl = document.getElementById('typingRow');

const agentAvatar = "https://i.pravatar.cc/100?u=carlos";
const now = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

let isFirstContact = true;
let messageCount = 0;

// Helper to scroll to bottom with smooth behavior
function scrollToBottom() {
  setTimeout(() => {
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }, 100);
}

function addMsg(text, type) {
  const row = document.createElement('div');
  row.className = `msg-row ${type}`;
  
  let avatarHtml = '';
  if (type === 'agent') {
    avatarHtml = `<img src="${agentAvatar}" class="msg-avatar" alt="Avatar">`;
  }

  const readIndicator = type === 'user' ? `<span class="b-read">✓✓</span>` : '';
  
  row.innerHTML = `
    ${avatarHtml}
    <div class="bubble ${type === 'user' ? 'u' : 'a'}">
      ${text}
      <div class="b-meta">
        <span class="b-time">${now()}</span>
        ${readIndicator}
      </div>
    </div>
  `;
  msgsEl.appendChild(row);
  scrollToBottom();
}

function addSystemMsg(text, showSpinner = false) {
  const div = document.createElement('div');
  div.className = 'sys-msg';
  const span = document.createElement('span');
  span.innerHTML = text;
  div.appendChild(span);
  msgsEl.appendChild(div);
  
  let spinner = null;
  if (showSpinner) {
    spinner = document.createElement('div');
    spinner.className = 'spinner-container';
    spinner.innerHTML = '<div class="loading-spinner"></div>';
    msgsEl.appendChild(spinner);
  }
  
  scrollToBottom();
  return { container: div, textSpan: span, spinner: spinner };
}

function showAgentIntro() {
  const card = document.createElement('div');
  card.className = 'agent-intro';
  card.innerHTML = `
    <div class="ai-header">
      <div class="ai-header-title">Consultor Disponível</div>
      <div class="ai-badge-verified">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Verificado
      </div>
    </div>
    <div class="ai-body">
      <div class="ai-img-wrapper">
        <img src="${agentAvatar}" class="ai-img" alt="Carlos">
        <div class="ai-status-online"></div>
      </div>
      <div class="ai-info">
        <div class="ai-name">Carlos Oliveira</div>
        <div class="ai-role">
          <span>Especialista em Atendimento</span>
        </div>
        <div class="ai-status-info">
          <div class="ai-status-dot"></div>
          Responde em poucos minutos
        </div>
      </div>
    </div>
  `;
  msgsEl.appendChild(card);
  scrollToBottom();
}

inputEl.onkeypress = (e) => { 
  if(e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const text = inputEl.value.trim();
    if(!text) return;
    inputEl.value = '';
    addMsg(text, 'user');
    messageCount++;
    handleResponseFlow();
  }
};

// Auto-start with automatic user message
window.onload = async () => {
  addSystemMsg("🔒 Conexão segura estabelecida");
  await new Promise(r => setTimeout(r, 1200));
  
  // Simula a primeira mensagem automática do usuário
  const defaultMsg = "Olá! Gostaria de saber mais sobre os produtos.";
  addMsg(defaultMsg, 'user');
  messageCount++;
  
  // Dispara o fluxo de resposta
  handleResponseFlow();
};

async function handleResponseFlow() {
  if (isFirstContact) {
    // 1. GAP FILLER: System Message with Spinner
    await new Promise(r => setTimeout(r, 900));
    const sysObj = addSystemMsg("Buscando o melhor consultor para você...", true);

    // 2. Wait and update to "Located" with Check
    await new Promise(r => setTimeout(r, 2000));
    if (sysObj.spinner) sysObj.spinner.remove();
    
    // Atualiza o texto e adiciona o check
    sysObj.textSpan.innerHTML = "✓ Consultor Carlos conectado";
    sysObj.textSpan.style.color = "var(--green-dk)";
    sysObj.textSpan.style.background = "var(--green-lt)";
    sysObj.textSpan.style.borderColor = "var(--green-bd)";

    // 3. GAP FILLER: Agent Intro
    await new Promise(r => setTimeout(r, 700));
    showAgentIntro();

    isFirstContact = false;
  }

  // 3. Typing indicator starts
  await new Promise(r => setTimeout(r, 1400));
  typingRowEl.style.display = 'flex';
  scrollToBottom();

  // 4. Agent Response
  await new Promise(r => setTimeout(r, 2800));
  typingRowEl.style.display = 'none';
  
  if (messageCount === 1) {
      addMsg("Olá! Sou o Carlos. É um prazer te atender. 👋\n\nVi que você tem interesse em nossos produtos. Como posso ajudar você hoje?", 'agent');
  } else {
      const responses = [
        "Entendi perfeitamente. Deixa eu buscar mais informações para você.",
        "Ótimo! Vou te ajudar com isso. Um momento...",
        "Claro! Essa é uma ótima pergunta. Deixa eu detalhar melhor.",
        "Perfeito! Vou verificar os melhores opções para você.",
        "Entendi sua necessidade. Vou te passar as melhores soluções."
      ];
      const randomResponse = responses[Math.floor(Math.random() * responses.length)];
      addMsg(randomResponse, 'agent');
  }
}

// Update sendBtn to use the new flow logic
sendBtnEl.onclick = async () => {
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = '';
  addMsg(text, 'user');
  messageCount++;
  handleResponseFlow();
};
</script>
</body>
</html>
