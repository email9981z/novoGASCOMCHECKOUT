<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diskgas — Atendimento Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Cores Profissionais e Sóbrias */
  --primary: #0052CC;
  --primary-dark: #0747A6;
  --primary-light: #DEEBFF;
  --success: #36B37E;
  --bg-app: #F4F5F7;
  --surface: #FFFFFF;
  --text-main: #172B4D;
  --text-secondary: #5E6C84;
  --text-muted: #8993A4;
  --border: #DFE1E6;
  
  /* Sombras e Bordas */
  --shadow-sm: 0 1px 2px rgba(9, 30, 66, 0.08);
  --shadow-md: 0 4px 8px -2px rgba(9, 30, 66, 0.25), 0 0 1px rgba(9, 30, 66, 0.31);
  --radius-bubble: 18px;
  --radius-card: 12px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: #091E42;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--text-main);
}

.app-container {
  width: 100%;
  max-width: 450px;
  height: 100dvh;
  background: var(--bg-app);
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

/* Header Refinado */
.header {
  background: var(--surface);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  z-index: 10;
}

.header-avatar {
  position: relative;
  width: 44px;
  height: 44px;
}

.header-avatar img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--primary-light);
}

.status-indicator {
  position: absolute;
  bottom: 2px;
  right: 2px;
  width: 10px;
  height: 10px;
  background: var(--success);
  border: 2px solid var(--surface);
  border-radius: 50%;
}

.header-info {
  flex: 1;
}

.header-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 4px;
}

.verified-icon {
  color: var(--primary);
  display: flex;
}

.header-status {
  font-size: 12px;
  color: var(--success);
  font-weight: 500;
}

/* Área de Mensagens */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

/* Estilo dos Balões de Mensagem */
.msg-group {
  display: flex;
  flex-direction: column;
  max-width: 85%;
  animation: slideUp 0.3s ease-out;
}

.msg-group.user {
  align-self: flex-end;
  align-items: flex-end;
}

.msg-group.agent {
  align-self: flex-start;
  align-items: flex-start;
}

.bubble {
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.5;
  position: relative;
  box-shadow: var(--shadow-sm);
}

.msg-group.agent .bubble {
  background: var(--surface);
  color: var(--text-main);
  border-radius: 4px 18px 18px 18px;
  border: 1px solid var(--border);
}

.msg-group.user .bubble {
  background: var(--primary);
  color: #FFFFFF;
  border-radius: 18px 18px 4px 18px;
}

.msg-meta {
  font-size: 11px;
  margin-top: 4px;
  color: var(--text-muted);
}

/* Mensagem de Sistema Profissional */
.system-msg {
  align-self: center;
  background: rgba(9, 30, 66, 0.04);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
  margin: 8px 0;
  text-align: center;
}

/* Cartão do Consultor (Premium) */
.consultant-card {
  background: var(--surface);
  border-radius: var(--radius-card);
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  margin: 10px 0;
  width: 100%;
  animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.card-header {
  background: var(--primary-light);
  padding: 10px 16px;
  font-size: 11px;
  font-weight: 700;
  color: var(--primary-dark);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: flex;
  justify-content: space-between;
}

.card-body {
  padding: 16px;
  display: flex;
  gap: 16px;
  align-items: center;
}

.card-img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  object-fit: cover;
}

.card-info h4 {
  font-size: 16px;
  margin-bottom: 2px;
}

.card-info p {
  font-size: 13px;
  color: var(--text-secondary);
}

.card-stats {
  display: flex;
  border-top: 1px solid var(--border);
  background: #FAFBFC;
}

.stat-item {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-right: 1px solid var(--border);
}

.stat-item:last-child { border-right: none; }

.stat-value {
  display: block;
  font-weight: 700;
  font-size: 14px;
  color: var(--primary);
}

.stat-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
}

/* Input de Mensagem Estilo iOS/WhatsApp Business */
.footer {
  background: var(--surface);
  padding: 12px 16px 24px;
  border-top: 1px solid var(--border);
}

.input-container {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: #F4F5F7;
  border-radius: 24px;
  padding: 8px 16px;
  border: 1px solid var(--border);
  transition: all 0.2s;
}

.input-container:focus-within {
  background: #FFF;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-light);
}

.chat-input {
  flex: 1;
  border: none;
  background: transparent;
  padding: 8px 0;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  max-height: 100px;
  overflow-y: auto;
  resize: none;
}

.send-button {
  background: var(--primary);
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  transition: transform 0.2s;
  flex-shrink: 0;
  margin-bottom: 2px;
}

.send-button:hover {
  background: var(--primary-dark);
  transform: scale(1.05);
}

.send-button:active {
  transform: scale(0.95);
}

/* Indicador de Digitação Humano */
.typing-indicator {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 12px 16px;
  background: var(--surface);
  border-radius: 4px 18px 18px 18px;
  width: fit-content;
  border: 1px solid var(--border);
  margin-bottom: 10px;
}

.dot {
  width: 6px;
  height: 6px;
  background: var(--text-muted);
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out;
}

.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-6px); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

/* Spinner Moderno */
.loader {
  width: 16px;
  height: 16px;
  border: 2px solid var(--primary-light);
  border-top: 2px solid var(--primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  display: inline-block;
  margin-right: 8px;
  vertical-align: middle;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Esconder barra de rolagem mas manter funcionalidade */
.chat-area::-webkit-scrollbar {
  width: 4px;
}
.chat-area::-webkit-scrollbar-track {
  background: transparent;
}
.chat-area::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 10px;
}
</style>
</head>
<body>

<div class="app-container">
  <header class="header">
    <div class="header-avatar">
      <img src="https://i.pravatar.cc/150?u=carlos-diskgas" alt="Carlos">
      <div class="status-indicator"></div>
    </div>
    <div class="header-info">
      <div class="header-name">
        Carlos Oliveira
        <span class="verified-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </span>
      </div>
      <div class="header-status">Online agora</div>
    </div>
  </header>

  <main class="chat-area" id="chatArea">
    <!-- Mensagens serão inseridas aqui -->
  </main>

  <div id="typingIndicator" class="typing-indicator" style="margin-left: 20px;">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <footer class="footer">
    <div class="input-container">
      <textarea class="chat-input" id="chatInput" placeholder="Digite sua mensagem..." rows="1"></textarea>
      <button class="send-button" id="sendBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </footer>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const typingIndicator = document.getElementById('typingIndicator');

let isFirstContact = true;
const agentName = "Carlos Oliveira";
const agentAvatar = "https://i.pravatar.cc/150?u=carlos-diskgas";

// Ajuste automático da altura do textarea
chatInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = (this.scrollHeight) + 'px';
});

function getTime() {
  return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function scrollToBottom() {
  setTimeout(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
  }, 50);
}

function addMessage(text, side) {
  const group = document.createElement('div');
  group.className = `msg-group ${side}`;
  
  group.innerHTML = `
    <div class="bubble">
      ${text}
    </div>
    <div class="msg-meta">${getTime()}</div>
  `;
  
  chatArea.appendChild(group);
  scrollToBottom();
}

function addSystemMessage(text, withLoader = false) {
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.innerHTML = `${withLoader ? '<span class="loader"></span>' : ''}${text}`;
  chatArea.appendChild(div);
  scrollToBottom();
  return div;
}

function showConsultantCard() {
  const card = document.createElement('div');
  card.className = 'consultant-card';
  card.innerHTML = `
    <div class="card-header">
      <span>Consultor Especialista</span>
      <span>ID: #8824</span>
    </div>
    <div class="card-body">
      <img src="${agentAvatar}" class="card-img" alt="Carlos">
      <div class="card-info">
        <h4>Carlos Oliveira</h4>
        <p>Especialista em Atendimento Diskgas</p>
      </div>
    </div>
    <div class="card-stats">
      <div class="stat-item">
        <span class="stat-value">4.9</span>
        <span class="stat-label">Avaliação</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">1.5k</span>
        <span class="stat-label">Atendimentos</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">5 min</span>
        <span class="stat-label">Tempo médio</span>
      </div>
    </div>
  `;
  chatArea.appendChild(card);
  scrollToBottom();
}

async function handleResponseFlow() {
  if (isFirstContact) {
    await new Promise(r => setTimeout(r, 1000));
    const searchingMsg = addSystemMessage("Localizando consultor disponível...", true);
    
    await new Promise(r => setTimeout(r, 2000));
    searchingMsg.innerHTML = "Conectado com Carlos Oliveira ✓";
    searchingMsg.style.color = "var(--success)";
    
    await new Promise(r => setTimeout(r, 800));
    showConsultantCard();
    
    isFirstContact = false;
  }

  // Simulação de "Pensando/Digitando"
  await new Promise(r => setTimeout(r, 1200));
  typingIndicator.style.display = 'flex';
  scrollToBottom();

  // Tempo de resposta variável para parecer humano
  const responseTime = 2000 + Math.random() * 2000;
  await new Promise(r => setTimeout(r, responseTime));
  
  typingIndicator.style.display = 'none';
  
  const agentMessages = chatArea.querySelectorAll('.msg-group.agent').length;
  
  const responses = [
    "Com certeza, posso te ajudar com isso. Só um instante enquanto consulto o sistema...",
    "Entendi perfeitamente. Você teria preferência por algum modelo específico ou quer que eu te apresente as opções mais vendidas?",
    "Excelente pergunta! Na Diskgas priorizamos a segurança, então todos os nossos produtos seguem rigorosamente as normas da ABNT.",
    "Estou verificando aqui as condições especiais para a sua região. Só um segundo...",
    "Claro! Além disso, temos uma promoção ativa para novos clientes hoje. Gostaria de conhecer?"
  ];

  if (agentMessages === 0) {
    addMessage("Olá! Sou o Carlos Oliveira. Vi que você tem interesse em nossos serviços. É um prazer te atender!", "agent");
    await new Promise(r => setTimeout(r, 1500));
    typingIndicator.style.display = 'flex';
    scrollToBottom();
    await new Promise(r => setTimeout(r, 2000));
    typingIndicator.style.display = 'none';
    addMessage("Como posso te ajudar especificamente hoje? Algum produto ou dúvida técnica?", "agent");
  } else {
    // Seleciona uma resposta aleatória para parecer menos robótico
    const randomResponse = responses[Math.floor(Math.random() * responses.length)];
    addMessage(randomResponse, "agent");
  }
}

function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  
  chatInput.value = '';
  chatInput.style.height = 'auto';
  
  addMessage(text, 'user');
  handleResponseFlow();
}

sendBtn.onclick = sendMessage;
chatInput.onkeypress = (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
};

// Início automático
window.onload = async () => {
  addSystemMessage("Criptografia de ponta a ponta ativa");
  await new Promise(r => setTimeout(r, 1200));
  
  const initialMsg = "Olá! Gostaria de saber mais sobre os serviços da Diskgas.";
  addMessage(initialMsg, 'user');
  handleResponseFlow();
};
</script>

</body>
</html>
