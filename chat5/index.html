<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Diskgas — Atendimento</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --brand:      #0F5BA8;
  --brand-dk:   #0A3F7A;
  --brand-lt:   #E8F2FF;
  --brand-mid:  #1B7FD8;
  --brand-glow: rgba(27,127,216,.14);

  --bg:         #EDF0F5;
  --surface:    #FFFFFF;
  --surface-2:  #F5F7FA;

  --text:       #0F1419;
  --text-2:     #4A5568;
  --text-3:     #8A92A2;

  --border:     #D5DDE5;
  --border-2:   #E5EAEF;

  --bubble-a:   #FFFFFF;
  --bubble-u-from: #0F5BA8;
  --bubble-u-to:   #1B7FD8;

  --green:      #10B981;
  --green-dk:   #059669;
  --green-lt:   #F0FDF4;

  --orange:     #F59E0B;

  --read-clr:   #60D4F7;

  --radius:     16px;
  --radius-lg:  22px;
  --radius-xs:  5px;

  --ease:  cubic-bezier(.25,.46,.45,.94);
  --spring:cubic-bezier(.34,1.56,.64,1);
}

html,body{
  height:100%;width:100%;
  font-family:'DM Sans',sans-serif;
  background:#0d1117;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
}

.app{
  width:100%;max-width:430px;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg);
  position:relative;overflow:hidden;
}

/* ── HEADER ── */
.header{
  background:linear-gradient(160deg,var(--brand-dk) 0%,var(--brand-mid) 100%);
  padding:13px 14px;
  display:flex;align-items:center;gap:10px;
  position:relative;z-index:10;
  flex-shrink:0;
  box-shadow:0 2px 10px rgba(10,63,122,.3);
}
.header::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,transparent 55%);
}

.icon-btn{
  width:36px;height:36px;border-radius:10px;
  background:rgba(255,255,255,.13);border:none;cursor:pointer;
  color:rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background .18s ease,transform .15s ease;
  position:relative;z-index:1;
}
.icon-btn:hover{background:rgba(255,255,255,.22);}
.icon-btn:active{transform:scale(.9);}

.h-agent{display:flex;align-items:center;gap:10px;flex:1;min-width:0;position:relative;z-index:1;}

.h-avatar{position:relative;flex-shrink:0;}
.h-avatar-img{
  width:40px;height:40px;border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.5);
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.h-dot{
  position:absolute;bottom:0;right:0;
  width:11px;height:11px;border-radius:50%;
  background:var(--green);
  border:2px solid var(--brand-dk);
}

.h-info{flex:1;min-width:0;}
.h-name{font-size:14.5px;font-weight:700;color:#fff;letter-spacing:.2px;}
.h-sub{
  font-size:11.5px;color:rgba(255,255,255,.75);
  margin-top:1px;font-weight:400;
  transition:all .25s ease;
  display:flex;align-items:center;gap:5px;
}
.h-sub.typing-state{color:rgba(255,255,255,.95);}
.typing-dots-mini{display:none;gap:2px;align-items:center;}
.typing-dots-mini.show{display:flex;}
.tdm{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85);animation:tdmpulse 1.2s ease infinite;}
.tdm:nth-child(2){animation-delay:.15s;}
.tdm:nth-child(3){animation-delay:.3s;}
@keyframes tdmpulse{0%,60%,100%{opacity:.3;transform:scale(.8);}30%{opacity:1;transform:scale(1.2);}}

/* ── TRUST BAR ── */
.trust-bar{
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--border-2);
  padding:6px 16px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  flex-shrink:0;
}
.t-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-2);font-weight:500;}
.t-item svg{flex-shrink:0;}
.t-sep{color:var(--border);font-size:12px;line-height:1;}

/* ── MESSAGES ── */
.msgs{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 14px 6px;
  display:flex;flex-direction:column;gap:3px;
  position:relative;
}
.msgs::-webkit-scrollbar{width:4px;}
.msgs::-webkit-scrollbar-track{background:transparent;}
.msgs::-webkit-scrollbar-thumb{background:rgba(15,91,168,.12);border-radius:2px;}

/* ── SYSTEM MESSAGES ── */
.sys{
  text-align:center;margin:12px 0;
  animation:fadeUp .4s var(--ease);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.sys span{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11px;color:var(--text-2);
  background:rgba(255,255,255,0.85);
  border:1px solid var(--border-2);
  border-radius:14px;
  padding:5px 14px;
  font-weight:500;
  letter-spacing: 0.1px;
  transition: all 0.3s ease;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}

.sys span.secure {
  color: var(--brand-dk);
  background: #fff;
  border-color: var(--brand-mid);
  box-shadow: 0 2px 6px var(--brand-glow);
  font-weight: 600;
}
.sys span.secure svg { color: var(--brand-mid); opacity: 1; }

.sys span.ok{
  color:var(--green-dk);
  background:var(--green-lt);
  border-color:rgba(16,185,129,.25);
}
.sys span.ok svg { color: var(--green); opacity: 1; }

.sys span.brand{
  color:var(--brand);
  background:var(--brand-lt);
  border-color:rgba(15,91,168,.15);
}

.spinner-wrap{display:flex;justify-content:center;margin:8px 0;animation:fadeUp .3s ease;}
.spinner{
  width:16px;height:16px;
  border:2px solid rgba(15,91,168,.1);
  border-top-color:var(--brand);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes cardIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

/* ── MESSAGE ROWS ── */
.row{
  display:flex;gap:8px;align-items:flex-end;
  max-width:88%;animation:msgIn .28s var(--ease);
}
.row.user{align-self:flex-end;flex-direction:row-reverse;max-width:80%;}
.row.agent{align-self:flex-start;}
/* Grouped = same sender, consecutive */
.row.grouped{margin-top:2px;}
.row:not(.grouped){margin-top:10px;}

.m-avatar{
  width:30px;height:30px;border-radius:50%;
  object-fit:cover;flex-shrink:0;
  border:1.5px solid rgba(15,91,168,.1);
}
.m-avatar.ghost{visibility:hidden;}

.bubble{
  padding:10px 13px 8px;
  border-radius:var(--radius);
  font-size:14px;line-height:1.7;
  word-wrap:break-word;overflow-wrap:break-word;
  position:relative;max-width:100%;
}
.bubble.a{
  background:var(--bubble-a);color:var(--text);
  border-radius:var(--radius-xs) var(--radius) var(--radius) var(--radius);
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.03);
}
.row.grouped.agent .bubble.a{border-radius:var(--radius-xs) var(--radius) var(--radius) var(--radius);}
.bubble.u{
  background:linear-gradient(150deg,var(--bubble-u-from) 0%,var(--bubble-u-to) 100%);
  color:#fff;
  border-radius:var(--radius) var(--radius-xs) var(--radius) var(--radius);
  box-shadow:0 3px 10px rgba(15,91,168,.22);
}
.row.grouped.user .bubble.u{border-radius:var(--radius) var(--radius-xs) var(--radius) var(--radius);}

.b-meta{
  display:flex;align-items:center;justify-content:flex-end;
  gap:4px;margin-top:4px;float:right;margin-left:8px;
}
.b-time{font-size:10.5px;color:rgba(255,255,255,.55);}
.bubble.a .b-time{color:rgba(15,20,25,.3);}
.b-read{font-size:10.5px;transition:color .4s ease;}
.b-read.sending{color:rgba(255,255,255,.4);}
.b-read.sent{color:rgba(255,255,255,.6);}
.b-read.read{color:var(--read-clr);}
.b-meta.hide{display:none;}

/* ── AGENT INTRO CARD ── */
.intro-card{
  background:var(--surface);
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin:10px 0 6px;
  border:1px solid var(--border-2);
  box-shadow:0 3px 12px rgba(15,91,168,.1);
  animation:cardIn .5s var(--spring);
  flex-shrink:0;
  align-self:flex-start;
  width:100%;
}
.ic-top{
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-mid) 100%);
  padding:9px 14px;
  display:flex;justify-content:space-between;align-items:center;
}
.ic-top-label{color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;}
.ic-badge{
  background:rgba(255,255,255,.22);color:#fff;
  font-size:8.5px;font-weight:700;padding:3px 8px;
  border-radius:20px;text-transform:uppercase;letter-spacing:.4px;
  display:flex;align-items:center;gap:3px;
}
.ic-body{display:flex;gap:12px;align-items:center;padding:12px 14px 14px;}
.ic-avatar-wrap{position:relative;}
.ic-avatar{
  width:46px;height:46px;border-radius:50%;object-fit:cover;
  border:2.5px solid #fff;
  box-shadow:0 2px 8px rgba(15,91,168,.12);
}
.ic-online{
  position:absolute;bottom:1px;right:1px;
  width:11px;height:11px;border-radius:50%;
  background:var(--green);border:2px solid #fff;
}
.ic-info{flex:1;min-width:0;}
.ic-name{font-size:14.5px;font-weight:700;color:var(--text);}
.ic-role{font-size:11.5px;color:var(--text-2);margin:2px 0 4px;font-weight:500;}
.ic-status{font-size:11px;color:var(--green-dk);font-weight:600;display:flex;align-items:center;gap:4px;}
.ic-status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.ic-stars{display:flex;align-items:center;gap:5px;margin-top:5px;}
.ic-star{color:var(--orange);font-size:11px;}
.ic-rating{font-size:11px;color:var(--text-2);font-weight:500;}

/* ── TYPING ── */
.typing-row{
  display:none;align-items:flex-end;gap:8px;
  align-self:flex-start;
  padding:0 14px 4px;
  animation:fadeUp .25s ease;
  flex-shrink:0;
}
.typing-bubble{
  background:var(--bubble-a);
  border-radius:var(--radius-xs) var(--radius) var(--radius) var(--radius);
  padding:11px 15px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
  display:flex;gap:5px;align-items:center;
}
.td{
  width:6px;height:6px;border-radius:50%;
  background:rgba(15,20,25,.2);
  animation:tdpulse 1.3s ease-in-out infinite;
}
.td:nth-child(2){animation-delay:.17s;}
.td:nth-child(3){animation-delay:.34s;}
@keyframes tdpulse{
  0%,65%,100%{transform:translateY(0);opacity:.25;}
  30%{transform:translateY(-5px);opacity:1;background:var(--brand);}
}

/* ── SCROLL FAB ── */
.scroll-fab{
  position:absolute;
  bottom:78px;right:14px;
  width:40px;height:40px;border-radius:50%;
  background:var(--brand);color:#fff;border:none;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(15,91,168,.28);
  z-index:20;
  transition:all .22s var(--spring);
}
.scroll-fab.on{display:flex;}
.scroll-fab:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,91,168,.32);}
.scroll-fab:active{transform:scale(.9);}
.fab-badge{
  position:absolute;top:-5px;right:-5px;
  background:#EF4444;color:#fff;
  font-size:9px;font-weight:700;
  min-width:17px;height:17px;
  border-radius:10px;
  display:none;align-items:center;justify-content:center;
  border:2px solid var(--bg);
  padding:0 3px;
}
.fab-badge.on{display:flex;}

/* ── FOOTER ── */
.footer{
  background:var(--surface);
  border-top:1px solid var(--border-2);
  padding:10px 12px;
  padding-bottom:max(12px,env(safe-area-inset-bottom));
  flex-shrink:0;
  box-shadow:0 -2px 8px rgba(0,0,0,.03);
}
.input-row{display:flex;gap:9px;align-items:flex-end;}
.input-wrap{
  flex:1;display:flex;align-items:flex-end;
  background:var(--surface-2);
  border-radius:24px;
  padding:10px 14px;
  border:1.5px solid var(--border);
  transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;
  min-height:44px;
}
.input-wrap:focus-within{
  border-color:var(--brand-mid);
  box-shadow:0 0 0 3px var(--brand-glow);
  background:var(--surface);
}
.msg-input{
  flex:1;border:none;outline:none;
  font-size:14.5px;font-family:'DM Sans',sans-serif;
  background:transparent;color:var(--text);
  resize:none;
  min-height:22px;max-height:88px;
  line-height:1.5;overflow-y:auto;
  scrollbar-width:none;
}
.msg-input::-webkit-scrollbar{display:none;}
.msg-input::placeholder{color:var(--text-3);}

.send-btn{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-mid) 100%);
  color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:all .2s var(--spring);
  box-shadow:0 3px 10px rgba(15,91,168,.22);
  flex-shrink:0;
}
.send-btn:disabled{
  background:var(--border);
  box-shadow:none;
  cursor:not-allowed;
  transform:none !important;
}
.send-btn:not(:disabled):hover{
  box-shadow:0 5px 16px rgba(15,91,168,.32);
  transform:translateY(-1px) scale(1.05);
}
.send-btn:not(:disabled):active{transform:scale(.88);}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <button class="icon-btn" aria-label="Voltar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <div class="h-agent">
      <div class="h-avatar">
        <img src="https://i.pravatar.cc/100?u=diskgas-carlos" class="h-avatar-img" alt="Carlos Oliveira">
        <div class="h-dot"></div>
      </div>
      <div class="h-info">
        <div class="h-name">Carlos Oliveira</div>
        <div class="h-sub" id="headerStatus">
          <span id="statusText">Online · Diskgas</span>
          <span class="typing-dots-mini" id="typingDotsMini">
            <span class="tdm"></span><span class="tdm"></span><span class="tdm"></span>
          </span>
        </div>
      </div>
    </div>
    <button class="icon-btn" aria-label="Mais opções">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </button>
  </header>

  <!-- TRUST BAR -->
  <div class="trust-bar">
    <div class="t-item">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="#F59E0B"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>4,9</span>
    </div>
    <span class="t-sep">·</span>
    <div class="t-item">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>2.847 atendidos</span>
    </div>
    <span class="t-sep">·</span>
    <div class="t-item">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>≤ 45 min entrega</span>
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="msgs" id="msgs"></div>

  <!-- TYPING ROW -->
  <div class="typing-row" id="typingRow">
    <img src="https://i.pravatar.cc/100?u=diskgas-carlos" class="m-avatar" alt="Carlos">
    <div class="typing-bubble">
      <div class="td"></div><div class="td"></div><div class="td"></div>
    </div>
  </div>

  <!-- SCROLL FAB -->
  <button class="scroll-fab" id="scrollFab" aria-label="Ir para mensagens novas">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    <span class="fab-badge" id="fabBadge">0</span>
  </button>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="input-row">
      <div class="input-wrap">
        <textarea class="msg-input" id="msgInput" placeholder="Escreva sua mensagem..." rows="1"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" disabled aria-label="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </footer>
</div>

<script>
const msgsEl   = document.getElementById('msgs');
const inputEl  = document.getElementById('msgInput');
const sendBtnEl= document.getElementById('sendBtn');
const typingEl = document.getElementById('typingRow');
const fabEl    = document.getElementById('scrollFab');
const fabBadge = document.getElementById('fabBadge');
const statusTextEl    = document.getElementById('statusText');
const typingDotsMini  = document.getElementById('typingDotsMini');
const headerStatusEl  = document.getElementById('headerStatus');

const AVATAR = "https://i.pravatar.cc/100?u=diskgas-carlos";
const ts = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

let history = [];
let lastSender = null;
let atBottom = true;
let unread = 0;
let busy = false;

/* ── CARLOS SYSTEM PROMPT ── */
const SYSTEM = `Você é Carlos Oliveira, consultor especializado da Diskgas, empresa brasileira de entrega rápida de gás. Responda SEMPRE com JSON válido puro (sem markdown):
{"message":"sua resposta"}

Produtos:
- Botijão P13 (gás de cozinha): R$120,00
- Botijão P45 (uso comercial): R$280,00
- Botijão P90 (industrial): R$520,00
- 1ª entrega GRÁTIS para novos clientes
- Entrega em até 45 minutos
- Pagamento: PIX (5% desconto), cartão (3x sem juros), dinheiro na entrega
- Atende todo o Brasil

Regras: máximo 2-3 frases, tom amigável e profissional, emojis com moderação.
Responda SOMENTE com o JSON, sem nenhum texto extra.`;

/* ── SCROLL TRACKING ── */
msgsEl.addEventListener('scroll', () => {
  atBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 80;
  if (atBottom) {
    unread = 0;
    fabEl.classList.remove('on');
    fabBadge.classList.remove('on');
  } else {
    fabEl.classList.add('on');
  }
});
fabEl.addEventListener('click', () => {
  scrollDown(true);
  unread = 0;
  fabEl.classList.remove('on');
  fabBadge.classList.remove('on');
});

function scrollDown(force = false) {
  if (atBottom || force) {
    setTimeout(() => msgsEl.scrollTo({top:msgsEl.scrollHeight,behavior:'smooth'}), 50);
  } else {
    unread++;
    fabBadge.textContent = unread;
    fabBadge.classList.add('on');
    fabEl.classList.add('on');
  }
}

/* ── TEXTAREA AUTO-RESIZE ── */
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 88) + 'px';
  sendBtnEl.disabled = !inputEl.value.trim();
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});
sendBtnEl.addEventListener('click', doSend);

/* ── ADD MESSAGE ── */
function addMsg(text, type) {
  const isGrouped = lastSender === type;
  const row = document.createElement('div');
  row.className = `row ${type}${isGrouped ? ' grouped' : ''}`;

  const safeText = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');

  const avatarHtml = type === 'agent'
    ? `<img src="${AVATAR}" class="m-avatar${isGrouped?' ghost':''}" alt="Carlos">`
    : '';

  const readHtml = type === 'user' ? `<span class="b-read sending">✓</span>` : '';

  row.innerHTML = `
    ${avatarHtml}
    <div class="bubble ${type === 'user' ? 'u' : 'a'}">
      ${safeText}
      <div class="b-meta">
        <span class="b-time">${ts()}</span>
        ${readHtml}
      </div>
    </div>`;

  msgsEl.appendChild(row);
  lastSender = type;

  let onReadPromise = Promise.resolve();

  if (type === 'user') {
    const readEl = row.querySelector('.b-read');
    onReadPromise = new Promise(resolve => {
      setTimeout(() => { 
        readEl.textContent = '✓✓'; 
        readEl.className = 'b-read sent'; 
        setTimeout(() => { 
          readEl.className = 'b-read read';
          resolve(); 
        }, 1300);
      }, 700);
    });
  }

  scrollDown();
  return { row, onReadPromise };
}

/* ── SYSTEM MESSAGE ── */
function addSys(html, variant = '') {
  const d = document.createElement('div');
  d.className = 'sys';
  const s = document.createElement('span');
  s.className = variant;
  
  let icon = '';
  if (variant === 'ok') icon = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  else if (variant === 'secure') icon = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';
  
  s.innerHTML = `${icon} ${html}`;
  d.appendChild(s);
  msgsEl.appendChild(d);
  scrollDown();
  return s;
}

function addSpinner() {
  const d = document.createElement('div');
  d.className = 'spinner-wrap';
  d.innerHTML = '<div class="spinner"></div>';
  msgsEl.appendChild(d);
  scrollDown();
  return d;
}

/* ── TYPING STATE ── */
function setTyping(on) {
  typingEl.style.display = on ? 'flex' : 'none';
  if (on) {
    statusTextEl.textContent = 'Digitando';
    headerStatusEl.classList.add('typing-state');
    typingDotsMini.classList.add('show');
  } else {
    statusTextEl.textContent = 'Online · Diskgas';
    headerStatusEl.classList.remove('typing-state');
    typingDotsMini.classList.remove('show');
  }
  if (on) scrollDown();
}

/* ── CARLOS API (MODO SIMULAÇÃO/FALLBACK) ── */
async function askCarlos(userMsg, isGreetingOnly = false) {
  history.push({ role: 'user', content: userMsg });
  
  if (isGreetingOnly) {
      const hour = new Date().getHours();
      let greeting = "";
      if (hour >= 5 && hour < 12) greeting = "Bom dia!";
      else if (hour >= 12 && hour < 18) greeting = "Boa tarde!";
      else greeting = "Boa noite!";
      
      history.push({ role:'assistant', content: JSON.stringify({message: greeting}) });
      return { message: greeting };
  }

  const simulation = () => {
    const responses = [
      "Claro! O botijão P13 está saindo por R$120,00 com entrega grátis por ser sua primeira compra. Posso agendar?",
      "Temos o P13 (residencial) por R$120 e o P45 por R$280. Qual você prefere?",
      "Entregamos em até 45 minutos em qualquer região. Como deseja pagar?",
      "Aceitamos PIX com 5% de desconto, cartão em até 3x ou dinheiro na entrega. O que fica melhor?"
    ];
    return responses[Math.floor(Math.random() * responses.length)];
  };

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
          'Content-Type':'application/json',
          'x-api-key': 'SUA_CHAVE_AQUI',
          'anthropic-version': '2023-06-01'
      },
      body:JSON.stringify({
        model:'claude-3-sonnet-20240229',
        max_tokens:1000,
        system:SYSTEM,
        messages:history
      })
    });

    if (!res.ok) throw new Error('API_FAIL');

    const data = await res.json();
    const raw = (data.content||[]).map(b=>b.text||'').join('');
    let parsed;
    try { parsed = JSON.parse(raw.replace(/```json|```/g,'').trim()); }
    catch { parsed = {message:raw}; }
    
    let finalMsg = parsed.message || raw;
    history.push({ role:'assistant', content: JSON.stringify({message: finalMsg}) });
    return { message: finalMsg };

  } catch (err) {
    let finalMsg = simulation();
    history.push({ role:'assistant', content: JSON.stringify({message: finalMsg}) });
    return { message: finalMsg };
  }
}

/* ── SEND ── */
async function doSend() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtnEl.disabled = true;
  
  const { onReadPromise } = addMsg(text, 'user');
  await onReadPromise;
  
  await agentReply(text);
  busy = false;
  sendBtnEl.disabled = !inputEl.value.trim();
}

async function agentReply(userText, isFirst = false) {
  const delay = isFirst ? 1000 : 1500 + Math.random() * 1500;
  setTyping(true);
  
  const [reply] = await Promise.all([
    askCarlos(userText, isFirst), // Passa isFirst para a função askCarlos
    new Promise(r => setTimeout(r, delay))
  ]);
  setTyping(false);
  addMsg(reply.message, 'agent');
}

  await new Promise(r => setTimeout(r, 600));

  busy = true;

  busy = false;
})();
