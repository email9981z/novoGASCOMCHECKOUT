<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diskgas — Atendimento Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* Premium Palette - Focused on Trust & Conversion */
  --brand:      #0F5BA8;
  --brand-dk:   #0A3F7A;
  --brand-lt:   #F0F7FF;
  --brand-mid:  #1B7FD8;
  --brand-accent: #3B82F6;

  --bg:         #F8FAFC;
  --surface:    #FFFFFF;
  --surface-2:  #F1F5F9;
  
  --text:       #0F172A;
  --text-2:     #475569;
  --text-3:     #94A3B8;
  
  --border:     #E2E8F0;
  --border-2:   #F1F5F9;

  --bubble-a:   #FFFFFF;
  --bubble-u:   #0F5BA8; /* High contrast for user messages */
  --bubble-u-txt: #FFFFFF;

  --green:      #10B981;
  --green-dk:   #059669;
  --green-lt:   #ECFDF5;

  --radius-sm:  12px;
  --radius:     18px;
  --radius-lg:  24px;

  --sh-sm: 0 2px 4px rgba(15,23,42,.04);
  --sh-md: 0 4px 12px rgba(15,23,42,.08);
  --sh-lg: 0 12px 24px rgba(15,23,42,.12);

  --ease:   cubic-bezier(.2,.8,.2,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}

html,body{
  height:100%;width:100%;
  font-family:'Plus Jakarta Sans', sans-serif;
  background:#020617;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
}

.app{
  width:100%;max-width:430px;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg);
  position:relative;overflow:hidden;
}

/* Texture for premium feel */
.app::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image: radial-gradient(rgba(15,91,168,.03) 1px, transparent 1px);
  background-size: 20px 20px;
}

/* ─── Header ─── */
.header{
  background: var(--surface);
  padding:16px 20px;
  display:flex;align-items:center;gap:14px;
  position:relative;z-index:10;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 4px 12px rgba(0,0,0,.03);
}

.h-agent{display:flex;align-items:center;gap:14px;flex:1;min-width:0;}

.h-avatar{position:relative;}
.h-avatar-img{
  width:46px;height:46px;border-radius:50%;
  object-fit:cover;
  border:2px solid var(--surface);
  box-shadow: 0 0 0 2px var(--brand-lt), 0 4px 8px rgba(0,0,0,.1);
}
.h-status-dot{
  position:absolute;bottom:2px;right:2px;
  width:12px;height:12px;border-radius:50%;
  background:var(--green);
  border:2px solid var(--surface);
  box-shadow: 0 0 0 1px rgba(0,0,0,.05);
}

.h-info{flex:1;min-width:0;}
.h-name{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-0.2px;}
.h-sub{
  font-size:12.5px;color:var(--green-dk);
  font-weight:600;display:flex;align-items:center;gap:4px;
}
.h-sub::before{
  content:''; width:6px; height:6px; background:var(--green); border-radius:50%;
  display:inline-block; animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: scale(0.95); opacity: 1; }
  50% { transform: scale(1.2); opacity: 0.7; }
  100% { transform: scale(0.95); opacity: 1; }
}

/* ─── Messages ─── */
.msgs{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:20px 16px;
  display:flex;flex-direction:column;gap:16px;
  position:relative;z-index:1;
  scroll-behavior:smooth;
}

/* Better system messages */
.sys-msg{text-align:center;margin:12px 0;animation:fadeIn .5s var(--ease);}
.sys-msg span{
  font-size:11px;color:var(--text-3);
  background:var(--surface-2);
  border-radius:20px;
  padding:6px 14px;
  font-weight:600;text-transform:uppercase;letter-spacing:0.5px;
}

.msg-row{
  display:flex;gap:12px;align-items:flex-end;
  max-width:85%;margin-bottom:2px;
  animation:msgIn .4s var(--ease) forwards;
  opacity: 0;
}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;max-width:80%;}
.msg-row.agent{align-self:flex-start;}

@keyframes msgIn{
  from{opacity:0;transform:translateY(12px) scale(.98);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

.bubble{
  padding:12px 16px;
  border-radius:var(--radius);
  font-size:15px;line-height:1.55;
  position:relative;
  box-shadow: var(--sh-sm);
  transition: transform 0.2s ease;
}
.bubble.a{
  background:var(--bubble-a);
  color:var(--text);
  border-bottom-left-radius:4px;
  border: 1px solid var(--border);
}
.bubble.u{
  background:var(--bubble-u);
  color:var(--bubble-u-txt);
  border-bottom-right-radius:4px;
  font-weight: 500;
}

.b-meta{
  display:flex;align-items:center;justify-content:flex-end;
  gap:4px;margin-top:4px;
  font-size:10px; opacity: 0.7;
}
.bubble.u .b-meta{color: rgba(255,255,255,0.8);}
.bubble.a .b-meta{color: var(--text-3);}

/* ─── Agent Intro Card - Conversion Focused ─── */
.agent-intro{
  background:var(--surface);
  border-radius:var(--radius-lg);
  margin:10px 0;
  box-shadow: var(--sh-md);
  border:1px solid var(--border);
  width:100%;
  animation:cardSlideIn .6s var(--spring);
  overflow: hidden;
}

.ai-header{
  background: var(--brand-lt);
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(15,91,168,.05);
}
.ai-header-title{
  color: var(--brand);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.ai-badge-verified{
  background: var(--brand);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.ai-body{
  display:flex;gap:16px;align-items:center;
  padding:18px 20px;
}
.ai-img{
  width:56px;height:56px;border-radius:50%;
  object-fit:cover;
  border:3px solid var(--surface);
  box-shadow: 0 4px 12px rgba(15,91,168,.15);
}
.ai-info{flex:1;}
.ai-name{font-size:17px;font-weight:800;color:var(--text);margin-bottom:2px;}
.ai-role{font-size:12px;color:var(--text-2);font-weight:500;margin-bottom:6px;}

.ai-trust-indicators{
  display: flex;
  gap: 12px;
  margin-top: 4px;
}
.ai-trust-item{
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-3);
  font-weight: 600;
}
.ai-trust-item svg{color: var(--green);}

@keyframes cardSlideIn{
  from{opacity:0;transform:translateY(30px) scale(0.95);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

/* ─── Typing ─── */
.typing-row{
  display:none;align-items:center;gap:12px;
  align-self:flex-start;animation:fadeIn .3s ease;
  margin-bottom: 10px;
}
.typing-avatar{
  width:32px;height:32px;border-radius:50%;
  object-fit:cover; border: 2px solid #fff; box-shadow: var(--sh-sm);
}
.typing-bubble{
  background:var(--surface);
  border-radius:var(--radius);
  border-bottom-left-radius:4px;
  padding:14px 20px;
  box-shadow: var(--sh-sm);
  display:flex;gap:5px;
  border: 1px solid var(--border);
}
.typing-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--brand);
  animation:typePulse 1.2s ease-in-out infinite;
  opacity: 0.4;
}
.typing-dot:nth-child(2){animation-delay:.2s;}
.typing-dot:nth-child(3){animation-delay:.4s;}
@keyframes typePulse{
  0%,100%{transform:scale(1);opacity:.4;}
  50%{transform:scale(1.3);opacity:1;}
}

/* ─── Footer ─── */
.footer{
  background:var(--surface);
  border-top:1px solid var(--border);
  padding:16px 20px 24px;
}
.input-row{display:flex;gap:12px;align-items:center;}
.input-wrap{
  flex:1;display:flex;align-items:center;
  background:var(--surface-2);
  border-radius:28px;
  padding:4px 6px 4px 18px;
  border:2px solid transparent;
  transition: all 0.3s var(--ease);
}
.input-wrap:focus-within{
  background: var(--surface);
  border-color: var(--brand-lt);
  box-shadow: 0 0 0 4px rgba(15,91,168,.06);
}
.msg-input{
  flex:1;border:none;outline:none;
  font-size:15px;height:44px;
  background:transparent;
  color: var(--text);
  font-weight:500;
}
.send-btn{
  width:40px;height:40px;border-radius:50%;
  background: var(--brand);
  color:#fff; border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition: all 0.3s var(--spring);
  box-shadow: 0 4px 10px rgba(15,91,168,.2);
}
.send-btn:hover{
  transform: scale(1.05) rotate(-5deg);
  background: var(--brand-mid);
}
.send-btn:active{transform: scale(0.9);}

/* Trust Footer */
.trust-footer{
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  font-size: 10px;
  color: var(--text-3);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Custom Scrollbar */
.msgs::-webkit-scrollbar{width:4px;}
.msgs::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.05);border-radius:10px;}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="h-agent">
      <div class="h-avatar">
        <img src="https://i.pravatar.cc/100?u=carlos" class="h-avatar-img" alt="Carlos">
        <div class="h-status-dot"></div>
      </div>
      <div class="h-info">
        <div class="h-name">Carlos Oliveira</div>
        <div class="h-sub">Responde rápido</div>
      </div>
    </div>
    <div style="opacity: 0.4;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </div>
  </header>

  <div class="msgs" id="msgs">
    <!-- Messages will appear here -->
  </div>

  <div class="typing-row" id="typingRow" style="padding: 0 16px 12px;">
    <img src="https://i.pravatar.cc/100?u=carlos" class="typing-avatar" alt="Avatar">
    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="input-row">
      <div class="input-wrap">
        <input type="text" class="msg-input" id="msgInput" placeholder="Como posso te ajudar?">
        <button class="send-btn" id="sendBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
    <div class="trust-footer">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Conversa criptografada e segura
    </div>
  </footer>
</div>

<script>
const msgsEl = document.getElementById('msgs');
const inputEl = document.getElementById('msgInput');
const sendBtnEl = document.getElementById('sendBtn');
const typingRowEl = document.getElementById('typingRow');

const agentAvatar = "https://i.pravatar.cc/100?u=carlos";
const now = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

let isFirstContact = true;

function scrollToBottom() {
  setTimeout(() => {
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }, 100);
}

function addMsg(text, type) {
  const row = document.createElement('div');
  row.className = `msg-row ${type}`;
  
  const readIndicator = type === 'user' ? `<span style="color:#fff;margin-left:4px;">✓✓</span>` : '';
  
  row.innerHTML = `
    <div class="bubble ${type === 'user' ? 'u' : 'a'}">
      ${text}
      <div class="b-meta">
        <span>${now()}</span>
        ${readIndicator}
      </div>
    </div>
  `;
  msgsEl.appendChild(row);
  scrollToBottom();
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'sys-msg';
  div.innerHTML = `<span>${text}</span>`;
  msgsEl.appendChild(div);
  scrollToBottom();
  return div;
}

function showAgentIntro() {
  const card = document.createElement('div');
  card.className = 'agent-intro';
  card.innerHTML = `
    <div class="ai-header">
      <div class="ai-header-title">Especialista Online</div>
      <div class="ai-badge-verified">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        VERIFICADO
      </div>
    </div>
    <div class="ai-body">
      <img src="${agentAvatar}" class="ai-img" alt="Carlos">
      <div class="ai-info">
        <div class="ai-name">Carlos Oliveira</div>
        <div class="ai-role">Consultor de Vendas Diskgas</div>
        <div class="ai-trust-indicators">
          <div class="ai-trust-item">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            4.9/5
          </div>
          <div class="ai-trust-item">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
            Ativo agora
          </div>
        </div>
      </div>
    </div>
  `;
  msgsEl.appendChild(card);
  scrollToBottom();
}

async function handleResponseFlow() {
  if (isFirstContact) {
    await new Promise(r => setTimeout(r, 1000));
    addSystemMsg("Conectando ao consultor...");
    
    await new Promise(r => setTimeout(r, 1500));
    showAgentIntro();
    isFirstContact = false;
  }

  await new Promise(r => setTimeout(r, 1200));
  typingRowEl.style.display = 'flex';
  scrollToBottom();

  await new Promise(r => setTimeout(r, 2500));
  typingRowEl.style.display = 'none';
  
  const responses = [
    "Olá! Sou o Carlos. Como posso ajudar você com nossos produtos hoje? 😊",
    "Entendi perfeitamente. Deixa eu verificar as melhores condições para você.",
    "Com certeza! Temos excelentes opções disponíveis. Qual sua preferência?",
    "Excelente escolha! Esse é um dos nossos itens mais procurados. Gostaria de ver os detalhes?",
    "Estou aqui para facilitar sua compra. O que mais você precisa saber?"
  ];
  
  const msgCount = msgsEl.querySelectorAll('.msg-row.agent').length;
  const text = msgCount === 0 ? responses[0] : responses[Math.floor(Math.random() * (responses.length - 1)) + 1];
  
  addMsg(text, 'agent');
}

function sendMessage() {
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = '';
  addMsg(text, 'user');
  handleResponseFlow();
}

inputEl.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
sendBtnEl.onclick = sendMessage;

window.onload = async () => {
  await new Promise(r => setTimeout(r, 800));
  addMsg("Olá! Gostaria de saber mais sobre os produtos.", 'user');
  handleResponseFlow();
};
</script>
</body>
</html>
