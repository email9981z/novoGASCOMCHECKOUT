<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Diskgas — Atendimento</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --brand:      #0F5BA8;
  --brand-dk:   #0A3F7A;
  --brand-lt:   #E8F2FF;
  --brand-mid:  #1B7FD8;
  --brand-glow: rgba(27,127,216,.14);

  --bg:         #EDF0F5;
  --surface:    #FFFFFF;
  --surface-2:  #F5F7FA;

  --text:       #0F1419;
  --text-2:     #4A5568;
  --text-3:     #8A92A2;

  --border:     #D5DDE5;
  --border-2:   #E5EAEF;

  --bubble-a:   #FFFFFF;
  --bubble-u-from: #0F5BA8;
  --bubble-u-to:   #1B7FD8;

  --green:      #10B981;
  --green-dk:   #059669;
  --green-lt:   #F0FDF4;
  --green-border: rgba(16,185,129,.25);

  --orange:     #F59E0B;
  --orange-lt:  #FFFBEB;

  --read-clr:   #60D4F7;

  --radius:     16px;
  --radius-lg:  22px;
  --radius-xs:  5px;

  --ease:  cubic-bezier(.25,.46,.45,.94);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@keyframes pulse-brand {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(15, 91, 168, 0.4); }
  70% { transform: scale(1.02); box-shadow: 0 0 0 6px rgba(15, 91, 168, 0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(15, 91, 168, 0); }
}

html,body{
  height:100%;width:100%;
  font-family:'DM Sans',sans-serif;
  background:#0d1117;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
}

.app{
  width:100%;max-width:430px;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg);
  position:relative;overflow:hidden;
}

/* ── HEADER ── */
.header{
  background:linear-gradient(160deg,var(--brand-dk) 0%,var(--brand-mid) 100%);
  padding:13px 14px;
  display:flex;align-items:center;gap:10px;
  position:relative;z-index:10;
  flex-shrink:0;
  box-shadow:0 2px 12px rgba(10,63,122,.32);
}
.header::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,transparent 55%);
}

.icon-btn{
  width:36px;height:36px;border-radius:10px;
  background:rgba(255,255,255,.13);border:none;cursor:pointer;
  color:rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background .18s ease,transform .15s ease;
  position:relative;z-index:1;
}
.icon-btn:hover{background:rgba(255,255,255,.22);}
.icon-btn:active{transform:scale(.9);}

.h-agent{display:flex;align-items:center;gap:10px;flex:1;min-width:0;position:relative;z-index:1;}

.h-avatar{position:relative;flex-shrink:0;}
.h-avatar-img{
  width:40px;height:40px;border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.5);
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.h-dot{
  position:absolute;bottom:0;right:0;
  width:11px;height:11px;border-radius:50%;
  background:var(--green);
  border:2px solid var(--brand-dk);
  animation:pulse-dot 2.5s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4);}50%{box-shadow:0 0 0 4px rgba(16,185,129,0);}}

.h-info{flex:1;min-width:0;}
.h-name{
  font-size:14.5px;font-weight:700;color:#fff;letter-spacing:.2px;
  display:flex;align-items:center;gap:6px;
}
.h-verified{
  width:14px;height:14px;background:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.h-verified svg{color:var(--brand-mid);}
.h-sub{
  font-size:11.5px;color:rgba(255,255,255,.72);
  margin-top:1px;font-weight:400;
  transition:all .25s ease;
  display:flex;align-items:center;gap:5px;
}
.h-sub.typing-state{color:rgba(255,255,255,.92);}
.typing-dots-mini{display:none;gap:2px;align-items:center;}
.typing-dots-mini.show{display:flex;}
.tdm{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85);animation:tdmpulse 1.2s ease infinite;}
.tdm:nth-child(2){animation-delay:.15s;}
.tdm:nth-child(3){animation-delay:.3s;}
@keyframes tdmpulse{0%,60%,100%{opacity:.3;transform:scale(.8);}30%{opacity:1;transform:scale(1.2);}}

/* ── TRUST BAR ── */
.trust-bar{
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--border-2);
  padding:7px 16px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  flex-shrink:0;
}
.t-item{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--text-2);font-weight:600;}
.t-item svg,.t-item .t-ico{flex-shrink:0;}
.t-sep{color:var(--border);font-size:12px;}
.t-stars{color:var(--orange);font-size:11px;letter-spacing:-1px;}

/* ── MESSAGES AREA ── */
.msgs{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 14px 6px;
  display:flex;flex-direction:column;gap:3px;
  position:relative;
}
.msgs::-webkit-scrollbar{width:4px;}
.msgs::-webkit-scrollbar-track{background:transparent;}
.msgs::-webkit-scrollbar-thumb{background:rgba(15,91,168,.12);border-radius:2px;}

/* ── SYSTEM MESSAGES ── */
.sys{
  text-align:center;margin:10px 0;
  animation:fadeUp .4s var(--ease);
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.sys span{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;color:var(--text-2);
  background:rgba(255,255,255,.88);
  border:1px solid var(--border-2);
  border-radius:14px;
  padding:5px 12px;
  font-weight:500;
  letter-spacing:.1px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.sys span.secure{
  color:var(--brand-dk);
  background:#fff;
  border-color:rgba(15,91,168,.2);
  box-shadow:0 2px 6px var(--brand-glow);
  font-weight:600;
}
.sys span.ok{
  color:var(--green-dk);
  background:var(--green-lt);
  border-color:var(--green-border);
  font-weight:600;
}
.sys span.brand{
  color:var(--brand);
  background:var(--brand-lt);
  border-color:rgba(15,91,168,.18);
  font-weight:600;
}
.sys span.gold{
  color:#92600A;
  background:var(--orange-lt);
  border-color:rgba(245,158,11,.2);
  font-weight:600;
}

.spinner-wrap{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px 0;animation:fadeUp .3s ease;}
.spinner{
  width:16px;height:16px;
  border:2px solid rgba(15,91,168,.1);
  border-top-color:var(--brand);
  border-radius:50%;
  animation:spin .7s linear infinite;
}
.spinner-text{font-size:13px;color:var(--text-2);font-weight:500;}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes cardIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
	@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
	@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
	.shake{animation:shake .2s ease 2;}
	
	/* ── MESSAGE ROWS ── */
.row{
  display:flex;gap:8px;align-items:flex-end;
  max-width:88%;animation:msgIn .28s var(--ease);
}
.row.user{align-self:flex-end;flex-direction:row-reverse;max-width:80%;}
.row.agent{align-self:flex-start;}
.row.grouped{margin-top:2px;}
.row:not(.grouped){margin-top:10px;}

.m-avatar{
  width:30px;height:30px;border-radius:50%;
  object-fit:cover;flex-shrink:0;
  border:1.5px solid rgba(15,91,168,.12);
}
.m-avatar.ghost{visibility:hidden;}

.bubble{
  padding:10px 13px 8px;
  border-radius:var(--radius);
  font-size:14px;line-height:1.7;
  word-wrap:break-word;overflow-wrap:break-word;
  position:relative;max-width:100%;
}
.bubble.a{
  background:var(--bubble-a);color:var(--text);
  border-radius:var(--radius-xs) var(--radius) var(--radius) var(--radius);
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.03);
}
.bubble.u{
  background:linear-gradient(150deg,var(--bubble-u-from) 0%,var(--bubble-u-to) 100%);
  color:#fff;
  border-radius:var(--radius) var(--radius-xs) var(--radius) var(--radius);
  box-shadow:0 3px 10px rgba(15,91,168,.22);
}

.b-meta{
  display:flex;align-items:center;justify-content:flex-end;
  gap:4px;margin-top:4px;float:right;margin-left:8px;
}
.b-time{font-size:10.5px;color:rgba(255,255,255,.5);}
.bubble.a .b-time{color:rgba(15,20,25,.28);}
.b-read{font-size:10.5px;transition:color .4s ease;}
.b-read.sending{color:rgba(255,255,255,.35);}
.b-read.sent{color:rgba(255,255,255,.55);}
.b-read.read{color:var(--read-clr);}

/* ── PIX BLOCK — Otimizado para Conversão ── */
.pix-block {
  background: var(--surface);
  border: 1.5px solid var(--border-2);
  border-radius: 20px;
  padding: 16px;
  margin: 10px 0;
  width: 100%;
  max-width: 340px;
  animation: cardIn 0.5s var(--spring);
  box-shadow: 0 10px 25px rgba(0,0,0,0.06);
  align-self: flex-start;
  position: relative;
  overflow: hidden;
}
.pix-block::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, #32BCAD, #1B7FD8);
}
.pix-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.pix-logo-wrap {
  position: relative;
  flex-shrink: 0;
}
.pix-logo {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: #32BCAD;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 12px;
  text-transform: uppercase;
  box-shadow: 0 4px 12px rgba(50,188,173,0.3);
}
.pix-head-info { flex: 1; }
.pix-head-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.2;
}
.pix-head-sub {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.pix-secure-badge {
  display: flex;
  align-items: center;
  gap: 4px;
  background: #ECFDF5;
  border: 1px solid #10B981;
  color: #059669;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 8px;
}

.pix-pricing-card {
  background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%);
  border: 1px solid var(--border-2);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.pix-price-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.pix-original {
  font-size: 12px;
  color: var(--text-3);
  text-decoration: line-through;
}
.pix-savings-tag {
  background: #10B981;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 6px;
  text-transform: uppercase;
}
.pix-price-main {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.pix-currency { font-size: 14px; font-weight: 700; color: var(--text); }
.pix-final {
  font-size: 26px;
  font-weight: 900;
  color: var(--text);
  letter-spacing: -0.5px;
}

.pix-code-container {
  margin-bottom: 12px;
}
.pix-code-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  margin-bottom: 6px;
  display: block;
}
.pix-code-field {
  background: #fff;
  border: 2px solid var(--brand);
  border-radius: 12px;
  display: flex;
  align-items: center;
  padding: 4px 4px 4px 12px;
  transition: all 0.2s ease;
  cursor: pointer;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(15, 91, 168, 0.08);
}
.pix-code-text {
  flex: 1;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
}
.pix-copy-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--brand);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  padding: 0 16px;
  height: 40px;
  border-radius: 10px;
  flex-shrink: 0;
  transition: all 0.2s ease;
}
.pix-code-field:active .pix-copy-btn { transform: scale(0.96); }
.pix-code-field.copied { border-color: #10B981; }
.pix-code-field.copied .pix-copy-btn { background: #10B981; }

.pix-footer-info {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 4px;
}
.pix-info-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-2);
  font-weight: 500;
}
.pix-info-item svg { color: #10B981; flex-shrink: 0; }
.pix-timer {
  background: #FFF7ED;
  border: 1px solid #FED7AA;
  color: #9A3412;
  font-size: 11px;
  font-weight: 700;
  padding: 6px 10px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}

/* ── STEPS CARD ── */
.steps-card{
  background:var(--surface);
  border:1px solid var(--border-2);
  border-radius:16px;
  padding:14px;
  margin:6px 0;
  width:100%;max-width:320px;
  animation:cardIn .45s var(--spring);
  box-shadow:0 3px 14px rgba(0,0,0,.04);
  align-self:flex-start;
}
.steps-title{
  font-size:10px;font-weight:700;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;
}
.step-row{
  display:flex;gap:12px;align-items:flex-start;
  position:relative;
}
.step-row:not(:last-child)::after{
  content:'';position:absolute;
  left:13px;top:28px;bottom:-4px;
  width:2px;background:var(--border-2);
}
.step-row:first-child::after{
  background:linear-gradient(to bottom,rgba(16,185,129,.3),var(--border-2));
}
.step-num{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;
}
.step-num.active{
  background:var(--green);color:#fff;
  box-shadow:0 0 0 3px rgba(16,185,129,.15);
}
.step-num.active::after{
  animation:none;
}
.step-num.pending{
  background:var(--surface-2);color:var(--text-3);
  border:1.5px solid var(--border);
}
.step-content{flex:1;padding-bottom:14px;min-width:0;}
.step-label{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;}
.step-row:nth-child(2) .step-label,
.step-row:nth-child(3) .step-label{color:var(--text-3);}
.step-desc{font-size:11px;color:var(--text-3);margin-top:2px;}
.step-row:first-child .step-desc{color:var(--green-dk);font-weight:600;}
.step-wait{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--orange-lt);border:1px solid rgba(245,158,11,.2);
  color:#92600A;font-size:10px;font-weight:600;
  padding:2px 8px;border-radius:20px;margin-top:4px;
}

/* ── AGENT INTRO CARD ── */
.intro-card{
  background:var(--surface);
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin:10px 0 6px;
  border:1px solid var(--border-2);
  box-shadow:0 4px 16px rgba(15,91,168,.1);
  animation:cardIn .5s var(--spring);
  flex-shrink:0;
  align-self:flex-start;
  width:100%;
}
.ic-top{
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-mid) 100%);
  padding:9px 14px;
  display:flex;justify-content:space-between;align-items:center;
}
.ic-top-label{color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:5px;}
.ic-badge{
  background:rgba(255,255,255,.22);color:#fff;
  font-size:8.5px;font-weight:700;padding:3px 9px;
  border-radius:20px;text-transform:uppercase;letter-spacing:.4px;
  display:flex;align-items:center;gap:4px;
}
.ic-body{display:flex;gap:12px;align-items:center;padding:12px 14px 14px;}
.ic-avatar-wrap{position:relative;}
.ic-avatar{
  width:48px;height:48px;border-radius:50%;object-fit:cover;
  border:2.5px solid #fff;
  box-shadow:0 2px 10px rgba(15,91,168,.14);
}
.ic-online{
  position:absolute;bottom:1px;right:1px;
  width:12px;height:12px;border-radius:50%;
  background:var(--green);border:2px solid #fff;
  animation:pulse-dot 2s ease-in-out infinite;
}
.ic-info{flex:1;min-width:0;}
.ic-name{font-size:15px;font-weight:700;color:var(--text);}
.ic-role{font-size:11.5px;color:var(--text-2);margin:2px 0 4px;font-weight:500;}
.ic-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ic-status{font-size:11px;color:var(--green-dk);font-weight:700;display:flex;align-items:center;gap:4px;}
.ic-status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.ic-stars{display:flex;align-items:center;gap:4px;}
.ic-star{color:var(--orange);font-size:11px;}
.ic-rating{font-size:11px;color:var(--text-2);font-weight:600;}
.ic-divider{width:1px;height:12px;background:var(--border-2);}
.ic-orders{font-size:11px;color:var(--text-3);font-weight:500;}

/* ── TYPING ── */
.typing-row{
  display:none;align-items:flex-end;gap:8px;
  align-self:flex-start;
  padding:0 14px 4px;
  animation:fadeUp .25s ease;
  flex-shrink:0;
}
.typing-bubble{
  background:var(--bubble-a);
  border-radius:var(--radius-xs) var(--radius) var(--radius) var(--radius);
  padding:11px 15px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
  display:flex;gap:5px;align-items:center;
}
.td{
  width:6px;height:6px;border-radius:50%;
  background:rgba(15,20,25,.2);
  animation:tdpulse 1.3s ease-in-out infinite;
}
.td:nth-child(2){animation-delay:.17s;}
.td:nth-child(3){animation-delay:.34s;}
@keyframes tdpulse{
  0%,65%,100%{transform:translateY(0);opacity:.25;}
  30%{transform:translateY(-5px);opacity:1;background:var(--brand);}
}

/* ── SCROLL FAB ── */
.scroll-fab{
  position:absolute;bottom:78px;right:14px;
  width:40px;height:40px;border-radius:50%;
  background:var(--brand);color:#fff;border:none;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(15,91,168,.3);
  z-index:20;transition:all .22s var(--spring);
}
.scroll-fab.on{display:flex;}
.scroll-fab:hover{transform:translateY(-2px);}
.scroll-fab:active{transform:scale(.9);}
.fab-badge{
  position:absolute;top:-5px;right:-5px;
  background:#EF4444;color:#fff;font-size:9px;font-weight:700;
  min-width:17px;height:17px;border-radius:10px;
  display:none;align-items:center;justify-content:center;
  border:2px solid var(--bg);padding:0 3px;
}
.fab-badge.on{display:flex;}

/* ── FOOTER ── */
.footer{
  background:var(--surface);
  border-top:1px solid var(--border-2);
  padding:10px 12px;
  padding-bottom:max(12px,env(safe-area-inset-bottom));

<script>
const msgsEl         = document.getElementById('msgs');
const inputEl        = document.getElementById('msgInput');
const inputWrapEl    = document.getElementById('inputWrap');
const sendBtnEl      = document.getElementById('sendBtn');
const typingEl       = document.getElementById('typingRow');

const orderTimeEl    = document.getElementById('orderTime');
const typingAlertEl  = document.getElementById('typingAlert');
const alertMessageEl = document.getElementById('alertMessage');

const AVATAR = "https://files.manuscdn.com/user_upload_by_module/session_file/310519663194389473/cfvjFLWBVqaVcznD.webp";
const ts = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

let lastSender = null;
let atBottom = true;
let unread = 0;
let busy = false;
let chatUnlocked = false;
let alertTimeout = null;

// ── ORDER DATA FROM URL ──────────────────────────────
function parseOrderData() {
  try {
    const p = new URLSearchParams(window.location.search);
    const productsStr = p.get('products');
    const address = p.get('address') || '';
    const deliveryTime = p.get('delivery_time') || '20–30 minutos';
    const subtotal = parseFloat(p.get('subtotal')) || 0;

    let products = [];
    if (productsStr) {
      try {
        products = JSON.parse(decodeURIComponent(productsStr));
      } catch(err) {
        console.error("Erro ao parsear produtos:", err);
      }
    }

    let productName = 'Botijão de Gás P13';
    let productQty = 1;
    let productPrice = subtotal || 89.90;

    if (products.length > 0) {
      productName = products[0].n || productName;
      productQty  = products[0].q || 1;
      // Se tivermos subtotal na URL, usamos ele, senão somamos os produtos
      if (!subtotal) {
        productPrice = products.reduce((acc, curr) => acc + (curr.v * (curr.q || 1)), 0);
      }
    }

    // Extrair localização (Bairro ou Cidade) de forma mais inteligente
    let location = 'sua região';
    if (address) {
      // Exemplo: "Rua dos Girassóis, 112 - Crispim, Itapecerica da Serra/SP"
      const parts = address.split(',').map(p => p.trim());
      let city = '';
      let neighborhood = '';

      // 1. Tentar pegar a cidade (última parte antes da UF, ex: "Itapecerica da Serra/SP")
      const lastPart = parts[parts.length - 1];
      if (lastPart.includes('/')) {
        city = lastPart.split('/')[0].trim();
      }

      // 2. Tentar pegar o bairro
      // Caso A: "Rua ..., 112 - Bairro" (está na primeira ou segunda parte após o '-')
      for (let part of parts) {
        if (part.includes(' - ')) {
          neighborhood = part.split(' - ')[1].trim();
          break;
        }
      }

      // Caso B: Bairro está como uma parte isolada (ex: "Rua, Numero, Bairro, Cidade")
      if (!neighborhood && parts.length >= 3) {
        // Geralmente o bairro é a penúltima parte se a última for Cidade/UF
        neighborhood = parts[parts.length - 2];
      }

      // Limpeza final: Se o bairro ainda contiver números isolados (como o número da casa que sobrou), limpamos
      if (neighborhood) {
        // Remove números sozinhos no início (ex: "112 - Crispim" -> "Crispim")
        neighborhood = neighborhood.replace(/^\d+\s*-\s*/, '').trim();
      }

      // Escolher a melhor opção (prioridade para bairro se for curto e válido)
      if (neighborhood && neighborhood.length > 2) {
        location = neighborhood;
      } else if (city && city.length > 2) {
        location = city;
      }
    }

    return { products, productName, productQty, productPrice, location, address, deliveryTime };
  } catch (e) {
    return {
      products: [], productName: 'Botijão de Gás P13', productQty: 1,
      productPrice: 89.90, city: null, address: '', deliveryTime: '20–30 minutos'
    };
  }
}
const ORDER = parseOrderData();

function updateModal(isEditing = false) {
  if (isEditing) {
    document.querySelector('.modal-title').textContent = 'Editar Pedido';
    confirmModalEl.textContent = 'Salvar Alterações';
    
    if (ORDER.products.length > 0) {
      orderItemsEl.innerHTML = ORDER.products.map((p, idx) => `
        <div class="order-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
            ${p.p ? `<img src="${p.p}" class="oi-img" alt="${p.n||'Produto'}">` : ''}
            <div class="oi-info">
              <input type="text" class="edit-input" value="${p.n}" onchange="updateProductField(${idx}, 'n', this.value)" placeholder="Nome do produto">
            </div>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 4px;">
            <div class="qty-control">
              <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
              <span class="qty-val" id="qty-${idx}">${p.q || 1}</span>
              <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
            </div>
            <div class="oi-price">R$ ${((p.v||0)).toFixed(2).replace('.',',')}</div>
          </div>
        </div>`).join('');
    } else {
      orderItemsEl.innerHTML = `
        <div class="order-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
          <input type="text" class="edit-input" value="${ORDER.productName}" onchange="ORDER.productName = this.value" placeholder="Nome do produto">
          <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 4px;">
            <div class="qty-control">
              <button class="qty-btn" onclick="changeSingleQty(-1)">-</button>
              <span class="qty-val" id="qty-single">${ORDER.productQty}</span>
              <button class="qty-btn" onclick="changeSingleQty(1)">+</button>
            </div>
            <div class="oi-price">R$ ${ORDER.productPrice.toFixed(2).replace('.',',')}</div>
          </div>
        </div>`;
    }
    
    orderAddressEl.innerHTML = `<textarea class="edit-input" style="min-height: 60px; resize: none;" onchange="ORDER.address = this.value">${ORDER.address}</textarea>`;
    
  } else {
    document.querySelector('.modal-title').textContent = 'Resumo do Pedido';
    confirmModalEl.textContent = 'Entendido';
    
    if (ORDER.products.length > 0) {
      orderItemsEl.innerHTML = ORDER.products.map(p => `
        <div class="order-item">
          ${p.p ? `<img src="${p.p}" class="oi-img" alt="${p.n||'Produto'}">` : ''}
          <div class="oi-info">
            <div class="oi-name">${p.n||'Produto'} (x${p.q||1})</div>
            <div class="oi-price">R$ ${((p.v||0)).toFixed(2).replace('.',',')}</div>
          </div>
        </div>`).join('');
    } else {
      orderItemsEl.innerHTML = `
        <div class="order-item">
          <div class="oi-info">
            <div class="oi-name">${ORDER.productName} (x${ORDER.productQty})</div>
            <div class="oi-price">R$ ${ORDER.productPrice.toFixed(2).replace('.',',')}</div>
          </div>
        </div>`;
    }
    orderAddressEl.textContent = ORDER.address || '—';
  }

  if (ORDER.deliveryTime) {
    orderTimeEl.textContent = ORDER.deliveryTime.includes('minutos') 
      ? ORDER.deliveryTime 
      : ORDER.deliveryTime + ' após confirmação';
  }
}

function updateProductField(idx, field, val) {
  ORDER.products[idx][field] = val;
}

function changeQty(idx, delta) {
  const p = ORDER.products[idx];
  const newQty = Math.max(1, (p.q || 1) + delta);
  p.q = newQty;
  document.getElementById(`qty-${idx}`).textContent = newQty;
  recalculateTotal();
}

function changeSingleQty(delta) {
  ORDER.productQty = Math.max(1, ORDER.productQty + delta);
  document.getElementById('qty-single').textContent = ORDER.productQty;
  recalculateTotal();
}

function recalculateTotal() {
  if (ORDER.products.length > 0) {
    ORDER.productPrice = ORDER.products.reduce((acc, curr) => acc + (curr.v * (curr.q || 1)), 0);
  }
  // Atualiza os preços exibidos no modal sem fechar
  const priceEls = document.querySelectorAll('.oi-price');
  if (ORDER.products.length > 0) {
    ORDER.products.forEach((p, i) => {
      if(priceEls[i]) priceEls[i].textContent = `R$ ${(p.v * p.q).toFixed(2).replace('.',',')}`;
    });
  } else {
    if(priceEls[0]) priceEls[0].textContent = `R$ ${ORDER.productPrice.toFixed(2).replace('.',',')}`;

  const totalQty = ORDER.products.length > 0 ? ORDER.products.reduce((a, b) => a + (b.q || 1), 0) : ORDER.productQty;

	let startX = 0;
	let currentX = 0;
	let isDragging = false;

	function showAlert(msg) {
	  const alertEl = document.getElementById('typingAlert');
	  const alertMsgEl = document.getElementById('alertMessage');
	  const contentEl = alertEl.querySelector('.alert-content');
	  if (!alertEl || !alertMsgEl) return;
	  
	  alertMsgEl.textContent = msg;
	  alertEl.classList.add('show');
	  contentEl.style.transform = '';
	  contentEl.style.opacity = '1';
	  
	  clearTimeout(alertTimeout);
	  alertTimeout = setTimeout(() => hideAlert(), 5000);
	}

	function hideAlert() {
	  typingAlertEl.classList.remove('show');
	  const contentEl = typingAlertEl.querySelector('.alert-content');
	  contentEl.style.transform = '';
	  contentEl.style.opacity = '1';
	}

	// Fechar ao clicar em qualquer lugar
	document.addEventListener('mousedown', (e) => {
	  if (typingAlertEl.classList.contains('show')) {
	    hideAlert();
	  }
	});

// Swipe e Mouse Drag para fechar
		const alertContent = document.querySelector('.alert-content');
		
		const startDrag = (x) => {
		  startX = x;
		  isDragging = true;
		  clearTimeout(alertTimeout);
		  alertContent.style.transition = 'none';
		};

		const moveDrag = (x) => {
		  if (!isDragging) return;
		  currentX = x - startX;
		  alertContent.style.transform = `translateX(${currentX}px)`;
		  alertContent.style.opacity = 1 - Math.abs(currentX) / 200;
		};

		const endDrag = () => {
		  if (!isDragging) return;
		  isDragging = false;
		  alertContent.style.transition = 'all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
		  
		  if (Math.abs(currentX) > 80) {
		    // Animação de saída para o lado
		    const exitX = currentX > 0 ? 400 : -400;
		    alertContent.style.transform = `translateX(${exitX}px)`;
		    alertContent.style.opacity = '0';
		    setTimeout(hideAlert, 300);
		  } else {
		    alertContent.style.transform = 'translateX(0)';
		    alertContent.style.opacity = '1';
		    alertTimeout = setTimeout(() => hideAlert(), 5000);
		  }
		  currentX = 0;
		};

		// Eventos Touch
		alertContent.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX), {passive: true});
		alertContent.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientX), {passive: true});
		alertContent.addEventListener('touchend', endDrag);

		// Eventos Mouse
		alertContent.addEventListener('mousedown', (e) => {
		  e.stopPropagation(); // Evita o fechamento por clique ao iniciar o drag
		  startDrag(e.clientX);
		});
		window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
		window.addEventListener('mouseup', endDrag);

function addMsg(text, type, newGroup = false) {
  const isGrouped = !newGroup && lastSender === type;
  const row = document.createElement('div');
  row.className = `row ${type}${isGrouped ? ' grouped' : ''}`;

  const safeText = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');

  const avatarHtml = type === 'agent'
    ? `<img src="${AVATAR}" class="m-avatar${isGrouped?' ghost':''}" alt="Thiago">` : '';

  const readHtml = type === 'user' ? `<span class="b-read sending">✓</span>` : '';

  row.innerHTML = `
    ${avatarHtml}
    <div class="bubble ${type === 'user' ? 'u' : 'a'}">
      ${safeText}
      <div class="b-meta">
        <span class="b-time">${ts()}</span>
        ${readHtml}
      </div>
    </div>`;

  msgsEl.appendChild(row);
  lastSender = type;

  let onReadPromise = Promise.resolve();
  if (type === 'user') {
    const readEl = row.querySelector('.b-read');
    onReadPromise = new Promise(resolve => {
      setTimeout(() => {
        readEl.textContent = '✓✓'; readEl.className = 'b-read sent';
        setTimeout(() => { readEl.className = 'b-read read'; resolve(); }, 1300);
      }, 700);
    });
  }

  scrollDown();
  return { row, onReadPromise };
}

        <div class="step-desc" style="color: var(--text-2); font-size: 12px; margin-top: 4px;">Copie o código abaixo e pague no app do seu banco</div>
        
        <div style="margin: 16px 0; background: #F8FAFC; border: 1.5px solid var(--border-2); border-radius: 16px; padding: 16px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div style="display: flex; flex-direction: column;">
              <span style="font-size: 10px; color: var(--text-3); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Total a pagar</span>
              <div style="display: flex; align-items: baseline; gap: 4px;">
                <span style="font-size: 14px; font-weight: 700; color: var(--text);">R$</span>
                <span style="font-size: 24px; font-weight: 900; color: var(--text); letter-spacing: -0.5px;">${finalPrice}</span>
              </div>
            </div>
            <div style="background: #FFF7ED; border: 1px solid #FED7AA; color: #9A3412; padding: 6px 10px; border-radius: 10px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;">
              <div class="spinner" style="width: 12px; height: 12px; border-width: 2px; border-top-color: #F97316;"></div>
              <span>Aguardando</span>
            </div>
          </div>

          <div class="pix-code-field" id="pixField" style="background: #fff; border: 2px solid var(--brand); border-radius: 12px; height: 52px; padding: 4px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(15,91,168,0.1);">
            <div class="pix-code-text" style="flex: 1; padding-left: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${pixCode}</div>
            <div class="pix-copy-btn" id="pixCopyBtn" style="height: 44px; padding: 0 20px; background: var(--brand); border-radius: 10px; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: all 0.2s; animation: pulse-brand 2s infinite;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              Copiar
            </div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 8px; color: #059669; font-size: 12px; font-weight: 600;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>Confirmação automática e instantânea</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 11px; font-weight: 500;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            O código expira em 30 minutos
          </div>
        </div>
      </div>
    </div>
    <div class="step-row">
      <div class="step-num pending">2</div>
      <div class="step-content" style="padding-bottom: 20px;">
        <div class="step-label" style="font-size: 14px; font-weight: 700; color: var(--text-3);">Preparação e Envio</div>
        <div class="step-desc" style="font-size: 12px; color: var(--text-3);">O entregador será acionado após o pagamento</div>
      </div>
    </div>
    <div class="step-row">
      <div class="step-num pending">3</div>
      <div class="step-content" style="padding-bottom: 0;">
        <div class="step-label" style="font-size: 14px; font-weight: 700; color: var(--text-3);">Entrega em Tempo Real</div>
        <div class="step-desc" style="font-size: 12px; color: var(--text-3);">Acompanhe o mapa do entregador até sua casa</div>
      </div>
    </div>`;
  msgsEl.appendChild(card);
  scrollDown();

  const field = card.querySelector('#pixField');
  const copyBtn = card.querySelector('#pixCopyBtn');
  field.onclick = () => {
    navigator.clipboard.writeText(pixCode).catch(() => {});
    field.classList.add('copied');
    const originalContent = copyBtn.innerHTML;
    copyBtn.innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      Copiado
    `;
    setTimeout(() => {
      field.classList.remove('copied');
      copyBtn.innerHTML = originalContent;
    }, 2000);
  };
}

// ── TYPING STATE ─────────────────────────────────────
function setTyping(on) {
  typingEl.style.display = on ? 'flex' : 'none';
  if (on) {
    statusTextEl.textContent = 'Digitando';
    headerStatusEl.classList.add('typing-state');
    typingDotsMini.classList.add('show');
    scrollDown();
  } else {
    statusTextEl.textContent = 'Online · Diskgas';
    headerStatusEl.classList.remove('typing-state');
    typingDotsMini.classList.remove('show');
  }
}

// ── CONVERSATION ENGINE ──────────────────────────────
function getGreeting() {
  const h = new Date().getHours();
  if (h >= 5  && h < 12) return 'Bom dia';
  if (h >= 12 && h < 18) return 'Boa tarde';
  return 'Boa noite';
}

function pause(ms) { return new Promise(r => setTimeout(r, ms)); }

async function agentSay(text, newGroup = false) {
  const words = text.split(' ').length;
  const typingMs = Math.max(1000, Math.min(words * 170 + 500, 3200));
  setTyping(true);
  await pause(typingMs);
  setTyping(false);
  addMsg(text, 'agent', newGroup);
  await pause(180);
}

async function runConversation() {
  const { productName, location, productPrice } = ORDER;
  const gr   = getGreeting();
  const ordersNearby = Math.floor(Math.random() * 7) + 6;

  // 1 — Saudação
  await agentSay(`${gr}`);
  await pause(500);

  // 2 — Apresentação
  await agentSay(`Sou Thiago, vendedor autorizado Diskgas em ${location} e região`);
  await pause(1600);

  // 3 — Confirmar pedido
  const action = await showOrderConfirmation();
  await pause(800);

  if (action === 'change') {
    await agentSay(`Sem problemas! Pode me falar o que deseja alterar ou clique no ícone do carrinho no topo para ajustar seu pedido.`);
    return; // Para a execução automática para o usuário interagir
  }

  await agentSay(`Perfeito! Vou gerar o código Pix para você agora:`);
  await pause(600);

  const loadingSp = addSpinner("Preparando...");
  await pause(4000);
  loadingSp.remove();

    // Steps card com Pix integrado
  showDeliverySteps();
  await pause(800);

  // 7 — Compromisso de entrega
  await agentSay(`Assim que o sistema identificar o Pix, o entregador sai imediatamente. Estou aqui acompanhando tudo! 🚀`, true);
}

// ── SEND (user messages após desbloqueio) ────────────
async function doSend() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true;
  
  // Limpa o input imediatamente para feedback tátil
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtnEl.disabled = true;

  // Adiciona a mensagem do usuário
  const { row, onReadPromise } = addMsg(text, 'user');
  
  // Pequena pausa para simular tentativa de envio
  await pause(800);

  // Transforma a mensagem do usuário em um aviso de sistema profissional (estilo WhatsApp/Telegram de erro)
  const bubble = row.querySelector('.bubble');
  bubble.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
  bubble.style.background = '#FEF2F2';
  bubble.style.color = '#991B1B';
  bubble.style.border = '1px solid #FCA5A5';
  bubble.style.boxShadow = '0 2px 8px rgba(153, 27, 27, 0.08)';
  
  // Substitui o texto da mensagem pelo aviso de forma elegante
  bubble.innerHTML = `
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; margin-bottom: 4px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      Mensagem não enviada
    </div>
    <div style="font-size: 11px; opacity: 0.9; line-height: 1.5; font-weight: 500;">
      Apenas clientes com pedidos em fase de entrega podem enviar mensagens.
    </div>
  `;

  // Vibração visual sutil (shake) para indicar erro
  row.classList.add('shake');
  setTimeout(() => row.classList.remove('shake'), 400);
  
  busy = false;
  sendBtnEl.disabled = !inputEl.value.trim();
}

// ── INIT ─────────────────────────────────────────────
const FIRST_MSG = 'Olá! Gostaria de fazer meu pedido.';

(async () => {
  updateModal();

  const { onReadPromise } = addMsg(FIRST_MSG, 'user');

  await pause(500);
  const connSys = addSys('Conexão criptografada estabelecida', 'secure');

  await pause(700);
  const sp = addSpinner();
  const searchSys = addSys('Buscando consultor disponível...', 'brand');

  await pause(1600);
  sp.remove();
  connSys.parentElement.remove();
  searchSys.textContent = '';
  searchSys.className = 'ok';
  searchSys.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Thiago Callegari conectado`;

  await pause(500);
  showIntroCard();

  busy = false; // Chat liberado desde o início
  await onReadPromise;

  await runConversation();
})();
</script>
