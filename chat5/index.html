<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diskgas — Atendimento Profissional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* Premium Blue Palette (Based on Atlassian/Professional standards) */
  --brand:      #0052CC;
  --brand-dk:   #0747A6;
  --brand-lt:   #DEEBFF;
  --brand-mid:  #0065FF;
  
  --bg:         #F4F5F7;
  --surface:    #FFFFFF;
  --surface-2:  #FAFBFC;
  
  --text:       #172B4D;
  --text-2:     #5E6C84;
  --text-3:     #8993A4;

  --border:     #DFE1E6;
  
  --bubble-a:   #FFFFFF;
  --bubble-u:   #0052CC;

  --green:      #36B37E;
  --green-dk:   #1D7F54;
  
  --radius:     18px;
  --radius-sm:  12px;
  
  --sh-sm: 0 1px 2px rgba(9, 30, 66, 0.08);
  --sh-md: 0 4px 8px -2px rgba(9, 30, 66, 0.25), 0 0 1px rgba(9, 30, 66, 0.31);
}

html,body{
  height:100%;width:100%;
  font-family:'Inter', 'DM Sans', sans-serif;
  background:#091E42;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
}

.app{
  width:100%;max-width:430px;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg);
  position:relative;overflow:hidden;
}

/* ─── Header (Dimensions from original) ─── */
.header{
  background: var(--surface);
  padding: 13px 14px;
  display: flex;
  align-items: center;
  gap: 11px;
  border-bottom: 1px solid var(--border);
  z-index: 10;
}

.back-btn{
  width:34px;height:34px;border-radius:9px;
  background:var(--bg);border:none;cursor:pointer;
  color:var(--text-2);font-size:17px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}

.h-agent{display:flex;align-items:center;gap:11px;flex:1;min-width:0;}

.h-avatar{position:relative;}
.h-avatar-img{
  width:40px;height:40px;border-radius:50%;
  object-fit:cover;
  border:2px solid var(--brand-lt);
}
.h-status-dot{
  position:absolute;bottom:1px;right:1px;
  width:11px;height:11px;border-radius:50%;
  background:var(--green);
  border:2px solid var(--surface);
}

.h-info{flex:1;min-width:0;}
.h-name{font-size:14.5px;font-weight:700;color:var(--text);letter-spacing:.1px;}
.h-sub{
  font-size:11.5px;color:var(--green);
  font-weight:600;
}

/* ─── Messages ─── */
.msgs{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 14px 12px;
  display:flex;flex-direction:column;gap:12px;
  position:relative;z-index:1;
  scroll-behavior:smooth;
}

.sys-msg{text-align:center;margin:10px 0;animation:fadeIn .4s ease;}
.sys-msg span{
  font-size:11.5px;color:var(--text-secondary);
  background:rgba(9, 30, 66, 0.04);
  border-radius:20px;
  padding:6px 16px;
  font-weight:500;
}

/* Spinner Style */
.spinner-container {
  display: flex;
  justify-content: center;
  margin: 5px 0 15px;
}
.loading-spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--brand-lt);
  border-top: 2px solid var(--brand);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

.msg-row{
  display:flex;gap:8px;align-items:flex-end;
  max-width:88%;margin-bottom:2px;
  animation:msgIn .3s ease-out;
}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;max-width:80%;}
.msg-row.agent{align-self:flex-start;}

.msg-avatar{
  width:28px;height:28px;border-radius:50%;
  object-fit:cover;flex-shrink:0;
  border: 1px solid var(--border);
}

@keyframes msgIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.bubble{
  padding:10px 14px;
  font-size:14.5px;line-height:1.5;
  position:relative;
  box-shadow: var(--sh-sm);
}
.bubble.a{
  background:var(--bubble-a);
  color:var(--text);
  border-radius:4px 18px 18px 18px;
  border: 1px solid var(--border);
}
.bubble.u{
  background:var(--bubble-u);
  color:#FFFFFF;
  border-radius:18px 18px 4px 18px;
}

.b-meta{
  display:flex;align-items:center;justify-content:flex-end;
  gap:3px;margin-top:4px;
  font-size:10px;
  opacity: 0.7;
}

/* ─── Agent Intro Card (Premium Refined) ─── */
.agent-intro{
  background:var(--surface);
  border-radius:var(--radius-sm);
  overflow:hidden;
  margin:4px 0 8px;
  box-shadow: var(--sh-md);
  border:1px solid var(--border);
  width:100%;
  flex-shrink: 0;
  animation: cardIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes cardIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

.ai-header{
  background: var(--brand-lt);
  padding: 8px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ai-header-title{
  color: var(--brand-dk);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.ai-badge-verified{
  background: var(--brand);
  color: #fff;
  font-size: 9px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 3px;
}

.ai-body{
  display:flex;gap:14px;align-items:center;
  padding:14px;
}
.ai-img{
  width:52px;height:52px;border-radius:50%;
  object-fit:cover;
  border:2px solid var(--brand-lt);
}
.ai-info{flex:1;min-width:0;}
.ai-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px;}
.ai-role{font-size:12px;color:var(--text-2);margin-bottom:4px;}

.ai-stats{
  display: flex;
  border-top: 1px solid var(--border);
  background: var(--surface-2);
}
.ai-stat-item{
  flex: 1;
  padding: 8px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.ai-stat-item:last-child { border-right: none; }
.ai-stat-val{ font-size: 13px; font-weight: 700; color: var(--brand); display: block; }
.ai-stat-lbl{ font-size: 9px; color: var(--text-3); text-transform: uppercase; font-weight: 600; }

/* ─── Typing ─── */
.typing-row{
  display:none;align-items:flex-end;gap:8px;
  align-self:flex-start; margin: 0 14px 10px;
}
.typing-bubble{
  background:var(--surface);
  border-radius:4px 18px 18px 18px;
  padding:12px 16px;
  box-shadow:var(--sh-sm);
  display:flex;gap:4px;
  border: 1px solid var(--border);
}
.typing-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--text-3);
  animation:typePulse 1.4s infinite;
}
.typing-dot:nth-child(2){animation-delay:.2s;}
.typing-dot:nth-child(3){animation-delay:.4s;}
@keyframes typePulse{ 0%,60%,100%{transform:translateY(0);opacity:.4;} 30%{transform:translateY(-5px);opacity:1;} }

/* ─── Footer (Dimensions from original) ─── */
.footer{
  background: var(--surface);
  border-top:1px solid var(--border);
  padding:11px 12px 15px;
}
.input-row{display:flex;gap:8px;align-items:flex-end;}
.input-wrap{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--bg);
  border-radius:24px;
  padding:10px 15px;
  border:1.5px solid var(--border);
  transition: all 0.2s;
}
.input-wrap:focus-within{
  background: #FFF;
  border-color: var(--brand);
  box-shadow: 0 0 0 2px var(--brand-lt);
}
.msg-input{
  flex:1;border:none;outline:none;
  font-size:14.5px;
  background:transparent;
  color: var(--text);
  font-family: inherit;
}
.send-btn{
  width:46px;height:46px;border-radius:50%;
  background: var(--brand);
  color:#fff; border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition: transform 0.2s;
  box-shadow: 0 2px 8px rgba(0, 82, 204, 0.2);
  flex-shrink: 0;
}
.send-btn:hover{ background: var(--brand-dk); transform: scale(1.05); }
.send-btn:active{ transform: scale(0.95); }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <button class="back-btn">←</button>
    <div class="h-agent">
      <div class="h-avatar">
        <img src="https://i.pravatar.cc/150?u=carlos-diskgas" class="h-avatar-img" alt="Avatar">
        <div class="h-status-dot"></div>
      </div>
      <div class="h-info">
        <div class="h-name">Carlos Oliveira</div>
        <div class="h-sub">Online agora</div>
      </div>
    </div>
  </header>

  <div class="msgs" id="msgs">
    <!-- Messages will appear here -->
  </div>

  <div class="typing-row" id="typingRow">
    <img src="https://i.pravatar.cc/150?u=carlos-diskgas" class="msg-avatar" alt="Avatar">
    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="input-row">
      <div class="input-wrap">
        <input type="text" class="msg-input" id="msgInput" placeholder="Escreva sua mensagem...">
      </div>
      <button class="send-btn" id="sendBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </footer>
</div>

<script>
const msgsEl = document.getElementById('msgs');
const inputEl = document.getElementById('msgInput');
const sendBtnEl = document.getElementById('sendBtn');
const typingRowEl = document.getElementById('typingRow');

const agentAvatar = "https://i.pravatar.cc/150?u=carlos-diskgas";
const now = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

let isFirstContact = true;

function scrollToBottom() {
  msgsEl.scrollTo({ top: msgsEl.scrollHeight, behavior: 'smooth' });
  setTimeout(() => { msgsEl.scrollTop = msgsEl.scrollHeight; }, 150);
}

function addMsg(text, type) {
  const row = document.createElement('div');
  row.className = `msg-row ${type}`;
  
  let avatarHtml = '';
  if (type === 'agent') {
    avatarHtml = `<img src="${agentAvatar}" class="msg-avatar" alt="Avatar">`;
  }

  row.innerHTML = `
    ${avatarHtml}
    <div class="bubble ${type === 'user' ? 'u' : 'a'}">
      ${text}
      <div class="b-meta">${now()}</div>
    </div>
  `;
  msgsEl.appendChild(row);
  scrollToBottom();
}

function addSystemMsg(text, showSpinner = false) {
  const div = document.createElement('div');
  div.className = 'sys-msg';
  const span = document.createElement('span');
  span.innerHTML = text;
  div.appendChild(span);
  msgsEl.appendChild(div);
  
  let spinner = null;
  if (showSpinner) {
    spinner = document.createElement('div');
    spinner.className = 'spinner-container';
    spinner.innerHTML = '<div class="loading-spinner"></div>';
    msgsEl.appendChild(spinner);
  }
  
  scrollToBottom();
  return { container: div, textSpan: span, spinner: spinner };
}

function showAgentIntro() {
  const card = document.createElement('div');
  card.className = 'agent-intro';
  card.innerHTML = `
    <div class="ai-header">
      <div class="ai-header-title">Consultor Disponível</div>
      <div class="ai-badge-verified">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        Verificado
      </div>
    </div>
    <div class="ai-body">
      <img src="${agentAvatar}" class="ai-img" alt="Carlos">
      <div class="ai-info">
        <div class="ai-name">Carlos Oliveira</div>
        <div class="ai-role">Especialista em Atendimento</div>
        <div style="font-size: 11px; color: var(--green); font-weight: 600;">✓ Responde em poucos minutos</div>
      </div>
    </div>
    <div class="ai-stats">
      <div class="ai-stat-item"><span class="ai-stat-val">4.9</span><span class="ai-stat-lbl">Avaliação</span></div>
      <div class="ai-stat-item"><span class="ai-stat-val">1.5k+</span><span class="ai-stat-lbl">Vendas</span></div>
      <div class="ai-stat-item"><span class="ai-stat-val">5 anos</span><span class="ai-stat-lbl">Exp.</span></div>
    </div>
  `;
  msgsEl.appendChild(card);
  scrollToBottom();
}

async function handleResponseFlow() {
  if (isFirstContact) {
    await new Promise(r => setTimeout(r, 800));
    const sysObj = addSystemMsg("Localizando o melhor consultor...", true);

    await new Promise(r => setTimeout(r, 1800));
    if (sysObj.spinner) sysObj.spinner.remove();
    
    sysObj.textSpan.innerHTML = "Consultor Carlos conectado ✓";
    sysObj.textSpan.style.color = "var(--green-dk)";
    sysObj.textSpan.style.background = "var(--brand-lt)";

    await new Promise(r => setTimeout(r, 600));
    showAgentIntro();
    isFirstContact = false;
  }

  await new Promise(r => setTimeout(r, 1200));
  typingRowEl.style.display = 'flex';
  scrollToBottom();

  await new Promise(r => setTimeout(r, 2000));
  typingRowEl.style.display = 'none';
  
  const agentMsgs = msgsEl.querySelectorAll('.msg-row.agent');
  if (agentMsgs.length === 0) {
      addMsg("Olá! Sou o Carlos Oliveira. É um prazer te atender. Como posso te ajudar hoje?", 'agent');
  } else {
      addMsg("Entendi. Estou verificando os detalhes para você, só um momento...", 'agent');
  }
}

function sendMessage() {
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = '';
  addMsg(text, 'user');
  handleResponseFlow();
}

sendBtnEl.onclick = sendMessage;
inputEl.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

window.onload = async () => {
  addSystemMsg("Conexão segura estabelecida");
  await new Promise(r => setTimeout(r, 1000));
  addMsg("Olá! Gostaria de saber mais sobre os produtos.", 'user');
  handleResponseFlow();
};
</script>
</body>
</html>
