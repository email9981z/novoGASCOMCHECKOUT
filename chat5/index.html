<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diskgas — Atendimento Verificado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --brand:      #0F5BA8;
  --brand-dk:   #0A3F7A;
  --brand-lt:   #F0F7FF;
  --bg:         #F8FAFC;
  --surface:    #FFFFFF;
  --text:       #0F172A;
  --text-2:     #475569;
  --text-3:     #94A3B8;
  --border:     #E2E8F0;
  --green:      #10B981;
  --green-dk:   #059669;
  --radius:     18px;
  --sh-sm: 0 2px 4px rgba(15,23,42,.04);
  --sh-md: 0 4px 12px rgba(15,23,42,.08);
  --ease:   cubic-bezier(.2,.8,.2,1);
}

html,body{
  height:100%;width:100%;
  font-family:'Plus Jakarta Sans', sans-serif;
  background:#020617;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
}

.app{
  width:100%;max-width:430px;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg);
  position:relative;overflow:hidden;
}

/* ─── Header: The Authority Center ─── */
.header{
  background: var(--surface);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  z-index: 10;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 4px 20px rgba(0,0,0,.04);
}

.h-top{
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.h-agent{
  display: flex;
  align-items: center;
  gap: 12px;
}

.h-avatar-wrap{
  position: relative;
}

.h-avatar-img{
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--brand-lt);
  box-shadow: 0 4px 8px rgba(15,91,168,.1);
}

.h-badge-check{
  position: absolute;
  bottom: -2px;
  right: -2px;
  background: var(--brand);
  color: #fff;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #fff;
  box-shadow: 0 2px 4px rgba(0,0,0,.1);
}

.h-info{
  display: flex;
  flex-direction: column;
}

.h-name-row{
  display: flex;
  align-items: center;
  gap: 6px;
}

.h-name{
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.3px;
}

.h-verified-tag{
  font-size: 9px;
  font-weight: 700;
  color: var(--brand);
  background: var(--brand-lt);
  padding: 2px 6px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.h-status{
  font-size: 12px;
  color: var(--green-dk);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 1px;
}

.h-status-dot{
  width: 6px;
  height: 6px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

.h-stats-bar{
  display: flex;
  align-items: center;
  gap: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.h-stat-item{
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-2);
  font-weight: 600;
}

.h-stat-item svg{
  color: var(--brand);
  opacity: 0.8;
}

@keyframes pulse {
  0% { transform: scale(0.95); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.6; }
  100% { transform: scale(0.95); opacity: 1; }
}

/* ─── Messages ─── */
.msgs{
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.sys-msg{
  text-align: center;
  margin: 8px 0;
}

.sys-msg span{
  font-size: 11px;
  color: var(--text-3);
  background: var(--brand-lt);
  padding: 4px 12px;
  border-radius: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s ease;
}

/* Harmonious Spinner */
.spinner {
  width: 12px;
  height: 12px;
  border: 2px solid rgba(15, 91, 168, 0.1);
  border-top: 2px solid var(--brand);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.msg-row{
  display: flex;
  max-width: 85%;
  animation: msgIn .4s var(--ease) forwards;
  opacity: 0;
}

.msg-row.user{ align-self: flex-end; }
.msg-row.agent{ align-self: flex-start; }

@keyframes msgIn{
  from{ opacity: 0; transform: translateY(10px); }
  to{ opacity: 1; transform: translateY(0); }
}

.bubble{
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 15px;
  line-height: 1.5;
  box-shadow: var(--sh-sm);
}

.bubble.a{
  background: #fff;
  color: var(--text);
  border-bottom-left-radius: 4px;
  border: 1px solid var(--border);
}

.bubble.u{
  background: var(--brand);
  color: #fff;
  border-bottom-right-radius: 4px;
}

.b-meta{
  display: flex;
  justify-content: flex-end;
  font-size: 10px;
  margin-top: 4px;
  opacity: 0.6;
}

/* ─── Typing ─── */
.typing-row{
  display: none;
  align-items: center;
  gap: 10px;
  padding: 0 16px 12px;
}

.typing-avatar{
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
}

.typing-bubble{
  background: #fff;
  padding: 12px 16px;
  border-radius: var(--radius);
  border-bottom-left-radius: 4px;
  border: 1px solid var(--border);
  display: flex;
  gap: 4px;
}

.dot{
  width: 6px;
  height: 6px;
  background: var(--brand);
  border-radius: 50%;
  animation: type 1.2s infinite;
  opacity: 0.3;
}
.dot:nth-child(2){ animation-delay: .2s; }
.dot:nth-child(3){ animation-delay: .4s; }

@keyframes type {
  0%, 100% { transform: scale(1); opacity: 0.3; }
  50% { transform: scale(1.3); opacity: 1; }
}

/* ─── Footer ─── */
.footer{
  background: #fff;
  padding: 16px 20px 24px;
  border-top: 1px solid var(--border);
}

.input-wrap{
  display: flex;
  background: var(--bg);
  border-radius: 30px;
  padding: 6px 6px 6px 20px;
  align-items: center;
}

.msg-input{
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-size: 15px;
  font-weight: 500;
}

.send-btn{
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.trust-tag{
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 12px;
  font-size: 10px;
  color: var(--text-3);
  font-weight: 700;
  text-transform: uppercase;
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="h-top">
      <div class="h-agent">
        <div class="h-avatar-wrap">
          <img src="https://i.pravatar.cc/100?u=carlos" class="h-avatar-img" alt="Carlos">
          <div class="h-badge-check">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          </div>
        </div>
        <div class="h-info">
          <div class="h-name-row">
            <span class="h-name">Carlos Oliveira</span>
            <span class="h-verified-tag">Oficial</span>
          </div>
          <div class="h-status">
            <div class="h-status-dot"></div>
            Online agora
          </div>
        </div>
      </div>
      <div style="background: var(--brand-lt); padding: 8px; border-radius: 12px; color: var(--brand);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      </div>
    </div>
    
    <div class="h-stats-bar">
      <div class="h-stat-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        4.9/5 Avaliação
      </div>
      <div class="h-stat-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        Identidade Verificada
      </div>
    </div>
  </header>

  <div class="msgs" id="msgs"></div>

  <div class="typing-row" id="typingRow">
    <img src="https://i.pravatar.cc/100?u=carlos" class="typing-avatar" alt="Avatar">
    <div class="typing-bubble">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="input-wrap">
      <input type="text" class="msg-input" id="msgInput" placeholder="Digite sua dúvida aqui...">
      <button class="send-btn" id="sendBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="trust-tag">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Atendimento Seguro Diskgas
    </div>
  </footer>
</div>

<script>
const msgsEl = document.getElementById('msgs');
const inputEl = document.getElementById('msgInput');
const sendBtnEl = document.getElementById('sendBtn');
const typingRowEl = document.getElementById('typingRow');

const now = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

function scrollToBottom() {
  setTimeout(() => { msgsEl.scrollTop = msgsEl.scrollHeight; }, 100);
}

function addMsg(text, type) {
  const row = document.createElement('div');
  row.className = `msg-row ${type}`;
  row.innerHTML = `
    <div class="bubble ${type === 'user' ? 'u' : 'a'}">
      ${text}
      <div class="b-meta"><span>${now()}</span></div>
    </div>
  `;
  msgsEl.appendChild(row);
  scrollToBottom();
}

function addSystemMsg(text, showSpinner = false) {
  const div = document.createElement('div');
  div.className = 'sys-msg';
  const span = document.createElement('span');
  
  if (showSpinner) {
    const spinner = document.createElement('div');
    spinner.className = 'spinner';
    span.appendChild(spinner);
  }
  
  const textNode = document.createElement('div');
  textNode.innerHTML = text;
  span.appendChild(textNode);
  
  div.appendChild(span);
  msgsEl.appendChild(div);
  scrollToBottom();
  return span; // Retorna o span para permitir edição posterior
}

async function handleFlow() {
  const isFirstAgentMsg = msgsEl.querySelectorAll('.msg-row.agent').length === 0;

  if (isFirstAgentMsg) {
    await new Promise(r => setTimeout(r, 800));
    const sysText = addSystemMsg("Conectando ao consultor...", true);
    
    // Transição para "Consultor Conectado"
    await new Promise(r => setTimeout(r, 2000));
    sysText.innerHTML = "Consultor Conectado ✓";
    sysText.style.color = "var(--green-dk)";
    sysText.style.background = "#ECFDF5"; // Verde muito leve
    sysText.style.padding = "6px 16px";
    
    await new Promise(r => setTimeout(r, 800));
  } else {
    await new Promise(r => setTimeout(r, 600));
  }

  typingRowEl.style.display = 'flex';
  scrollToBottom();

  await new Promise(r => setTimeout(r, 2500));
  typingRowEl.style.display = 'none';
  
  const responses = [
    "Olá! Sou o Carlos, consultor oficial Diskgas. Como posso te ajudar hoje? 😊",
    "Com certeza! Vou verificar as melhores opções para você agora mesmo.",
    "Entendido. Temos condições especiais para o que você procura. Gostaria de ver?"
  ];
  
  const msgCount = msgsEl.querySelectorAll('.msg-row.agent').length;
  addMsg(msgCount === 0 ? responses[0] : responses[Math.floor(Math.random() * 2) + 1], 'agent');
}

function send() {
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = '';
  addMsg(text, 'user');
  handleFlow();
}

inputEl.onkeypress = (e) => { if(e.key === 'Enter') send(); };
sendBtnEl.onclick = send;

window.onload = () => {
  addSystemMsg("Conexão Criptografada");
  setTimeout(() => {
    addMsg("Olá! Gostaria de saber mais sobre os produtos.", 'user');
    handleFlow();
  }, 800);
};
</script>
</body>
</html>
